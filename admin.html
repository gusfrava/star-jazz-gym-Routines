<style>
:root {
  --bg:#0a0e1a; --bg-elev:#10172a; --bg-elev-2:#1a2440; --bg-elev-3:#243156;
  --border:rgba(255,255,255,0.08); --border-strong:rgba(255,255,255,0.14);
  --text:#f0f4ff; --text-muted:#8b96b3; --text-dim:#5a6585;
  --accent:#3b9eff; --accent-bg:rgba(59,158,255,0.12); --accent-border:rgba(59,158,255,0.35);
  --accent-grad:linear-gradient(135deg,#3b9eff 0%,#6ec2ff 100%);
  --success:#34d399; --success-bg:rgba(52,211,153,0.12);
  --danger:#f87171; --danger-bg:rgba(248,113,113,0.12); --danger-border:rgba(248,113,113,0.35);
  --warning:#fbbf24; --warning-bg:rgba(251,191,36,0.12); --warning-border:rgba(251,191,36,0.35);
  --radius:14px;
  --font-sans:'Geist',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-mono:'Geist Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:radial-gradient(ellipse 70% 45% at 50% -20%,rgba(59,158,255,0.16),transparent 70%),var(--bg);color:var(--text);font-family:var(--font-sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
#app{max-width:1180px;margin:0 auto;padding:24px 18px 80px;min-height:100vh}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-0.02em} h1{font-size:28px} h2{font-size:18px} h3{font-size:15px}
button,input,select,textarea{font:inherit}
button{cursor:pointer;color:var(--text);background:var(--bg-elev);border:1px solid var(--border-strong);border-radius:10px;padding:9px 13px;font-weight:500;transition:.15s;font-size:13px}
button:hover{background:var(--bg-elev-2);border-color:var(--accent-border)}
button:active{transform:scale(0.97)}
button.primary{background:var(--accent-grad);border-color:transparent;color:white;box-shadow:0 4px 16px rgba(59,158,255,.25);font-weight:600}
button.primary:hover{filter:brightness(1.08)}
button.danger{background:transparent;border-color:var(--danger-border);color:var(--danger);font-weight:600}
button.danger:hover{background:var(--danger-bg)}
button.warning{background:transparent;border-color:var(--warning-border);color:var(--warning);font-weight:600}
button.warning:hover{background:var(--warning-bg)}
button.small{padding:5px 10px;font-size:12px}
input,select,textarea{width:100%;background:var(--bg-elev);color:var(--text);border:1px solid var(--border-strong);border-radius:10px;padding:11px 13px;font-size:14px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-bg)}
.card{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:0 4px 18px rgba(0,0,0,.22)}
.muted{color:var(--text-muted)} .dim{color:var(--text-dim)} .mono{font-family:var(--font-mono)}
.row{display:flex;align-items:center;gap:10px}.spacer{flex:1}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.two-col{display:grid;grid-template-columns:340px minmax(0,1fr);gap:14px}
.stat{padding:15px}.stat .value{font-family:var(--font-mono);font-size:28px;font-weight:700}.stat .label{font-family:var(--font-mono);font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.1em}
.section-label{font-family:var(--font-mono);font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px;font-weight:500}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:11px;background:var(--accent-bg);color:var(--accent);border:1px solid var(--accent-border);font-weight:600;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.05em}
.danger-pill{background:var(--danger-bg);color:var(--danger);border-color:var(--danger-border)}
.warning-pill{background:var(--warning-bg);color:var(--warning);border-color:var(--warning-border)}
.success-pill{background:var(--success-bg);color:var(--success);border-color:rgba(52,211,153,0.35)}
.dim-pill{background:var(--bg-elev-2);color:var(--text-dim);border-color:var(--border-strong)}
.list-btn{display:block;width:100%;text-align:left;margin-bottom:8px;padding:12px;background:var(--bg-elev);border:1px solid var(--border);border-radius:12px;cursor:pointer;font:inherit;color:inherit;transition:.15s}
.list-btn:hover{background:var(--bg-elev-2);border-color:var(--border-strong)}
.list-btn.active{background:var(--accent-bg);border-color:var(--accent-border)}
.table{width:100%;border-collapse:collapse}
.table th,.table td{border-bottom:1px solid var(--border);padding:10px 8px;text-align:left;vertical-align:middle}
.table th{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.08em;font-family:var(--font-mono);font-weight:500}
.tab-bar{display:inline-flex;background:var(--bg-elev);border:1px solid var(--border);border-radius:12px;padding:4px;gap:4px;margin-bottom:14px}
.tab-bar button{padding:7px 14px;border:none;background:transparent;font-size:13px;color:var(--text-muted);border-radius:8px;font-weight:500}
.tab-bar button:hover{color:var(--text);background:var(--bg-elev-2)}
.tab-bar button.active{background:var(--accent-grad);color:#fff;font-weight:600;box-shadow:0 2px 8px rgba(59,158,255,.25)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(10px);opacity:0;pointer-events:none;background:var(--bg-elev-3);border:1px solid var(--accent-border);border-radius:999px;padding:12px 20px;transition:.25s;z-index:200;font-size:13px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.loader{display:inline-block;width:16px;height:16px;border:2px solid var(--border-strong);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.banner{display:flex;gap:10px;padding:12px 14px;border-radius:12px;font-size:13px;background:var(--warning-bg);border:1px solid rgba(251,191,36,.25);color:var(--warning);align-items:flex-start}
.banner.info{background:var(--accent-bg);color:var(--accent);border-color:var(--accent-border)}
.banner.danger{background:var(--danger-bg);color:var(--danger);border-color:var(--danger-border)}
.modal-bg{position:fixed;inset:0;background:rgba(5,10,25,0.7);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:300;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--bg-elev);border:1px solid var(--border-strong);border-radius:18px;padding:24px;max-width:460px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:pop .3s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
.action-btn{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;font-size:12px;font-weight:500}
.action-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.group-card{transition:.15s}
.group-card.archived{opacity:0.65}
.group-card.trashed{opacity:0.55;border-style:dashed}
.empty{padding:40px 20px;text-align:center;color:var(--text-dim);font-size:13px}
.empty i{font-size:36px;color:var(--text-dim);display:block;margin-bottom:8px}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:4px}
@media (max-width:860px){.grid{grid-template-columns:repeat(2,1fr)}.two-col{grid-template-columns:1fr}#app{padding:18px 14px 70px}}
.pw-wrap{position:relative;width:100%}
.pw-wrap input{width:100%;padding-right:42px}
.pw-toggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:transparent;border:none;color:var(--text-muted);padding:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:6px;transition:.15s}
.pw-toggle:hover{color:var(--accent);background:var(--bg-elev-2)}
.pw-toggle i{font-size:16px}
.forgot-link{display:inline-block;font-size:12px;color:var(--accent);text-decoration:none;cursor:pointer;background:transparent;border:none;padding:4px 0;font-family:inherit}
.forgot-link:hover{text-decoration:underline}
</style>
</head>

const FREE_EX_DB_URL = 'https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/dist/exercises.json';
const FREE_EX_IMG_BASE = 'https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/';
const FREE_EX_CACHE_KEY = 'free_exercise_db_v1';
const FREE_EX_CACHE_TTL = 30 * 24 * 60 * 60 * 1000;

let _freeExIndex = null;
let _freeExById = null;  // also index by free-db id for the override edits
let _freeExLoading = null;

function normalizeExerciseName(s){
  return String(s||'').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, ' ').trim();
}
function freeExImageUrl(p){ return p ? FREE_EX_IMG_BASE + p : null; }

async function loadFreeExerciseDb(){
  if (_freeExIndex) return _freeExIndex;
  if (_freeExLoading) return _freeExLoading;
  _freeExLoading = (async () => {
    try {
      const cached = localStorage.getItem(FREE_EX_CACHE_KEY);
      if (cached){
        const { data, t } = JSON.parse(cached);
        if (Date.now() - t < FREE_EX_CACHE_TTL && Array.isArray(data)){
          buildFreeExIndex(data); return _freeExIndex;
        }
      }
    } catch(e){}
    try {
      const res = await fetch(FREE_EX_DB_URL);
      if (!res.ok) throw new Error('No se pudo descargar');
      const data = await res.json();
      try { localStorage.setItem(FREE_EX_CACHE_KEY, JSON.stringify({ data, t: Date.now() })); } catch(e){}
      buildFreeExIndex(data); return _freeExIndex;
    } catch(e){ console.warn(e); _freeExIndex = new Map(); _freeExById = new Map(); return _freeExIndex; }
  })();
  return _freeExLoading;
}
function buildFreeExIndex(data){
  _freeExIndex = new Map();
  _freeExById = new Map();
  for (const ex of data){
    if (!ex.name || !Array.isArray(ex.images) || !ex.images.length) continue;
    const key = normalizeExerciseName(ex.name);
    if (!_freeExIndex.has(key)){
      _freeExIndex.set(key, { id: ex.id, name: ex.name, images: ex.images, primaryMuscles: ex.primaryMuscles, equipment: ex.equipment });
    }
    _freeExById.set(ex.id, { id: ex.id, name: ex.name, images: ex.images, primaryMuscles: ex.primaryMuscles, equipment: ex.equipment });
  }
}
function findFreeExImages(nameEn, nameEs){
  if (!_freeExIndex) return null;
  for (const k of [nameEn, nameEs].filter(Boolean).map(normalizeExerciseName)){
    if (_freeExIndex.has(k)) return _freeExIndex.get(k);
  }
  return null;
}
function searchFreeExDb(query, limit = 20){
  if (!_freeExIndex) return [];
  const q = normalizeExerciseName(query);
  if (!q) return [];
  const matches = [];
  for (const [key, m] of _freeExIndex){
    if (key.includes(q) || q.includes(key)) matches.push({ ...m, score: key === q ? 1000 : key.startsWith(q) ? 500 : 200 });
  }
  matches.sort((a,b) => b.score - a.score || a.name.localeCompare(b.name));
  return matches.slice(0, limit);
}

// Compute current image source for an exercise: override > auto-match > none
function resolveExerciseImage(ex){
  const ov = state.imageOverrides[ex.id];
  if (ov && (ov.preview_url || ov.start_url || ov.finish_url || ov.image_url)){
    const preview = ov.preview_url || ov.image_url || ov.start_url || ov.finish_url;
    const start = ov.start_url || ov.image_url || ov.preview_url || ov.finish_url;
    const finish = ov.finish_url || null;
    return { source: 'override', url: preview, startUrl: start, finishUrl: finish, freeDbId: ov.free_db_match_id || null };
  }
  const auto = findFreeExImages(ex.en, ex.n);
  if (auto){
    const start = freeExImageUrl(auto.images[0]);
    const finish = auto.images.length > 1 ? freeExImageUrl(auto.images[1]) : null;
    return { source: 'auto', url: start, startUrl: start, finishUrl: finish, freeDbId: auto.id };
  }
  return { source: 'none', url: null, startUrl: null, finishUrl: null, freeDbId: null };
}

function logStats(logs){
  let sessions = 0, sets = 0, totalVol = 0, maxW = 0;
  Object.values(logs || {}).forEach(userLogs => {
    Object.values(userLogs || {}).forEach(arr => {
      if (!Array.isArray(arr)) return;
      arr.forEach(e => {
        sessions++;
        (e.sets || []).forEach(s => {
          sets++;
          const w = Number(s.weight) || 0;
          const r = Number(s.reps) || 0;
          totalVol += w * r;
          if (w > maxW) maxW = w;
        });
      });
    });
  });
  return { sessions, sets, totalVol, maxW };
}

async function readGroup(groupId){
  const [cfgSnap, usersSnap, sharedSnap, logsSnap, personalSnap] = await Promise.all([
    getDoc(doc(db,'salas',groupId,'meta','config')),
    getDoc(doc(db,'salas',groupId,'meta','users')),
    getDoc(doc(db,'salas',groupId,'routines','shared')),
    getDocs(collection(db,'salas',groupId,'logs')),
    getDocs(collection(db,'salas',groupId,'personalRoutines'))
  ]);
  const config = cfgSnap.exists() ? cfgSnap.data() : { groupName: groupId };
  const users = usersSnap.exists() ? (usersSnap.data().users || []) : [];
  const shared = sharedSnap.exists() ? sharedSnap.data().routine : null;
  const logs = {}; logsSnap.forEach(d => { logs[d.id] = d.data(); });
  const personalRoutines = {}; personalSnap.forEach(d => { personalRoutines[d.id] = d.data().routine || {}; });
  return { id: groupId, config, users, shared, logs, personalRoutines, stats: logStats(logs) };
}

async function discoverGroupIds(){
  // Strategy: derive from accounts + memberships (super-admin reads everything),
  // plus include DEFAULT_GROUP and any explicit load-by-id input.
  const ids = new Set([DEFAULT_GROUP]);
  state.accounts.forEach(a => (a.groups || []).forEach(g => ids.add(g)));
  state.memberships.forEach(m => (m.groups || []).forEach(g => ids.add(g)));
  return [...ids].filter(Boolean).sort();
}

async function loadDashboard(){
  state.loading = true; render();
  try {
    const [accountSnap, membershipSnap] = await Promise.all([
      getDocs(collection(db,'accounts')),
      getDocs(collection(db,'memberships'))
    ]);
    state.accounts = accountSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    state.memberships = membershipSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    state.groupIds = await discoverGroupIds();
    const groups = {};
    for (const groupId of state.groupIds){
      try { groups[groupId] = await readGroup(groupId); }
      catch(e){
        console.error('Group load failed', groupId, e);
        groups[groupId] = { id: groupId, error: e.message, users: [], logs: {}, personalRoutines: {}, config: { groupName: groupId }, stats: logStats({}) };
      }
    }
    state.groups = groups;
    if (!state.groups[state.selectedGroup]) state.selectedGroup = null;
    // Auto-process old trashed groups
    await processOldTrash();
  } catch(e){
    console.error(e);
    toast('No pude cargar el dashboard. Revisa reglas de Firestore.', 'error');
  }
  state.loading = false; render();
}

async function loadGroupById(groupId){
  if (!groupId) return;
  try {
    const data = await readGroup(groupId);
    state.groups[groupId] = data;
    if (!state.groupIds.includes(groupId)) state.groupIds.push(groupId);
    state.selectedGroup = groupId;
    state.loadCode = '';
    toast('Grupo cargado', 'success');
    render();
  } catch(e){
    console.error(e);
    toast('No pude cargar ese grupo.', 'error');
  }
}

async function processOldTrash(){
  // Auto-delete groups in trash for more than TRASH_RETENTION_DAYS
  const cutoff = Date.now() - TRASH_RETENTION_DAYS * 24 * 60 * 60 * 1000;
  for (const [gid, g] of Object.entries(state.groups)){
    const cfg = g.config || {};
    if (cfg.status === 'trashed' && cfg.trashedAt && cfg.trashedAt < cutoff){
      console.log('Auto-purging old trashed group:', gid);
      try { await hardDeleteGroup(gid, { silent: true }); }
      catch(e){ console.error(e); }
    }
  }
}

async function restoreGroup(groupId){

  const cfg = { ...g.config, status: 'active' };
  delete cfg.trashedAt;
  delete cfg.archivedAt;
  await setDoc(doc(db,'salas',groupId,'meta','config'), cfg);
  g.config = cfg;
  toast('Grupo restaurado', 'success'); render();
}

async function hardDeleteGroup(groupId, opts = {}){
  // Delete: meta docs + all subcollection docs + the group root.
  // Order: subcollections first, then meta, then root.
  const collectionsToWipe = ['logs', 'personalRoutines'];
  const metaDocs = ['config', 'users'];
  const routinesDocs = ['shared'];

  for (const sub of collectionsToWipe){
    const snap = await getDocs(collection(db,'salas',groupId,sub));
    for (const d of snap.docs){
      await deleteDoc(doc(db,'salas',groupId,sub,d.id));
    }
  }
  for (const m of metaDocs){
    await deleteDoc(doc(db,'salas',groupId,'meta',m)).catch(()=>{});
  }
  for (const r of routinesDocs){
    await deleteDoc(doc(db,'salas',groupId,'routines',r)).catch(()=>{});
  }
  // The group "root" document might not exist (Firestore subcollections without parent).
  // Still attempt:
  await deleteDoc(doc(db,'salas',groupId)).catch(()=>{});

  // Clean up: remove the group from any account/membership reference
  for (const acc of state.accounts){
    if ((acc.groups || []).includes(groupId)){
      const newGroups = acc.groups.filter(g => g !== groupId);
      const linkedProfiles = { ...(acc.linkedProfiles || {}) };
      delete linkedProfiles[groupId];
      try { await updateDoc(doc(db,'accounts',acc.id), { groups: newGroups, linkedProfiles }); }
      catch(e){ console.error('cleanup account', acc.id, e); }
    }
  }
  for (const m of state.memberships){
    if ((m.groups || []).includes(groupId)){
      const newGroups = m.groups.filter(g => g !== groupId);
      try { await updateDoc(doc(db,'memberships',m.id), { groups: newGroups }); }
      catch(e){ console.error('cleanup membership', m.id, e); }
    }
  }

  delete state.groups[groupId];
  state.groupIds = state.groupIds.filter(g => g !== groupId);
  if (state.selectedGroup === groupId) state.selectedGroup = null;
  if (!opts.silent) toast('Grupo eliminado para siempre', 'success');
  if (!opts.silent) render();
}

async function removeUserFromGroup(groupId, userId, opts = {}){
  // Removes the user from the group's users list. Logs stay (unless purgeLogs=true)
  const g = state.groups[groupId]; if (!g) return;
  const newUsers = (g.users || []).filter(u => u.id !== userId);
  await setDoc(doc(db,'salas',groupId,'meta','users'), { users: newUsers });
  if (opts.purgeLogs){
    await deleteDoc(doc(db,'salas',groupId,'logs',userId)).catch(()=>{});
    await deleteDoc(doc(db,'salas',groupId,'personalRoutines',userId)).catch(()=>{});
    delete g.logs[userId];
    delete g.personalRoutines[userId];
  }
  g.users = newUsers;
  g.stats = logStats(g.logs);
  toast('Usuario eliminado del grupo', 'success');
  render();
}

async function hardDeleteUser(userId){
  // 1. Find all groups the user belongs to (via memberships, accounts, group user lists)
  const affectedGroups = new Set();
  for (const [gid, g] of Object.entries(state.groups)){
    if ((g.users || []).some(u => u.id === userId)) affectedGroups.add(gid);
    if (g.logs && g.logs[userId]) affectedGroups.add(gid);
    if (g.personalRoutines && g.personalRoutines[userId]) affectedGroups.add(gid);
  }

  // 2. Find associated auth account (if linked)
  let linkedAuthUid = null;
  let linkedAuthEmail = null;
  for (const [gid, g] of Object.entries(state.groups)){
    const u = (g.users || []).find(x => x.id === userId);
    if (u && u.authOwnerUid){
      linkedAuthUid = u.authOwnerUid;
      linkedAuthEmail = u.authOwnerEmail;
      break;
    }
  }

  // 3. Wipe user from all groups
  for (const gid of affectedGroups){
    await removeUserFromGroup(gid, userId, { purgeLogs: true });
  }

  // 4. Wipe linked account & membership docs
  if (linkedAuthUid){
    try { await deleteDoc(doc(db,'accounts',linkedAuthUid)); state.accounts = state.accounts.filter(a => a.id !== linkedAuthUid); } catch(e){ console.error(e); }
    try { await deleteDoc(doc(db,'memberships',linkedAuthUid)); state.memberships = state.memberships.filter(m => m.id !== linkedAuthUid); } catch(e){ console.error(e); }
  }

  const note = linkedAuthEmail
    ? `Usuario borrado. Recuerda eliminar la cuenta Auth de ${linkedAuthEmail} manualmente en Firebase Console → Authentication.`
    : 'Usuario borrado de Firestore.';
  toast(note, 'success');
  render();
}

function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }
function randBetween(min, max){ return Math.round((Math.random() * (max - min) + min) * 10) / 10; }

function generateUserLogs(user, routineDays){
  const today = new Date();
  const logs = {};

  // 8 weeks back, ~3-5 sessions per week per user (variable to look real)
  const WEEKS = 8;
  for (let w = WEEKS - 1; w >= 0; w--){
    // Each user has different attendance pattern
    const sessionsThisWeek = Math.floor(Math.random() * 3) + 3; // 3-5 days
    const daysOrder = [...Object.keys(routineDays)].sort(() => Math.random() - 0.5).slice(0, sessionsThisWeek);

    for (const dayKey of daysOrder){
      // Date: some day in this week (Mon-Sat)
      const sessionDate = new Date(today);
      sessionDate.setDate(today.getDate() - (w * 7) - Math.floor(Math.random() * 6));
      const dateStr = sessionDate.toISOString().slice(0, 10);

      const exercises = (routineDays[dayKey]?.exercises) || [];
      // Pick 4-7 of the exercises (not always all)
      const exCount = Math.min(exercises.length, Math.floor(Math.random() * 3) + 4);
      const exIndices = [...Array(exercises.length).keys()].sort(() => Math.random() - 0.5).slice(0, exCount).sort((a,b)=>a-b);

      for (const idx of exIndices){
        const ek = `${dayKey}:${idx}`;
        const baseWeight = (user.weights[dayKey] && user.weights[dayKey][idx]) || 50;
        // Progressive overload: gain ~2-4% per week of base
        const weekProgress = (WEEKS - 1 - w);
        const weight = Math.round(baseWeight * (1 + (weekProgress * 0.025) + (Math.random() - 0.5) * 0.04));

        // 3-4 sets
        const setCount = Math.random() > 0.3 ? 4 : 3;
        const sets = [];
        for (let s = 0; s < setCount; s++){
          // First sets do more reps; last set sometimes fewer
          let reps;
          if (s === setCount - 1) reps = Math.floor(Math.random() * 4) + 6; // 6-9
          else reps = Math.floor(Math.random() * 4) + 8; // 8-11
          const setObj = {
            reps,
            weight: s === 0 ? weight - 5 : weight, // first set lighter for warmup
          };
          if (Math.random() < 0.15){
            const note = pick(DEMO_NOTES_POOL);
            if (note) setObj.note = note;
          }
          sets.push(setObj);
        }

        const entry = { date: dateStr, sets };
        if (Math.random() < 0.2){
          const note = pick(DEMO_SESSION_NOTES);
          if (note) entry.note = note;
        }

        if (!logs[ek]) logs[ek] = [];
        logs[ek].push(entry);
      }
    }
  }

  // Sort entries per exercise by date
  for (const k in logs){
    logs[k].sort((a, b) => a.date.localeCompare(b.date));
  }

  return logs;
}

function generateWeightLogs(user){
  // 8 weeks of bi-weekly weight logs trending toward goal
  const today = new Date();
  const logs = [];
  const totalChange = user.profile.goalWeight - user.startWeight;
  const SAMPLES = 8;
  for (let i = 0; i < SAMPLES; i++){
    const date = new Date(today);
    date.setDate(today.getDate() - ((SAMPLES - 1 - i) * 7));
    const progress = i / (SAMPLES - 1); // 0 → 1
    // Trend toward goal but not exactly: add some noise
    const trend = user.startWeight + (totalChange * progress * 0.7); // never reach goal exactly
    const noisy = Math.round((trend + (Math.random() - 0.5) * 1.5) * 10) / 10;
    logs.push({
      date: date.toISOString().slice(0, 10),
      weight: noisy,
      note: i === 0 ? 'Peso inicial' : (Math.random() < 0.2 ? pick(['Después de comer', 'Mañana en ayunas', 'Después del gym', '']) : ''),
      createdAt: Date.now() - ((SAMPLES - 1 - i) * 7 * 24 * 60 * 60 * 1000)
    });
  }
  return logs;
}

// Stored in: imageOverrides/{exerciseId} = { preview_url, start_url, finish_url, image_url, free_db_match_id, updatedAt, updatedBy }
async function loadImageOverrides(){
  if (state.imageOverridesLoaded) return state.imageOverrides;
  try {
    const snap = await getDocs(collection(db, 'imageOverrides'));
    const obj = {};
    snap.forEach(d => obj[d.id] = d.data());
    state.imageOverrides = obj;
    state.imageOverridesLoaded = true;
    return obj;
  } catch(e){
    console.error('Failed loading overrides:', e);
    state.imageOverrides = {};
    state.imageOverridesLoaded = true;
    return {};
  }
}
async function saveImageOverride(exerciseId, data){
  const preview = data.preview_url || data.image_url || data.start_url || data.finish_url || null;
  const start = data.start_url || data.image_url || data.preview_url || data.finish_url || null;
  const payload = {
    image_url: data.image_url || preview,
    preview_url: preview,
    start_url: start,
    finish_url: data.finish_url || null,
    free_db_match_id: data.free_db_match_id || null,
    updatedAt: Date.now(),
    updatedBy: state.authUser?.email || 'unknown'
  };
  await setDoc(doc(db, 'imageOverrides', exerciseId), payload);
  state.imageOverrides[exerciseId] = payload;
}

async function forgotPassword(){
  const emailEl = document.getElementById('emInput');
  const errEl = document.getElementById('loginErr');
  const btn = document.getElementById('forgotBtn');
  const email = (emailEl?.value || '').trim();
  if (!email){
    if (errEl) errEl.textContent = 'Ingresa tu email arriba para enviarte el correo de recuperación.';
    emailEl?.focus();
    return;
  }
  try {
    if (btn){ btn.disabled = true; btn.textContent = 'Enviando...'; }
    await sendPasswordResetEmail(auth, email);
    if (errEl){
      errEl.style.color = 'var(--success)';
      errEl.textContent = `📧 Te enviamos un correo a ${email} con instrucciones.`;
      setTimeout(() => { if (errEl){ errEl.textContent = ''; errEl.style.color = 'var(--danger)'; } }, 8000);
    }
    toast('Correo de recuperación enviado', 'success');
  } catch(err){
    console.error(err);
    const code = err.code || '';
    const msg = code.includes('user-not-found') ? 'No encontré una cuenta con ese email.' :
      code.includes('invalid-email') ? 'Email no válido.' :
      code.includes('too-many-requests') ? 'Demasiados intentos. Espera unos minutos.' :
      `No pude enviar el correo (${code || 'error'})`;
    if (errEl) errEl.textContent = msg;
  } finally {
    if (btn){ btn.disabled = false; btn.textContent = '¿Olvidaste tu contraseña?'; }
  }
}

      </button>
      <button class="${state.tab==='trashed'?'active':''}" data-tab="trashed">
        <i class="ti ti-trash" style="font-size:13px;vertical-align:-1px;"></i> Papelera (${trashed.length})
      </button>
      <button class="${state.tab==='images'?'active':''}" data-tab="images">
        <i class="ti ti-photo" style="font-size:13px;vertical-align:-1px;"></i> Imágenes
      </button>
    </div>

    ${state.tab === 'images' ? renderImageAudit() : `<div class="two-col">
      <div>
        ${renderGroupList(tabGroups)}
        ${state.tab === 'active' ? renderLoadByCode() : ''}
      </div>
      <div>
        ${state.selectedGroup && state.groups[state.selectedGroup] ? renderGroupDetail(state.groups[state.selectedGroup]) : renderEmptyDetail()}
      </div>
    </div>`}`;
  attachDashboardHandlers();
}

  return `<div class="section-label" style="margin-top:4px;">${state.tab==='active'?'Grupos':state.tab==='archived'?'Archivados':'Papelera'}</div>

function renderImageAudit(){
  if (!_freeExIndex){
    loadFreeExerciseDb().then(() => render());
    return `<div class="card" style="padding:60px 20px;text-align:center;color:var(--text-muted);">
      <i class="ti ti-loader" style="font-size:36px;display:block;margin-bottom:10px;"></i>
      Cargando base de imágenes (Free Exercise DB)...
    </div>`;
  }
  if (!state.imageOverridesLoaded){
    loadImageOverrides().then(() => render());
    return `<div class="card" style="padding:60px 20px;text-align:center;color:var(--text-muted);">
      <i class="ti ti-loader" style="font-size:36px;display:block;margin-bottom:10px;"></i>
      Cargando overrides desde Firestore...
    </div>`;
  }

  const items = EXERCISE_DB.map(ex => {
    const r = resolveExerciseImage(ex);
    return { ex, ...r };
  });

  const total = items.length;
  const withImage = items.filter(i => i.url).length;
  const overridden = items.filter(i => i.source === 'override').length;
  const auto = items.filter(i => i.source === 'auto').length;
  const none = items.filter(i => i.source === 'none').length;
  const pct = Math.round((withImage / total) * 100);

  const q = state.imageSearchQuery || '';
  const qNorm = normalizeExerciseName(q);
  const filterMode = state.imageFilter || 'all';
  const filtered = items.filter(i => {
    if (filterMode === 'none' && i.source !== 'none') return false;
    if (filterMode === 'auto' && i.source !== 'auto') return false;
    if (filterMode === 'override' && i.source !== 'override') return false;
    if (!qNorm) return true;
    return normalizeExerciseName(i.ex.n).includes(qNorm)
        || normalizeExerciseName(i.ex.en || '').includes(qNorm)
        || normalizeExerciseName(i.ex.g || '').includes(qNorm);
  });

  const rows = filtered.slice(0, 100).map(item => {
    const { ex, source, url } = item;
    const srcLabel = source === 'override' ? `<span class="pill" style="background:rgba(34,211,163,0.18);color:#22d3a3;font-size:9px;">OVERRIDE</span>`
                  : source === 'auto' ? `<span class="pill" style="background:rgba(59,158,255,0.18);color:#3b9eff;font-size:9px;">AUTO</span>`
                  : `<span class="pill" style="background:rgba(248,113,113,0.18);color:#f87171;font-size:9px;">SIN IMAGEN</span>`;
    const thumb = url ? `<img src="${esc(url)}" loading="lazy" style="width:44px;height:44px;object-fit:cover;border-radius:6px;background:var(--bg-elev-2);" onerror="this.style.opacity=0.2" />`
                      : `<div style="width:44px;height:44px;border-radius:6px;background:var(--bg-elev-2);display:flex;align-items:center;justify-content:center;color:var(--text-dim);"><i class="ti ti-photo-off" style="font-size:18px;"></i></div>`;
    return `<div style="display:grid;grid-template-columns:54px 1fr auto;gap:10px;padding:10px;border-bottom:1px solid var(--border);align-items:center;">
      ${thumb}
      <div style="min-width:0;">
        <div style="font-weight:500;font-size:13px;">${esc(ex.n)} ${srcLabel}</div>
        <div class="muted" style="font-size:11px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">
          ${esc(ex.en || '')} · ${esc(ex.g || '')} · tier ${ex.t}
        </div>
      </div>
      <button data-edit-img="${esc(ex.id)}" style="font-size:11px;padding:6px 12px;">
        <i class="ti ti-edit" style="font-size:12px;vertical-align:-1px;"></i> Editar
      </button>
    </div>`;
  }).join('');

  return `<div class="card" style="padding:14px;margin-bottom:14px;">
    <div class="row" style="margin-bottom:10px;">
      <i class="ti ti-photo" style="font-size:18px;color:var(--accent);"></i>
      <div style="flex:1;">
        <div style="font-weight:600;">Auditoría de imágenes</div>
        <div class="muted" style="font-size:12px;margin-top:2px;">
          ${withImage} de ${total} ejercicios con imagen (${pct}%) · ${overridden} override · ${auto} auto · ${none} sin imagen
        </div>
      </div>
      <button id="refreshFreeDbBtn" style="font-size:11px;padding:6px 12px;">
        <i class="ti ti-refresh" style="font-size:12px;vertical-align:-1px;"></i> Refrescar BD
      </button>
    </div>
    <div style="height:5px;background:var(--bg-elev-2);border-radius:3px;overflow:hidden;margin-bottom:10px;">
      <div style="width:${pct}%;height:100%;background:${pct>=70?'#22d3a3':pct>=50?'#fbbf24':'#fb923c'};"></div>
    </div>
  </div>

  <div class="card" style="padding:12px;margin-bottom:14px;">
    <input id="imgSearchInput" type="text" placeholder="Buscar por nombre, grupo, EN..." value="${esc(q)}" style="width:100%;padding:10px;margin-bottom:8px;background:var(--bg-elev);border:1px solid var(--border);color:var(--text);" />
    <div class="row" style="gap:6px;flex-wrap:wrap;">
      ${[['all','Todos'],['none','Sin imagen'],['auto','Auto-match'],['override','Override']].map(([v,l]) =>
        `<button data-filter-img="${v}" style="font-size:11px;padding:5px 11px;${filterMode===v?'background:var(--accent);color:white;border-color:var(--accent);':''}">${l}</button>`
      ).join('')}
    </div>
  </div>

  <div class="card" style="padding:0;overflow:hidden;">
    ${rows || `<div style="padding:40px;text-align:center;color:var(--text-muted);">Sin resultados.</div>`}
    ${filtered.length > 100 ? `<div style="padding:12px;text-align:center;color:var(--text-muted);font-size:12px;">Mostrando 100 de ${filtered.length}. Refiná tu búsqueda.</div>` : ''}
  </div>`;
}

function openImageEditor(exerciseId){
  const ex = EXERCISE_DB.find(e => e.id === exerciseId);
  if (!ex) return;
  const r = resolveExerciseImage(ex);
  let mode = 'search';
  let pickedFreeId = r.freeDbId;
  const existingOverride = state.imageOverrides[exerciseId] || {};
  let customPreviewUrl = existingOverride.preview_url || existingOverride.image_url || '';
  let customStartUrl = existingOverride.start_url || existingOverride.image_url || '';
  let customFinishUrl = existingOverride.finish_url || '';
  let searchQuery = ex.en || ex.n;

  function build(){
    const matches = mode === 'search' ? searchFreeExDb(searchQuery, 8) : [];
    const matchCards = matches.map(m => {
      const imgUrl = freeExImageUrl(m.images[0]);
      const finishUrl = m.images.length > 1 ? freeExImageUrl(m.images[1]) : null;
      const isPicked = pickedFreeId === m.id;
      return `<div data-pick-free="${esc(m.id)}" style="display:grid;grid-template-columns:88px 1fr;gap:10px;padding:8px;border-radius:8px;cursor:pointer;background:${isPicked?'rgba(59,158,255,0.18)':'var(--bg-elev-2)'};border:1px solid ${isPicked?'var(--accent)':'transparent'};margin-bottom:6px;">
        <div style="display:grid;grid-template-columns:${finishUrl?'1fr 1fr':'1fr'};gap:4px;">
          <img src="${esc(imgUrl)}" loading="lazy" style="width:100%;height:54px;object-fit:cover;border-radius:6px;background:var(--bg-elev);" onerror="this.style.opacity=0.2" />
          ${finishUrl ? `<img src="${esc(finishUrl)}" loading="lazy" style="width:100%;height:54px;object-fit:cover;border-radius:6px;background:var(--bg-elev);" onerror="this.style.opacity=0.2" />` : ''}
        </div>
        <div style="min-width:0;">
          <div style="font-weight:500;font-size:12px;">${esc(m.name)}</div>
          <div class="muted" style="font-size:10px;margin-top:2px;">
            ${esc((m.primaryMuscles||[]).join(', '))} ${m.equipment ? '� '+esc(m.equipment) : ''}
          </div>
        </div>
      </div>`;
    }).join('');

    openModal(`
      <h2 style="margin-bottom:8px;">Editar imagen</h2>
      <div class="muted" style="font-size:12px;margin-bottom:14px;"><strong>${esc(ex.n)}</strong> � ${esc(ex.g||'')}</div>

      <div class="tab-bar" style="margin-bottom:14px;">
        <button data-mode-tab="search" style="${mode==='search'?'background:var(--accent);color:white;':''}">Buscar en Free DB</button>
        <button data-mode-tab="url" style="${mode==='url'?'background:var(--accent);color:white;':''}">URL custom</button>
      </div>

      ${mode === 'search' ? `
        <input id="modalSearchInput" type="text" placeholder="Buscar..." value="${esc(searchQuery)}" style="width:100%;padding:10px;margin-bottom:10px;background:var(--bg-elev);border:1px solid var(--border);color:var(--text);" />
        <div class="muted" style="font-size:11px;margin-bottom:8px;">Al guardar: imagen 1 = preview/inicio, imagen 2 = final si existe.</div>
        <div style="max-height:340px;overflow-y:auto;">
          ${matchCards || `<div class="muted" style="text-align:center;padding:20px;font-size:13px;">Sin matches. Proba con otro termino.</div>`}
        </div>
      ` : `
        <label class="muted" style="font-size:11px;display:block;margin-bottom:4px;">Preview / thumbnail URL</label>
        <input id="modalPreviewUrlInput" type="text" placeholder="https://..." value="${esc(customPreviewUrl)}" style="width:100%;padding:10px;margin-bottom:8px;background:var(--bg-elev);border:1px solid var(--border);color:var(--text);" />
        <label class="muted" style="font-size:11px;display:block;margin-bottom:4px;">Inicio URL</label>
        <input id="modalStartUrlInput" type="text" placeholder="https://..." value="${esc(customStartUrl)}" style="width:100%;padding:10px;margin-bottom:8px;background:var(--bg-elev);border:1px solid var(--border);color:var(--text);" />
        <label class="muted" style="font-size:11px;display:block;margin-bottom:4px;">Final URL (opcional)</label>
        <input id="modalFinishUrlInput" type="text" placeholder="https://..." value="${esc(customFinishUrl)}" style="width:100%;padding:10px;margin-bottom:10px;background:var(--bg-elev);border:1px solid var(--border);color:var(--text);" />
        <div style="display:grid;grid-template-columns:${customFinishUrl?'1fr 1fr':'1fr'};gap:8px;margin-bottom:10px;">
          ${customStartUrl || customPreviewUrl ? `<img src="${esc(customStartUrl || customPreviewUrl)}" style="width:100%;max-height:170px;object-fit:contain;border-radius:8px;background:var(--bg-elev-2);" onerror="this.style.display='none'" />` : ''}
          ${customFinishUrl ? `<img src="${esc(customFinishUrl)}" style="width:100%;max-height:170px;object-fit:contain;border-radius:8px;background:var(--bg-elev-2);" onerror="this.style.display='none'" />` : ''}
        </div>
      `}

      <div class="row" style="margin-top:14px;gap:8px;">
        ${state.imageOverrides[exerciseId] ? `<button id="modalRemove" style="background:rgba(248,113,113,0.18);color:#f87171;border-color:rgba(248,113,113,0.35);">
          <i class="ti ti-trash" style="font-size:12px;vertical-align:-1px;"></i> Quitar override
        </button>` : ''}
        <div class="spacer"></div>
        <button id="modalCancel">Cancelar</button>
        <button id="modalSave" style="background:var(--accent);color:white;border-color:var(--accent);">Guardar</button>
      </div>
    `, () => {
      document.querySelectorAll('[data-mode-tab]').forEach(b => b.addEventListener('click', () => { mode = b.dataset.modeTab; build(); }));

      const si = document.getElementById('modalSearchInput');
      if (si){
        si.focus();
        si.setSelectionRange(si.value.length, si.value.length);
        let t;
        si.addEventListener('input', e => { searchQuery = e.target.value; clearTimeout(t); t = setTimeout(build, 200); });
      }
      const pui = document.getElementById('modalPreviewUrlInput');
      if (pui) pui.addEventListener('input', e => { customPreviewUrl = e.target.value.trim(); });
      const sui = document.getElementById('modalStartUrlInput');
      if (sui) sui.addEventListener('input', e => { customStartUrl = e.target.value.trim(); });
      const fui = document.getElementById('modalFinishUrlInput');
      if (fui) fui.addEventListener('input', e => { customFinishUrl = e.target.value.trim(); });

      document.querySelectorAll('[data-pick-free]').forEach(b => b.addEventListener('click', () => { pickedFreeId = b.dataset.pickFree; build(); }));

      document.getElementById('modalCancel').addEventListener('click', closeModal);
      const rm = document.getElementById('modalRemove');
      if (rm) rm.addEventListener('click', async () => {
        if (!confirm('Quitar el override de este ejercicio?')) return;
        try {
          await deleteImageOverride(exerciseId);
          toast('Override eliminado', 'success');
          closeModal(); render();
        } catch(e){ toast('Error: ' + e.message, 'error'); }
      });
      document.getElementById('modalSave').addEventListener('click', async () => {
        let payload;
        if (mode === 'search'){
          if (!pickedFreeId){ toast('Selecciona un ejercicio del Free DB', 'error'); return; }
          const m = _freeExById.get(pickedFreeId);
          if (!m){ toast('Match no encontrado', 'error'); return; }
          const start = freeExImageUrl(m.images[0]);
          const finish = m.images.length > 1 ? freeExImageUrl(m.images[1]) : null;
          payload = { image_url: start, preview_url: start, start_url: start, finish_url: finish, free_db_match_id: pickedFreeId };
        } else {
          const firstUrl = customPreviewUrl || customStartUrl || customFinishUrl;
          if (!firstUrl){ toast('Ingresa al menos una URL', 'error'); return; }
          payload = {
            image_url: firstUrl,
            preview_url: customPreviewUrl || firstUrl,
            start_url: customStartUrl || firstUrl,
            finish_url: customFinishUrl || null,
            free_db_match_id: null
          };
        }
        try {
          await saveImageOverride(exerciseId, payload);
          toast('Guardado', 'success');
          closeModal(); render();
        } catch(e){ toast('Error: ' + e.message, 'error'); }
      });
    });
  }
  build();
}

function renderGroupDetail(g){
  const st = groupStatus(g);
  const stPill = st === 'archived' ? '<span class="pill warning-pill">ARCHIVADO</span>'
    : st === 'trashed' ? `<span class="pill danger-pill">PAPELERA · expira en ${TRASH_RETENTION_DAYS - (daysAgo(g.config.trashedAt) || 0)}d</span>`
    : '<span class="pill success-pill">ACTIVO</span>';

  // Actions for this group based on status
  let actions = '';
  if (st === 'active'){
    actions = `
      <button class="warning small action-btn" data-act="archive" data-g="${esc(g.id)}"><i class="ti ti-archive"></i> Archivar</button>
      <button class="danger small action-btn" data-act="trash" data-g="${esc(g.id)}"><i class="ti ti-trash"></i> Mover a papelera</button>`;
  } else if (st === 'archived'){
    actions = `
      <button class="small action-btn" data-act="unarchive" data-g="${esc(g.id)}"><i class="ti ti-folder-open"></i> Desarchivar</button>
      <button class="danger small action-btn" data-act="trash" data-g="${esc(g.id)}"><i class="ti ti-trash"></i> Mover a papelera</button>`;
  } else if (st === 'trashed'){
    actions = `
      <button class="small action-btn" data-act="restore" data-g="${esc(g.id)}"><i class="ti ti-arrow-back-up"></i> Restaurar</button>
      <button class="danger small action-btn" data-act="hardDelete" data-g="${esc(g.id)}"><i class="ti ti-flame"></i> Borrar para siempre</button>`;
  }

  const cfg = g.config || {};
  const meta = [
    cfg.createdAt ? `Creado: ${formatDate(cfg.createdAt)}` : null,
    cfg.archivedAt ? `Archivado: ${formatDate(cfg.archivedAt)}` : null,
    cfg.trashedAt ? `Papelera: ${formatDate(cfg.trashedAt)} (expira en ${TRASH_RETENTION_DAYS - (daysAgo(cfg.trashedAt) || 0)}d)` : null,
    cfg.invitationPassword ? `Invitación: ${esc(cfg.invitationPassword)}` : null,
  ].filter(Boolean);

  return `<div class="card" style="margin-bottom:14px;">
    <div class="row" style="margin-bottom:8px;flex-wrap:wrap;gap:8px;">
      <h2>${esc(groupName(g))}</h2>
      ${stPill}
      <div class="spacer"></div>
    </div>
    <div class="mono dim" style="font-size:11px;margin-bottom:6px;">${esc(g.id)}</div>
    ${meta.length ? `<div class="muted" style="font-size:12px;line-height:1.7;">${meta.map(m=>esc(m)).join('<br>')}</div>` : ''}
    ${g.error ? `<div class="banner danger" style="margin-top:10px;"><i class="ti ti-alert-triangle"></i><div>Error: ${esc(g.error)}</div></div>` : ''}
    <div class="action-row">${actions}</div>
  </div>

  <div class="card" style="margin-bottom:14px;">
    <div class="row" style="margin-bottom:12px;">
      <h3>Usuarios (${(g.users||[]).length})</h3>
    </div>
    ${(g.users||[]).length ? `<table class="table">
      <thead><tr><th>Nombre</th><th>Email auth</th><th>Sesiones</th><th></th></tr></thead>
      <tbody>
        ${g.users.map(u => {
          const userSessions = ((g.logs || {})[u.id] && Object.values((g.logs || {})[u.id]).flat().length) || 0;
          return `<tr>
            <td><div style="font-weight:500;">${esc(u.name || '?')}</div><div class="mono dim" style="font-size:10px;">${esc(u.id)}</div></td>
            <td class="mono" style="font-size:12px;color:var(--text-muted);">${esc(u.authOwnerEmail || '—')}</td>
            <td class="mono">${userSessions}</td>
            <td style="text-align:right;">
              <button class="warning small" data-act="removeUser" data-g="${esc(g.id)}" data-u="${esc(u.id)}" title="Quitar de este grupo"><i class="ti ti-user-minus"></i></button>
              <button class="danger small" data-act="hardDeleteUser" data-u="${esc(u.id)}" title="Borrar para siempre (de todos los grupos)"><i class="ti ti-user-x"></i></button>
            </td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>` : '<div class="empty"><i class="ti ti-users-off"></i><div>Sin usuarios.</div></div>'}
  </div>

  <div class="card">
    <h3 style="margin-bottom:8px;">Stats rápidas</h3>
    <div class="grid">
      <div><div class="stat-label section-label">Sesiones</div><div class="mono" style="font-size:20px;font-weight:600;">${g.stats?.sessions||0}</div></div>
      <div><div class="stat-label section-label">Sets</div><div class="mono" style="font-size:20px;font-weight:600;">${g.stats?.sets||0}</div></div>
      <div><div class="stat-label section-label">Volumen total</div><div class="mono" style="font-size:20px;font-weight:600;">${Math.round(g.stats?.totalVol||0)}</div></div>
      <div><div class="stat-label section-label">Peso máx</div><div class="mono" style="font-size:20px;font-weight:600;">${g.stats?.maxW||0}</div></div>
    </div>
  </div>`;
}

function attachDashboardHandlers(){
  document.getElementById('refreshBtn')?.addEventListener('click', loadDashboard);
  document.getElementById('outBtn')?.addEventListener('click', doLogout);

  document.querySelectorAll('.tab-bar button[data-tab]').forEach(b => {
    b.addEventListener('click', () => { state.tab = b.dataset.tab; state.selectedGroup = null; render(); });
  });
  document.querySelectorAll('[data-group]').forEach(b => {
    b.addEventListener('click', () => { state.selectedGroup = b.dataset.group; render(); });
  });
  document.getElementById('loadCodeBtn')?.addEventListener('click', () => {
    const v = document.getElementById('codeInput').value.trim();
    if (v) loadGroupById(v);
  });
  document.getElementById('codeInput')?.addEventListener('input', e => { state.loadCode = e.target.value; });
  document.getElementById('seedDemoBtn')?.addEventListener('click', seedDemoGroup);

  document.querySelectorAll('[data-act]').forEach(b => {
    b.addEventListener('click', () => handleAction(b.dataset.act, b.dataset));
  });

  // Image audit handlers
  document.getElementById('refreshFreeDbBtn')?.addEventListener('click', async () => {
    try { localStorage.removeItem(FREE_EX_CACHE_KEY); } catch(e){}
    _freeExIndex = null; _freeExById = null; _freeExLoading = null;
    toast('Re-descargando Free Exercise DB...', 'success');
    await loadFreeExerciseDb();
    toast('Base de imágenes actualizada', 'success');
    render();
  });
  const imgInp = document.getElementById('imgSearchInput');
  if (imgInp){
    let t;
    imgInp.addEventListener('input', e => {
      state.imageSearchQuery = e.target.value;
      clearTimeout(t);
      t = setTimeout(() => {
        // Update only the list, not the whole render — keep focus
        const listCard = document.querySelectorAll('.card')[document.querySelectorAll('.card').length - 1];
        // Actually for simplicity just re-render whole audit
        render();
        // Restore focus
        const newInp = document.getElementById('imgSearchInput');
        if (newInp){ newInp.focus(); newInp.setSelectionRange(newInp.value.length, newInp.value.length); }
      }, 200);
    });
  }
  document.querySelectorAll('[data-filter-img]').forEach(b => {
    b.addEventListener('click', () => { state.imageFilter = b.dataset.filterImg; render(); });
  });
  document.querySelectorAll('[data-edit-img]').forEach(b => {
    b.addEventListener('click', () => openImageEditor(b.dataset.editImg));
  });
}

function handleAction(act, data){
  const gid = data.g;
  const uid = data.u;
  const g = gid ? state.groups[gid] : null;

  if (act === 'archive'){
    openModal(`<h2 style="margin-bottom:10px;">📂 Archivar grupo</h2>
      <p style="font-size:14px;margin:0 0 12px;">El grupo <strong>${esc(groupName(g))}</strong> no aparecerá en las listas de usuarios, pero los datos siguen intactos. Puedes desarchivarlo en cualquier momento.</p>
      <div class="row" style="justify-content:flex-end;gap:8px;margin-top:14px;">
        <button id="cancel">Cancelar</button>
        <button class="warning" id="confirm">Archivar</button>
      </div>`, () => {
      document.getElementById('cancel').onclick = closeModal;
      document.getElementById('confirm').onclick = async () => { closeModal(); await archiveGroup(gid); };
    });
    return;
  }
  if (act === 'unarchive'){
    archiveAction(gid, 'unarchive');
    return;
  }
  if (act === 'trash'){
    openModal(`<h2 style="margin-bottom:10px;color:var(--danger);">🗑️ Mover a papelera</h2>
      <p style="font-size:14px;margin:0 0 12px;">El grupo <strong>${esc(groupName(g))}</strong> se va a papelera.</p>
      <div class="banner" style="margin-bottom:12px;"><i class="ti ti-clock"></i><div>Se borrará automáticamente en <strong>${TRASH_RETENTION_DAYS} días</strong>. Mientras tanto, puedes restaurarlo desde la pestaña Papelera.</div></div>
      <div class="row" style="justify-content:flex-end;gap:8px;">
        <button id="cancel">Cancelar</button>
        <button class="danger" id="confirm">Mover a papelera</button>
      </div>`, () => {
      document.getElementById('cancel').onclick = closeModal;
      document.getElementById('confirm').onclick = async () => { closeModal(); await trashGroup(gid); };
    });
    return;
  }
  if (act === 'restore'){
    archiveAction(gid, 'restore');
    return;
  }
  if (act === 'hardDelete'){
    openModal(`<h2 style="margin-bottom:10px;color:var(--danger);">💥 Borrar para SIEMPRE</h2>
      <div class="banner danger" style="margin-bottom:12px;"><i class="ti ti-alert-triangle"></i><div>Esta acción <strong>NO se puede deshacer</strong>. Borrarás permanentemente:
      <br>• Grupo <strong>${esc(groupName(g))}</strong>
      <br>• ${(g.users||[]).length} usuarios del grupo
      <br>• Todos los entrenos (${g.stats?.sessions||0} sesiones)
      <br>• Rutinas compartidas y personales</div></div>
      <p class="muted" style="font-size:13px;margin:0 0 10px;">Para confirmar, escribe el código del grupo:</p>
      <p class="mono" style="font-size:12px;margin-bottom:8px;color:var(--accent);">${esc(g.id)}</p>
      <input id="confirmInput" placeholder="Pega aquí el código exacto" style="margin-bottom:14px;" />
      <div class="row" style="justify-content:flex-end;gap:8px;">
        <button id="cancel">Cancelar</button>
        <button class="danger" id="confirm" disabled>Borrar para siempre</button>
      </div>`, () => {
      const confirmBtn = document.getElementById('confirm');
      const input = document.getElementById('confirmInput');
      input.addEventListener('input', () => { confirmBtn.disabled = input.value.trim() !== g.id; });
      document.getElementById('cancel').onclick = closeModal;
      confirmBtn.onclick = async () => { closeModal(); await hardDeleteGroup(gid); };
    });
    return;
  }
  if (act === 'removeUser'){
    const u = (g.users || []).find(x => x.id === uid);
    const userSessions = ((g.logs || {})[uid] && Object.values((g.logs || {})[uid]).flat().length) || 0;
    openModal(`<h2 style="margin-bottom:10px;color:var(--warning);">🚪 Quitar del grupo</h2>
      <p style="font-size:14px;margin:0 0 12px;">Quitar a <strong>${esc(u?.name||'?')}</strong> del grupo <strong>${esc(groupName(g))}</strong>.</p>
      ${userSessions > 0 ? `<p class="muted" style="font-size:13px;margin:0 0 10px;">Tiene <strong>${userSessions}</strong> entrenos. Elige qué hacer:</p>
      <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:14px;">
        <label style="display:flex;align-items:flex-start;gap:8px;padding:10px;background:var(--bg-elev-2);border-radius:8px;cursor:pointer;">
          <input type="radio" name="purgeMode" value="keep" checked style="margin-top:3px;" />
          <div><div style="font-weight:500;">Mantener entrenos</div><div class="muted" style="font-size:12px;">Los datos siguen ahí (queda como "histórico").</div></div>
        </label>
        <label style="display:flex;align-items:flex-start;gap:8px;padding:10px;background:var(--bg-elev-2);border-radius:8px;cursor:pointer;">
          <input type="radio" name="purgeMode" value="purge" style="margin-top:3px;" />
          <div><div style="font-weight:500;color:var(--danger);">Borrar también los entrenos</div><div class="muted" style="font-size:12px;">Irreversible para este grupo.</div></div>
        </label>
      </div>` : '<p class="muted" style="font-size:13px;margin:0 0 14px;">Sin entrenos registrados.</p>'}
      <div class="row" style="justify-content:flex-end;gap:8px;">
        <button id="cancel">Cancelar</button>
        <button class="warning" id="confirm">Quitar</button>
      </div>`, () => {
      document.getElementById('cancel').onclick = closeModal;
      document.getElementById('confirm').onclick = async () => {
        const purge = (document.querySelector('input[name="purgeMode"]:checked') || {}).value === 'purge';
        closeModal();
        await removeUserFromGroup(gid, uid, { purgeLogs: purge });
      };
    });
    return;
  }
  if (act === 'hardDeleteUser'){
    // Find user in any group
    let user = null;
    for (const g of Object.values(state.groups)){
      user = (g.users || []).find(u => u.id === uid);
      if (user) break;
    }
    const groupsAffected = Object.values(state.groups).filter(gg => (gg.users || []).some(u => u.id === uid)).length;
    openModal(`<h2 style="margin-bottom:10px;color:var(--danger);">💥 Borrar usuario PARA SIEMPRE</h2>
      <div class="banner danger" style="margin-bottom:12px;"><i class="ti ti-alert-triangle"></i><div>Borrarás permanentemente a <strong>${esc(user?.name || uid)}</strong> de <strong>${groupsAffected}</strong> grupo(s), incluyendo todos sus entrenos.</div></div>
      ${user?.authOwnerEmail ? `<div class="banner" style="margin-bottom:12px;"><i class="ti ti-info-circle"></i><div>Email auth asociado: <strong>${esc(user.authOwnerEmail)}</strong>. Después de esta acción, recuerda borrar la cuenta de Firebase Authentication manualmente.</div></div>` : ''}
      <p class="muted" style="font-size:13px;margin:0 0 10px;">Para confirmar, escribe el nombre del usuario:</p>
      <p class="mono" style="font-size:12px;margin-bottom:8px;color:var(--accent);">${esc(user?.name || uid)}</p>
      <input id="confirmInput" placeholder="Escribe aquí" style="margin-bottom:14px;" />
      <div class="row" style="justify-content:flex-end;gap:8px;">
        <button id="cancel">Cancelar</button>
        <button class="danger" id="confirm" disabled>Borrar para siempre</button>
      </div>`, () => {
      const confirmBtn = document.getElementById('confirm');
      const input = document.getElementById('confirmInput');
      input.addEventListener('input', () => { confirmBtn.disabled = input.value.trim() !== (user?.name || uid); });
      document.getElementById('cancel').onclick = closeModal;
      confirmBtn.onclick = async () => { closeModal(); await hardDeleteUser(uid); };
    });
    return;
  }
}

async function archiveAction(gid, kind){
  if (kind === 'unarchive') await unarchiveGroup(gid);
  if (kind === 'restore') await restoreGroup(gid);
}

// Delegated handler for password visibility toggle
document.body.addEventListener('click', (e) => {
  const btn = e.target.closest('.pw-toggle');
  if (!btn) return;
  const targetId = btn.dataset.pwTarget;
  const input = targetId ? document.getElementById(targetId) : btn.previousElementSibling;
  if (!input) return;
  const showing = input.type === 'text';
  input.type = showing ? 'password' : 'text';
  const icon = btn.querySelector('i');
  if (icon) icon.className = `ti ${showing ? 'ti-eye' : 'ti-eye-off'}`;
  btn.setAttribute('aria-label', showing ? 'Mostrar contraseña' : 'Ocultar contraseña');
});

onAuthStateChanged(auth, (user) => {
  state.authUser = user;
  if (user && isAdminUser(user)){
    loadDashboard();
  } else {
    state.loading = false;
    render();
  }
});
</script>
