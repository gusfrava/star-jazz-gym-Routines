}

// ====== EVENTS ======
function attach(){
  root.querySelectorAll('[data-action]').forEach(el => el.addEventListener('click', handle));
}
function attachSetHandlers(){
  document.querySelectorAll('.del-set').forEach(b => b.addEventListener('click', e => e.target.closest('.set-row').remove()));
  document.querySelectorAll('.set-unilateral').forEach(b => b.addEventListener('change', e => setRowUnilateral(e.target.closest('.set-row'), e.target.checked)));
}
function setRowUnilateral(row, on){
  if (!row) return;
  const normal = row.querySelector('.normal-fields');
  const uni = row.querySelector('.unilateral-fields');
  if (normal) normal.style.display = on ? 'none' : 'grid';
  if (uni) uni.style.display = on ? 'grid' : 'none';
  const cb = row.querySelector('.set-unilateral');
  if (cb) cb.checked = !!on;
  if (on){
    const reps = row.querySelector('.reps-in')?.value || '';
    const weight = row.querySelector('.weight-in')?.value || '';
    ['left','right'].forEach(side => {
      const repsIn = row.querySelector(`.${side}-reps-in`);
      const weightIn = row.querySelector(`.${side}-weight-in`);
      if (repsIn && !repsIn.value) repsIn.value = reps;
      if (weightIn && !weightIn.value) weightIn.value = weight;
    });
  } else {
    const reps = row.querySelector('.left-reps-in')?.value || row.querySelector('.right-reps-in')?.value || '';
    const weight = row.querySelector('.left-weight-in')?.value || row.querySelector('.right-weight-in')?.value || '';
    const repsIn = row.querySelector('.reps-in');
    const weightIn = row.querySelector('.weight-in');
    if (repsIn && !repsIn.value) repsIn.value = reps;
    if (weightIn && !weightIn.value) weightIn.value = weight;
  }
}

async function handle(e){
  const btn = e.currentTarget; const a = btn.dataset.action;

  // ====== Firebase Auth ======
  if (a === 'authEmailLogin' || a === 'authEmailSignup'){
    const email = (document.getElementById('authEmail')?.value || '').trim();
    const password = document.getElementById('authPassword')?.value || '';
    const errEl = document.getElementById('authError');
    if (!email){ errEl.textContent = 'Escribe tu email'; return; }
    if (password.length < 6){ errEl.textContent = 'La contraseña debe tener mínimo 6 caracteres'; return; }
    try {
      errEl.textContent = '';
      btn.disabled = true;
      btn.textContent = a === 'authEmailSignup' ? 'Creando...' : 'Entrando...';
      if (a === 'authEmailSignup'){
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        if (cred.user && !cred.user.displayName){
          await updateProfile(cred.user, { displayName: email.split('@')[0] });
        }
        await handleAuthState(cred.user);
        toast('Cuenta creada');
      } else {
        const cred = await signInWithEmailAndPassword(auth, email, password);
        await handleAuthState(cred.user);
        toast('Sesión iniciada');
      }
    } catch(err){
      console.error(err);
      const code = err.code || '';
      errEl.textContent = code.includes('email-already-in-use') ? 'Ese email ya tiene cuenta. Toca "Iniciar Sesión".' :
        code.includes('invalid-email') ? 'Escribe un email válido, no tu nombre del gym.' :
        code.includes('weak-password') ? 'La contraseña debe tener mínimo 6 caracteres.' :
        code.includes('invalid-credential') || code.includes('wrong-password') ? 'Email o contraseña incorrectos. Si es primera vez, toca "Crear Cuenta".' :
        code.includes('user-not-found') ? 'No encontré una cuenta con ese email. Toca "Crear Cuenta".' :
        code.includes('operation-not-allowed') ? 'Activa Email/Password en Firebase Auth.' :
        code.includes('configuration-not-found') ? 'Firebase Auth todavía no está activado en este proyecto.' :
        code.includes('unauthorized-domain') ? 'Agrega este dominio en Firebase Auth > Authorized domains.' :
        code.includes('network-request-failed') ? 'No hay conexión con Firebase. Revisa internet o bloqueadores.' :
        `No pude iniciar sesión (${code || 'error desconocido'}).`;
    } finally {
      btn.disabled = false;
      btn.textContent = a === 'authEmailSignup' ? 'Crear Cuenta' : 'Iniciar Sesión';
    }
    return;
  }
  if (a === 'authGoogle'){
    try {
      const provider = new GoogleAuthProvider();
      const cred = await signInWithPopup(auth, provider);
      await handleAuthState(cred.user);
      toast('Sesión iniciada');
    } catch(err){
      console.error(err);
      const code = err.code || '';
      toast(code.includes('operation-not-allowed') ? 'Activa Google en Firebase Auth' :
        code.includes('unauthorized-domain') ? 'Autoriza este dominio en Firebase' :
        code.includes('popup-blocked') ? 'El navegador bloqueó el popup de Google' :
        `No pude entrar con Google (${code || 'error'})`);
    }
    return;
  }

  // ====== Setup / Auth ======
  if (a === 'newUser'){ state.setupStep = 'newUser'; render(); return; }
  if (a === 'backToPick'){ state.setupStep = state.users.length ? 'pickUser' : 'newUser'; render(); return; }
  if (a === 'loginByName'){
    const name = (document.getElementById('loginNameInput').value || '').trim();
    const errEl = document.getElementById('loginNameError');
    if (!name){ errEl.textContent = 'Escribe tu nombre'; return; }
    const matches = state.users.filter(u => u.name.toLowerCase().trim() === name.toLowerCase());
    if (!matches.length){ errEl.textContent = 'No encontré ese nombre en este grupo'; return; }
    if (matches.length > 1){ errEl.textContent = 'Hay más de una cuenta con ese nombre. Pide a la admin que renombre una.'; return; }
    state.pendingUserId = matches[0].id;
    state.setupStep = 'enterPin';
    render();
    return;
  }
  if (a === 'pickUser'){
    const uid = btn.dataset.uid;
    state.pendingUserId = uid;
    state.setupStep = 'enterPin';
    render();
    return;
  }
  if (a === 'submitPin'){
    const u = state.users.find(x => x.id === state.pendingUserId);
    const pin = document.getElementById('pinInput').value;
    const errEl = document.getElementById('pinError');
    if (!u) return;
    // Migration from v1: if user has no pinHash, treat this entry as SETTING their PIN
    if (!u.pinHash){
      if (pin.length < 4){ errEl.textContent = 'Crea un PIN de al menos 4 caracteres'; return; }
      u.pinHash = await sha(pin);
      await saveUsers(state.users);
      state.currentUser = u.id;
      try { await afterLogin(u.id); }
      catch(err){ errEl.textContent = err.message || 'No pude enlazar este usuario.'; state.currentUser = null; return; }
      state.view = 'home'; state.setupStep = null;
      toast('PIN creado. ¡Bienvenida! 💪');
      render(); return;
    }
    const hash = await sha(pin);
    if (hash === u.pinHash){
      state.currentUser = u.id;
      try { await afterLogin(u.id); }
      catch(err){ errEl.textContent = err.message || 'No pude enlazar este usuario.'; state.currentUser = null; return; }
      state.view = 'home'; state.setupStep = null;
      toast('Bienvenida 💪');
      render();
    } else {
      errEl.textContent = 'PIN incorrecto';
      document.getElementById('pinInput').value = '';
    }
    return;
  }
  if (a === 'viewOnlyMode'){
    state.currentUser = null; clearMe(); clearAuth();
    state.view = 'home'; state.setupStep = null;
    render(); return;
  }
  if (a === 'selectAccountGroup'){
    state.enteringGroup = true;
    await switchGroup(btn.dataset.group);
    return;
  }
  if (a === 'checkInvite'){
    const name = (document.getElementById('nameInput').value || '').trim();
    const inv = (document.getElementById('invInput').value || '').trim();
    const errEl = document.getElementById('invError');
    if (!name){ errEl.textContent = 'Ingresa tu nombre'; return; }
    if (name.length < 2){ errEl.textContent = 'Nombre muy corto'; return; }
    if (state.users.some(u => u.name.toLowerCase().trim() === name.toLowerCase().trim())){
      errEl.textContent = 'Ese nombre ya está en uso'; return;
    }
    const expected = state.invitationPassword || INVITATION_PASSWORD_DEFAULT;
    if (inv !== expected){ errEl.textContent = 'Contraseña de invitación incorrecta'; return; }
    state.pendingNewName = name;
    state.setupStep = 'newUserPin';
    render();
    return;
  }
  if (a === 'finalizeUser'){
    const p1 = document.getElementById('newPin').value;
    const p2 = document.getElementById('newPin2').value;
    const errEl = document.getElementById('pinError2');
    if (p1.length < 4){ errEl.textContent = 'El PIN debe tener al menos 4 caracteres'; return; }
    if (p1 !== p2){ errEl.textContent = 'Los PINs no coinciden'; return; }
    const id = 'u_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
    const color = userColor(state.users.length);
    const pinHash = await sha(p1);
    const user = { id, name: state.pendingNewName, color, pinHash, createdAt: Date.now() };
    if (groupPath() !== DEFAULT_GROUP) user.joinedAt = Date.now();
    state.users.push(user);
    await saveUsers(state.users);
    state.currentUser = id;
    try { await afterLogin(id); }
    catch(err){ errEl.textContent = err.message || 'No pude enlazar este usuario.'; state.currentUser = null; return; }
    state.view = 'home'; state.setupStep = null;
    state.pendingNewName = null;
    toast('¡Cuenta creada!');
    render();
    return;
  }

  // ====== Groups ======
  if (a === 'groupMenu'){
    closeModal();
    const canShowGroups = !!state.currentUser;
    const groups = canShowGroups ? visibleAccountGroups().map(g => `
      <button data-action="switchGroup" data-group="${esc(g)}" style="width:100%;padding:12px;display:flex;align-items:center;gap:10px;background:${g===groupPath()?'var(--accent-bg)':'transparent'};border:none;text-align:left;border-radius:8px;">
        <i class="ti ${g===groupPath()?'ti-circle-check':'ti-circle'}" style="font-size:17px;color:${g===groupPath()?'var(--accent)':'var(--text-dim)'};"></i>
        <span style="flex:1;min-width:0;">
          <span style="display:block;font-weight:${g===groupPath()?'600':'500'};">${esc(groupDisplayName(g))}</span>
          <span class="muted mono" style="display:block;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(g)}</span>
        </span>
      </button>`).join('') : '';
    openModal(`
      <h2 style="margin-bottom:4px;">Grupos</h2>
      <p class="muted" style="font-size:13px;margin:0 0 12px;">${canShowGroups ? 'Cada grupo tiene sus propios usuarios, rutinas y progreso.' : 'Por privacidad, tus grupos solo se muestran después de iniciar sesión.'}</p>
      ${canShowGroups ? `<div class="card" style="padding:6px;margin-bottom:12px;">${groups}</div>` : ''}
      <div style="display:flex;gap:8px;margin-bottom:8px;">
        <button data-action="createGroupModal" style="flex:1;padding:11px;"><i class="ti ti-plus" style="font-size:14px;vertical-align:-2px;color:var(--accent);"></i> Crear</button>
        <button data-action="joinGroupModal" style="flex:1;padding:11px;"><i class="ti ti-login" style="font-size:14px;vertical-align:-2px;color:var(--accent);"></i> Unirse</button>
      </div>
      <button data-action="closeModal" style="width:100%;padding:10px;background:var(--bg-elev-2);">Cancelar</button>
    `, () => { modalRoot.querySelectorAll('[data-action]').forEach(el => el.addEventListener('click', handle)); });
    return;
  }
  if (a === 'switchGroup'){
    closeModal();
    state.enteringGroup = true;
    await switchGroup(btn.dataset.group);
    return;
  }
  if (a === 'createGroupModal'){
    closeModal();
    openModal(`
      <h2 style="margin-bottom:8px;">Crear Grupo</h2>

      <label class="section-label" style="margin-bottom:6px;">Tu nombre</label>

        <button class="primary" data-action="submitCreateGroup" style="flex:1;padding:10px;font-weight:600;">Crear</button>
      </div>
    `, () => { modalRoot.querySelectorAll('[data-action]').forEach(el => el.addEventListener('click', handle)); });
    return;
  }

    const name = (document.getElementById('newGroupName').value || '').trim();

      const adminName = (document.getElementById('newGroupAdminName').value || '').trim();

      if (adminName.length < 2){ err.textContent = 'Escribe tu nombre'; return; }
      if (adminPin.length < 4){ err.textContent = 'Tu PIN debe tener mínimo 4 caracteres'; return; }

        id: 'u_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),

    }
    closeModal();
    await createGroup(id, name, pw, mode);

  if (a === 'joinGroupModal'){
    closeModal();
    openModal(`
      <h2 style="margin-bottom:8px;">Unirse A Un Grupo</h2>
      <p class="muted" style="font-size:13px;margin:0 0 12px;">Pide a la admin el código del grupo y la contraseña de invitación.</p>

        <p style="margin:0;"><strong style="color:var(--text);">Color:</strong> compara músculos dentro de ${scope === 'general' ? 'toda tu rutina actual' : 'este día'}: azul claro = bajo, azul = medio, naranja = alto.</p>
      </div>
      <button class="primary" data-action="closeModal" style="width:100%;margin-top:16px;padding:12px;">Entendido</button>
    `, () => { modalRoot.querySelectorAll('[data-action]').forEach(el => el.addEventListener('click', handle)); });
    return;
  }
  if (a === 'editExerciseFromView'){ state.view = 'editExercise'; render(); return; }

  // ====== Session save ======
  if (a === 'toggleUnilateral'){
    const on = document.getElementById('unilateralMode')?.checked;
    document.querySelectorAll('.set-row').forEach(row => {
      setRowUnilateral(row, on);
    });
    return;
  }
  if (a === 'copyFirstSet'){
    const rows = Array.from(document.querySelectorAll('.set-row'));
    if (rows.length < 2){ toast('No hay sets para copiar'); return; }
    const first = rows[0];
    const firstUnilateral = !!first.querySelector('.set-unilateral')?.checked;
    const fields = firstUnilateral
      ? ['left-reps-in','left-weight-in','right-reps-in','right-weight-in']
      : ['reps-in','weight-in'];
    rows.slice(1).forEach(row => {
      setRowUnilateral(row, firstUnilateral);
      fields.forEach(cls => {
        const src = first.querySelector('.'+cls);
        const dst = row.querySelector('.'+cls);
        if (src && dst && !dst.value) dst.value = src.value;
      });
    });
    toast('Set 1 copiado a los campos vacíos');
    return;
  }
  if (a === 'addSet'){
    const c = document.getElementById('setsContainer'); const n = c.children.length + 1;
    const unilateral = !!document.getElementById('unilateralMode')?.checked;
    const prev = c.lastElementChild;
    let seed = null;
    if (prev){
      const prevUnilateral = !!prev.querySelector('.set-unilateral')?.checked;
      if (prevUnilateral){
        seed = {
          unilateral:true,
          left:{ reps: prev.querySelector('.left-reps-in')?.value || '', weight: prev.querySelector('.left-weight-in')?.value || '' },
          right:{ reps: prev.querySelector('.right-reps-in')?.value || '', weight: prev.querySelector('.right-weight-in')?.value || '' }
        };
      } else {
        seed = { reps: prev.querySelector('.reps-in')?.value || '', weight: prev.querySelector('.weight-in')?.value || '' };
      }
    }
    c.insertAdjacentHTML('beforeend', renderSetRow(n - 1, seed, null, seed ? !!seed.unilateral : unilateral));
    const added = c.lastElementChild;
    if (added) {
      added.querySelectorAll('.del-set').forEach(b => b.addEventListener('click', ()=> added.remove()));
      added.querySelector('.set-unilateral')?.addEventListener('change', e => setRowUnilateral(added, e.target.checked));
    }
    return;
  }
  if (a === 'saveSession'){
    if (!state.currentUser){ toast('Inicia sesión para registrar'); return; }
    if (!authValid()) { toast('Sesión expirada, vuelve a entrar'); return; }
    const date = document.getElementById('sessionDate').value || today();
    const rows = document.querySelectorAll('.set-row');
    const sets = [];
    rows.forEach(r => {
      const note = (r.querySelector('.note-in').value || '').trim();
      const rowUnilateral = !!r.querySelector('.set-unilateral')?.checked;
      if (rowUnilateral){
        const left = {
          reps: Number(r.querySelector('.left-reps-in').value),
          weight: Number(r.querySelector('.left-weight-in').value)
        };
        const right = {
          reps: Number(r.querySelector('.right-reps-in').value),
          weight: Number(r.querySelector('.right-weight-in').value)
        };
        if (left.reps > 0 && left.weight >= 0 && !(right.reps > 0)){
          right.reps = left.reps; right.weight = left.weight;
        }
        if (right.reps > 0 && right.weight >= 0 && !(left.reps > 0)){
          left.reps = right.reps; left.weight = right.weight;
        }
        if ((left.reps > 0 && left.weight >= 0) || (right.reps > 0 && right.weight >= 0)){
          const s = { unilateral:true, left, right, reps:setDisplayReps({unilateral:true,left,right}), weight:setMaxWeight({unilateral:true,left,right}) };
          if (note) s.note = note;
          sets.push(s);
        }
      } else {
        const reps = Number(r.querySelector('.reps-in').value);
        const weight = Number(r.querySelector('.weight-in').value);
        if (reps > 0 && weight >= 0){ const s = { reps, weight }; if (note) s.note = note; sets.push(s); }
      }
    });
    const sessionNote = (document.getElementById('sessionNote').value || '').trim();
    const status = document.getElementById('saveStatus');
    if (!sets.length){ status.style.color = 'var(--warning)'; status.textContent = 'Ingresa al menos un set con reps y peso.'; return; }
    const ek = exerciseKey(state.currentDay, state.currentExerciseIdx);
    const userLogs = state.logs[state.currentUser] || {};
    if (!userLogs[ek]) userLogs[ek] = [];
    if (state.editingSession && state.editingSession.ek === ek && state.editingSession.uid === state.currentUser && state.editingSession.date !== date){
      userLogs[ek] = userLogs[ek].filter(e => e.date !== state.editingSession.date);
    }
    const idx = userLogs[ek].findIndex(e => e.date === date);
    const entry = { date, sets }; if (sessionNote) entry.note = sessionNote;
    if (idx >= 0) userLogs[ek][idx] = entry; else userLogs[ek].push(entry);
    state.logs[state.currentUser] = userLogs;
    await saveUserLogs(state.currentUser, userLogs);
    status.style.color = 'var(--success)'; status.textContent = '✓ Guardado. Sigue así 💪';
    state.editingSession = null;
    toast('Sesión guardada');
    setTimeout(()=> render(), 600);
    return;
  }
  if (a === 'cancelEditSession'){
    state.editingSession = null;
    render(); return;
  }
  if (a === 'editSession'){
    const uid = btn.dataset.uid;
    if (uid !== state.currentUser){ toast('Solo puedes editar tus sesiones'); return; }
    const [day, idx] = btn.dataset.ek.split(':');
    state.currentDay = day;
    state.currentExerciseIdx = Number(idx);
    state.editingSession = { uid, ek: btn.dataset.ek, date: btn.dataset.date };
    state.view = 'exercise';
    state.showAlts = false;
    state.showMuscles = false;
    render(); return;
  }
  if (a === 'deleteSession'){
    const uid = btn.dataset.uid;
    if (uid !== state.currentUser){ toast('Solo puedes borrar tus sesiones'); return; }
    openModal(`
      <h2 style="margin-bottom:8px;color:var(--danger);">Eliminar sesión</h2>
      <p style="font-size:14px;margin:0 0 14px;">¿Seguro que quieres borrar la sesión de <strong>${esc(exerciseNameForKey(btn.dataset.ek))}</strong> del <strong>${esc(btn.dataset.date)}</strong>?</p>
      <div style="display:flex;gap:8px;">
        <button data-action="closeModal" style="flex:1;padding:10px;">Cancelar</button>
        <button class="danger" data-action="confirmDeleteSession" data-uid="${uid}" data-ek="${btn.dataset.ek}" data-date="${btn.dataset.date}" style="flex:1;padding:10px;font-weight:600;">Eliminar</button>
      </div>
    `, () => { modalRoot.querySelectorAll('[data-action]').forEach(el => el.addEventListener('click', handle)); });
    return;
  }
  if (a === 'confirmDeleteSession'){
    const uid = btn.dataset.uid;
    const ek = btn.dataset.ek;
    const date = btn.dataset.date;
    if (uid !== state.currentUser){ toast('Solo puedes borrar tus sesiones'); return; }
    const userLogs = state.logs[uid] || {};
    userLogs[ek] = (userLogs[ek] || []).filter(e => e.date !== date);
    if (!userLogs[ek].length) delete userLogs[ek];
    state.logs[uid] = userLogs;
    await saveUserLogs(uid, userLogs);
    if (state.editingSession && state.editingSession.uid === uid && state.editingSession.ek === ek && state.editingSession.date === date) state.editingSession = null;
    closeModal(); toast('Sesión eliminada'); render(); return;
  }
  if (a === 'setMode'){ state.compareMode = btn.dataset.mode; render(); return; }

  // ====== EDIT ROUTINE actions ======
  if (a === 'addNewEx'){
    state.currentExerciseIdx = -1; // new
    state.view = 'editExercise'; render(); return;
  }
  if (a === 'editExFromList'){
    state.currentExerciseIdx = Number(btn.dataset.idx);
    state.view = 'editExercise'; render(); return;
  }
  if (a === 'moveExUp' || a === 'moveExDown'){
    const idx = Number(btn.dataset.idx);
    const dayKey = state.currentDay;
    const src = getCurrentSource(dayKey);
    let routine;
    if (src === 'personal'){ routine = (state.personalRoutines[state.currentUser]||{})[dayKey]; }
    else { routine = state.sharedRoutine && state.sharedRoutine[dayKey]; }
    if (!routine) return;
    const swap = a === 'moveExUp' ? idx - 1 : idx + 1;
    if (swap < 0 || swap >= routine.exercises.length) return;
    [routine.exercises[idx], routine.exercises[swap]] = [routine.exercises[swap], routine.exercises[idx]];
    if (src === 'personal'){
      await savePersonalRoutine(state.currentUser, state.personalRoutines[state.currentUser]);
    } else {
      await saveSharedRoutine(state.sharedRoutine);
    }
    render(); return;
  }
  if (a === 'deleteEx'){
    const idx = Number(btn.dataset.idx);
    const dayKey = state.currentDay;
    const src = getCurrentSource(dayKey);
    let routine = src === 'personal' ? (state.personalRoutines[state.currentUser]||{})[dayKey] : (state.sharedRoutine && state.sharedRoutine[dayKey]);
    if (!routine) return;
    const ek = exerciseKey(dayKey, idx);
    // count entries across all users for this exKey
    let totalEntries = 0;
    for (const u of state.users){ totalEntries += getEntries(u.id, ek).length; }
    openModal(`
      <h2 style="margin-bottom:8px;">Eliminar ejercicio</h2>
      <p style="font-size:14px;margin:0 0 14px;">¿Eliminar <strong>${esc(routine.exercises[idx].name)}</strong>?</p>
      ${totalEntries > 0 ? `<p class="muted" style="font-size:13px;margin:0 0 14px;">Tiene <strong>${totalEntries}</strong> entrenos registrados. Elige qué hacer:</p>
      <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:14px;">
        <label style="display:flex;align-items:flex-start;gap:8px;padding:10px;background:var(--bg-elev-2);border-radius:var(--radius-sm);cursor:pointer;">
          <input type="radio" name="exDelMode" value="keep" checked style="margin-top:3px;" />
          <div><div style="font-size:14px;font-weight:500;">Mantener historial</div>
          <div class="muted" style="font-size:12px;">Los datos se quedan en la base por si vuelves a agregar el ejercicio. Quedan ligados a la posición original.</div></div>
        </label>
        <label style="display:flex;align-items:flex-start;gap:8px;padding:10px;background:var(--bg-elev-2);border-radius:var(--radius-sm);cursor:pointer;">
          <input type="radio" name="exDelMode" value="purge" style="margin-top:3px;" />
          <div><div style="font-size:14px;font-weight:500;color:var(--danger);">Borrar también el historial</div>
          <div class="muted" style="font-size:12px;">Elimina ejercicio y todos sus entrenos. No se puede deshacer.</div></div>
        </label>
      </div>` : ''}
      <div style="display:flex;gap:8px;">
        <button data-action="closeModal" style="flex:1;padding:10px;">Cancelar</button>
        <button class="danger" data-action="confirmDeleteEx" data-idx="${idx}" style="flex:1;padding:10px;font-weight:600;">Eliminar</button>
      </div>
    `, () => { modalRoot.querySelectorAll('[data-action]').forEach(el => el.addEventListener('click', handle)); });
    return;
  }
  if (a === 'confirmDeleteEx'){
    const idx = Number(btn.dataset.idx);
    const dayKey = state.currentDay;
    const src = getCurrentSource(dayKey);
    const purge = (document.querySelector('input[name="exDelMode"]:checked')||{}).value === 'purge';
    let routine = src === 'personal' ? (state.personalRoutines[state.currentUser]||{})[dayKey] : (state.sharedRoutine && state.sharedRoutine[dayKey]);
    if (!routine) return;
    routine.exercises.splice(idx, 1);
    if (src === 'personal'){
      await savePersonalRoutine(state.currentUser, state.personalRoutines[state.currentUser]);
    } else {
      await saveSharedRoutine(state.sharedRoutine);
    }
    if (purge){
      // remove that exercise's key from ALL users' logs
      // but note: keys are dayKey:index, deletion shifts indexes — to keep simplicity we only purge the specific key
      const ek = exerciseKey(dayKey, idx);
      for (const u of state.users){
        if (state.logs[u.id] && state.logs[u.id][ek]){
          delete state.logs[u.id][ek];
          await saveUserLogs(u.id, state.logs[u.id]);
        }
      }
    }
    closeModal(); toast('Ejercicio eliminado'); render(); return;
  }
  if (a === 'saveRoutineMeta'){
    const dayKey = state.currentDay;
    const src = getCurrentSource(dayKey);
    const label = (document.getElementById('dayLabel').value || '').trim() || 'Día';
    const focus = (document.getElementById('dayFocus').value || '').trim();
    if (src === 'personal'){
      const pr = state.personalRoutines[state.currentUser] || {};
      if (!pr[dayKey]) pr[dayKey] = { exercises: [] };
      pr[dayKey].label = label; pr[dayKey].focus = focus;
      pr[dayKey].icon = pr[dayKey].icon || 'ti-barbell';
      state.personalRoutines[state.currentUser] = pr;
      await savePersonalRoutine(state.currentUser, pr);
    } else {
      if (!state.sharedRoutine) state.sharedRoutine = {};
      if (!state.sharedRoutine[dayKey]) state.sharedRoutine[dayKey] = { exercises: [] };
      state.sharedRoutine[dayKey].label = label;
      state.sharedRoutine[dayKey].focus = focus;
      state.sharedRoutine[dayKey].icon = state.sharedRoutine[dayKey].icon || 'ti-barbell';
      await saveSharedRoutine(state.sharedRoutine);
    }
    toast('Cambios guardados');
    state.view = 'day'; render(); return;
  }

  // ====== EDIT EXERCISE actions ======
  if (a === 'cycleMuscle'){
    const mid = btn.dataset.mid;
    const ed = window._editEx;
    const inP = ed.primary.indexOf(mid);
    const inS = ed.secondary.indexOf(mid);
    if (inP === -1 && inS === -1){ ed.primary.push(mid); }
    else if (inP !== -1){ ed.primary.splice(inP,1); ed.secondary.push(mid); }
    else if (inS !== -1){ ed.secondary.splice(inS,1); }
    // re-render only the muscle grid
    const grid = document.getElementById('muscleGrid');
    grid.innerHTML = MUSCLE_IDS.map(m => {
      const isP = ed.primary.includes(m);
      const isS = ed.secondary.includes(m);
      const cls = isP ? 'primary' : isS ? 'secondary' : '';
      return `<div class="muscle-chip ${cls}" data-action="cycleMuscle" data-mid="${m}">
        <span>${MUSCLES[m].label}</span>
        <span style="font-size:10px;font-weight:600;">${isP?'●●':isS?'●':''}</span>
      </div>`;
    }).join('');
    grid.querySelectorAll('[data-action]').forEach(el => el.addEventListener('click', handle));
    return;
  }
  if (a === 'addAlt'){
    const c = document.getElementById('altsContainer');
    const i = c.children.length;
    const div = document.createElement('div');
    div.className = 'alt-row';
    div.innerHTML = `<input type="text" class="alt-in" data-i="${i}" value="" maxlength="80" placeholder="Alternativa..." />
      <button data-action="removeAlt" data-i="${i}" class="ghost-danger" style="padding:6px;border:none;"><i class="ti ti-x" style="font-size:14px;"></i></button>`;
    c.appendChild(div);
    div.querySelector('[data-action]').addEventListener('click', handle);
    div.querySelector('input').focus();
    return;
  }
  if (a === 'removeAlt'){
    btn.closest('.alt-row').remove();
    return;
  }
  if (a === 'saveExercise'){
    const dayKey = state.currentDay;
    const src = getCurrentSource(dayKey);
    const idx = state.currentExerciseIdx;
    const isNew = idx === -1 || idx == null;
    const ed = window._editEx;
    ed.name = (document.getElementById('exName').value || '').trim();
    ed.video = (document.getElementById('exVideo').value || '').trim();
    ed.alts = Array.from(document.querySelectorAll('.alt-in')).map(i => i.value.trim()).filter(Boolean);
    if (!ed.name){ toast('Ingresa un nombre'); return; }
    let routine;
    if (src === 'personal'){
      const pr = state.personalRoutines[state.currentUser] || {};
      if (!pr[dayKey]) pr[dayKey] = { label:'Día', focus:'', icon:'ti-barbell', exercises:[] };
      routine = pr[dayKey];
      state.personalRoutines[state.currentUser] = pr;
    } else {
      if (!state.sharedRoutine) state.sharedRoutine = {};
      if (!state.sharedRoutine[dayKey]) state.sharedRoutine[dayKey] = { label:'Día', focus:'', icon:'ti-barbell', exercises:[] };
      routine = state.sharedRoutine[dayKey];
    }
    if (isNew){ routine.exercises.push(ed); }
    else { routine.exercises[idx] = ed; }
    if (src === 'personal'){ await savePersonalRoutine(state.currentUser, state.personalRoutines[state.currentUser]); }
    else { await saveSharedRoutine(state.sharedRoutine); }
    toast(isNew ? 'Ejercicio creado' : 'Ejercicio actualizado');
    state.view = 'editRoutine'; render(); return;
  }
}

// ====== REALTIME SUBSCRIPTIONS ======
let unsubs = [];
function subscribeRealtime(){
  if (!firebaseReady) return;
  unsubs.forEach(u => u && u());
  unsubs = [];
  const gid = groupPath();
  unsubs.push(onSnapshot(doc(db,'salas',gid,'meta','users'), async (snap)=>{
    if (gid !== state.currentGroup) return;
    if (snap.exists()){
      const rawUsers = snap.data().users || [];
      const newUsers = await filterUsersForGroup(gid, rawUsers, state.groupConfig, [state.currentUser, loadMe(gid)]);
      if (gid !== state.currentGroup) return;
      if (gid !== DEFAULT_GROUP && JSON.stringify(rawUsers) !== JSON.stringify(newUsers)){
        await saveUsersForGroup(gid, newUsers);
      }
      const changed = JSON.stringify(newUsers) !== JSON.stringify(state.users);
      state.users = newUsers;
      // if current user got deleted, log out
      if (state.currentUser && !state.users.find(u => u.id === state.currentUser)){
        state.currentUser = null; clearMe(); clearAuth();
        toast('Tu usuario fue eliminado');
        state.view = 'setup'; state.setupStep = state.users.length ? 'pickUser' : 'newUser';
        render(); return;
      }
      if (changed) requestRealtimeRender();
    }
  }, console.error));
  unsubs.push(onSnapshot(doc(db,'salas',gid,'meta','config'), (snap)=>{
    if (gid !== state.currentGroup) return;
    if (snap.exists()){
      state.groupConfig = normalizeGroupConfig(snap.data(), gid);
      state.invitationPassword = state.groupConfig.invitationPassword || INVITATION_PASSWORD_DEFAULT;
    }
  }, console.error));
  unsubs.push(onSnapshot(doc(db,'salas',gid,'routines','shared'), (snap)=>{
    if (gid !== state.currentGroup) return;
    if (snap.exists() && snap.data().routine){
      const r = snap.data().routine;
      if (JSON.stringify(r) !== JSON.stringify(state.sharedRoutine)){
        state.sharedRoutine = r;
        requestRealtimeRender();
      }
    }
  }, console.error));
  unsubs.push(onSnapshot(collection(db,'salas',gid,'logs'), (snap)=>{
    if (gid !== state.currentGroup) return;
    let changed = false;
    snap.docChanges().forEach(ch => {
      const id = ch.doc.id;
      if (ch.type === 'removed'){
        if (state.logs[id]){ delete state.logs[id]; changed = true; }
      } else {
        const data = ch.doc.data();
        if (JSON.stringify(state.logs[id]) !== JSON.stringify(data)){
          state.logs[id] = data; changed = true;
        }
      }
    });
    if (changed) requestRealtimeRender();
  }, console.error));
  unsubs.push(onSnapshot(collection(db,'salas',gid,'personalRoutines'), (snap)=>{
    if (gid !== state.currentGroup) return;
    let changed = false;
    snap.docChanges().forEach(ch => {
      const id = ch.doc.id;
      if (ch.type === 'removed'){
        if (state.personalRoutines[id]){ delete state.personalRoutines[id]; changed = true; }
      } else {
        const data = ch.doc.data().routine || {};
        if (JSON.stringify(state.personalRoutines[id]) !== JSON.stringify(data)){
          state.personalRoutines[id] = data; changed = true;
        }
      }
    });
    if (changed) requestRealtimeRender();
  }, console.error));
}

// ====== INIT ======
async function init(){
  removeStrayBodyTextNodes();
  rememberGroup(state.currentGroup);
  if (firebaseReady && auth){
    onAuthStateChanged(auth, handleAuthState);
    render();
    return;
  }
  await reloadGroup();
}
init();
</script>
</body>
</html>
