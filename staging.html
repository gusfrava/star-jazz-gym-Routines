<title>Star Jazz Gym Buddy</title>

<style>
:root {
  --bg:#0a0e1a;
  --bg-grad: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(59,158,255,0.15), transparent 70%), #0a0e1a;
  --bg-elev:#10172a;
  --bg-elev-2:#1a2440;
  --bg-elev-3:#243156;
  --border:rgba(255,255,255,0.06);
  --border-strong:rgba(255,255,255,0.12);
  --border-accent:rgba(59,158,255,0.3);
  --text:#f0f4ff;
  --text-muted:#8b96b3;
  --text-dim:#5a6585;
  --accent:#3b9eff;
  --accent-hover:#5cb0ff;
  --accent-glow:rgba(59,158,255,0.35);
  --accent-bg:rgba(59,158,255,0.12);
  --accent-bg-strong:rgba(59,158,255,0.2);
  --accent-border:rgba(59,158,255,0.4);
  --accent-grad: linear-gradient(135deg, #3b9eff 0%, #6ec2ff 100%);
  --accent-grad-soft: linear-gradient(135deg, rgba(59,158,255,0.15), rgba(110,194,255,0.05));
  --success:#34d399;
  --success-bg:rgba(52,211,153,0.12);
  --warning:#fbbf24;
  --warning-bg:rgba(251,191,36,0.12);
  --danger:#f87171;
  --danger-bg:rgba(248,113,113,0.12);
  --info:#60a5fa;
  --info-bg:rgba(96,165,250,0.12);
  --radius:14px;
  --radius-sm:10px;
  --radius-lg:20px;
  --radius-pill:999px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.25), 0 1px 3px rgba(0,0,0,0.15);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4), 0 2px 6px rgba(0,0,0,0.2);
  --shadow-glow: 0 0 0 1px rgba(59,158,255,0.3), 0 8px 24px rgba(59,158,255,0.25);
  --font-sans: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'Geist Mono', ui-monospace, monospace;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg:#f5f8ff;
    --bg-grad: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(59,158,255,0.12), transparent 70%), #f5f8ff;
    --bg-elev:#ffffff;
    --bg-elev-2:#eef3fc;
    --bg-elev-3:#dfe8f7;
    --border:rgba(15,23,42,0.06);
    --border-strong:rgba(15,23,42,0.12);
    --text:#0f172a;
    --text-muted:#5e6c87;
    --text-dim:#94a3b8;
    --accent:#1e7fe6;
    --accent-bg:rgba(59,158,255,0.1);
    --accent-bg-strong:rgba(59,158,255,0.18);
    --accent-border:rgba(59,158,255,0.35);
    --success-bg:rgba(52,211,153,0.15);
    --warning-bg:rgba(251,191,36,0.18);
    --info-bg:rgba(96,165,250,0.15);
    --danger-bg:rgba(248,113,113,0.12);
    --shadow-md: 0 4px 12px rgba(15,23,42,0.06), 0 1px 3px rgba(15,23,42,0.04);
    --shadow-lg: 0 10px 30px rgba(15,23,42,0.08), 0 2px 6px rgba(15,23,42,0.04);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg-grad);background-attachment:fixed;color:var(--text);
  font-family:var(--font-sans);font-size:15px;line-height:1.5;font-feature-settings:'cv11','ss01';
  letter-spacing:-0.005em;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
#app{max-width:720px;margin:0 auto;padding:20px 18px 80px;min-height:100vh}
h1,h2,h3{font-weight:600;margin:0;letter-spacing:-0.02em}
h1{font-size:26px;line-height:1.15}h2{font-size:18px}h3{font-size:15px}
button{font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;background:transparent;color:var(--text);
  border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:9px 16px;
  transition:all 0.18s cubic-bezier(0.4,0,0.2,1);letter-spacing:-0.005em}
button:hover{background:var(--bg-elev-2)}
button:active{transform:scale(0.97)}
button:disabled{opacity:0.4;cursor:not-allowed}
button.primary{background:var(--accent-grad);color:#fff;border-color:transparent;
  box-shadow:0 2px 8px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,0.2);font-weight:600}
button.primary:hover{filter:brightness(1.08);box-shadow:0 4px 16px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,0.25);transform:translateY(-1px)}
button.danger{background:var(--danger);color:#fff;border-color:transparent;box-shadow:0 2px 8px rgba(248,113,113,0.35);font-weight:600}
button.danger:hover{filter:brightness(1.1)}
button.ghost-danger{color:var(--danger);border-color:var(--danger);background:transparent}
button.ghost-danger:hover{background:var(--danger-bg)}
input,textarea,select{font-family:inherit;font-size:14px;background:var(--bg-elev);color:var(--text);
  border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:11px 14px;width:100%;
  transition:all 0.18s ease;letter-spacing:-0.005em}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-bg)}
input[type="number"]{-moz-appearance:textfield}
input[type="number"]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type="checkbox"]{width:auto;margin:0;accent-color:var(--accent)}
input[type="date"]{color-scheme:dark}
@media (prefers-color-scheme:light){input[type="date"]{color-scheme:light}}
.card{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow-sm)}
.muted{color:var(--text-muted)}.dim{color:var(--text-dim)}.mono{font-family:var(--font-mono)}
.row{display:flex;align-items:center;gap:10px}.spacer{flex:1}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex-shrink:0}
.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:var(--radius-pill);
  font-size:12px;font-weight:500;letter-spacing:-0.005em}
.admin-pill{background:var(--accent-bg);color:var(--accent);border:1px solid var(--accent-border);
  padding:2px 8px;border-radius:var(--radius-pill);font-size:10px;font-weight:600;
  text-transform:uppercase;letter-spacing:0.06em;font-family:var(--font-mono)}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(10px);
  background:var(--bg-elev-3);color:var(--text);padding:12px 22px;border-radius:var(--radius-pill);
  border:1px solid var(--border-accent);box-shadow:var(--shadow-lg), 0 0 0 4px rgba(59,158,255,0.08);
  font-size:13px;font-weight:500;z-index:500;opacity:0;pointer-events:none;
  transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);letter-spacing:-0.005em}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.loader{display:inline-block;width:16px;height:16px;border:2px solid var(--border-strong);
  border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sync-pill{display:inline-flex;align-items:center;gap:7px;font-size:11px;color:var(--text-muted);
  background:var(--bg-elev-2);border:1px solid var(--border);padding:5px 11px;border-radius:var(--radius-pill);
  font-family:var(--font-mono);letter-spacing:0.02em}
.sync-pill .pulse{width:6px;height:6px;border-radius:50%;background:var(--success);animation:pulse-ring 2s infinite}
@keyframes pulse-ring{0%{box-shadow:0 0 0 0 rgba(52,211,153,0.5)}70%{box-shadow:0 0 0 6px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
.modal-backdrop{position:fixed;inset:0;background:rgba(5,10,25,0.7);backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);z-index:400;display:flex;align-items:center;justify-content:center;
  padding:16px;animation:fadeIn 0.2s ease}
.modal{background:var(--bg-elev);border:1px solid var(--border-strong);border-radius:var(--radius-lg);
  padding:24px;max-width:440px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);
  animation:slideUp 0.3s cubic-bezier(0.34,1.56,0.64,1)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px) scale(0.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.muscle-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.muscle-chip{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;
  background:var(--bg-elev-2);border-radius:var(--radius-sm);font-size:13px;cursor:pointer;user-select:none;
  border:1px solid transparent;transition:all 0.15s ease}
.muscle-chip:hover{background:var(--bg-elev-3)}
.muscle-chip.primary{background:var(--accent-bg-strong);color:var(--accent);border-color:var(--accent-border)}
.muscle-chip.secondary{background:var(--warning-bg);color:var(--warning);border-color:var(--warning)}
.alt-row{display:flex;gap:6px;align-items:center;margin-bottom:6px}.alt-row input{flex:1}
.tab-bar{display:flex;background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);
  padding:4px;gap:4px;margin-bottom:16px}
.tab-bar button{flex:1;padding:9px 12px;border:none;background:transparent;font-size:13px;
  color:var(--text-muted);border-radius:8px;transition:all 0.2s ease;letter-spacing:-0.005em}
.tab-bar button:hover{color:var(--text);background:var(--bg-elev-2)}
.tab-bar button.active{background:var(--accent-grad);color:#fff;font-weight:600;box-shadow:0 2px 8px var(--accent-glow)}
.day-card{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px 16px;margin-bottom:10px;display:block;width:100%;text-align:left;font:inherit;color:inherit;
  cursor:pointer;transition:all 0.2s ease;position:relative;overflow:hidden}
.day-card::before{content:'';position:absolute;inset:0;background:var(--accent-grad-soft);
  opacity:0;transition:opacity 0.25s;pointer-events:none}
.day-card:hover{border-color:var(--border-accent);transform:translateY(-1px);box-shadow:var(--shadow-md)}
.day-card:hover::before{opacity:1}
.day-card:active{transform:translateY(0)}
.exercise-card{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:12px 14px;margin-bottom:8px;display:block;width:100%;text-align:left;font:inherit;color:inherit;
  cursor:pointer;transition:all 0.18s ease}
.exercise-card:hover{background:var(--bg-elev-2);border-color:var(--border-strong)}
.icon-tile{width:42px;height:42px;border-radius:12px;background:var(--accent-bg);border:1px solid var(--accent-border);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--accent)}
.user-pill{display:inline-flex;align-items:center;gap:7px;padding:5px 12px 5px 6px;
  border-radius:var(--radius-pill);font-size:13px;background:var(--bg-elev);border:1px solid var(--border);
  font-weight:500;cursor:pointer;transition:all 0.15s;font-family:inherit}
.user-pill:hover{background:var(--bg-elev-2);border-color:var(--border-strong)}
.group-pill:hover{background:var(--bg-elev-2)!important;border-color:var(--border-strong)!important;color:var(--text)!important}
.section-label{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:0.1em;
  color:var(--text-dim);margin-bottom:10px;font-weight:500}
.set-row{margin-bottom:8px;padding:10px;background:var(--bg-elev-2);border:1px solid var(--border);
  border-radius:var(--radius-sm);transition:all 0.15s ease}
.set-row:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.user-dots{display:flex;gap:3px;align-items:center}
.user-dots .dot{width:8px;height:8px;transition:all 0.2s}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--text-dim)}
::selection{background:var(--accent-bg-strong);color:var(--text)}
.history-entry{padding:12px;background:var(--bg-elev-2);border:1px solid var(--border);
  border-radius:var(--radius-sm);margin-bottom:6px;transition:all 0.15s}
.history-entry:hover{border-color:var(--border-strong)}
.wrap-text{overflow-wrap:anywhere;word-break:break-word;white-space:normal;line-height:1.45}
.date-field{display:block;width:100%;max-width:360px;margin:0 auto;text-align:center;text-align-last:center;font-family:var(--font-mono)}
.banner{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:var(--radius-sm);
  font-size:13px;margin-bottom:14px}
.banner i{font-size:16px;flex-shrink:0;margin-top:1px}
.banner-info{background:var(--info-bg);color:var(--info);border:1px solid rgba(96,165,250,0.25)}
.banner-warning{background:var(--warning-bg);color:var(--warning);border:1px solid rgba(251,191,36,0.25)}
.stat-card{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;box-shadow:var(--shadow-sm);transition:all 0.2s}
.stat-card:hover{border-color:var(--border-strong)}
.stat-value{font-size:24px;font-weight:600;font-family:var(--font-mono);letter-spacing:-0.02em}
.stat-label{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-dim)}
.chart-bar-rect{transition:all 0.4s cubic-bezier(0.34,1.56,0.64,1)}
.chart-bar-rect:hover{filter:brightness(1.15)}
@keyframes fadeInUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeInUp 0.4s ease backwards}

/* ========== ONBOARDING SLIDES ========== */
.onboarding-wrap{position:fixed;inset:0;background:var(--bg-grad);background-attachment:fixed;z-index:350;display:flex;flex-direction:column;animation:fadeIn 0.3s ease}
.onboarding-skip{position:absolute;top:16px;right:16px;background:var(--bg-elev-2);border:1px solid var(--border);color:var(--text-muted);font-size:13px;padding:7px 14px;border-radius:var(--radius-pill);cursor:pointer;z-index:5;font-family:inherit}
.onboarding-skip:hover{background:var(--bg-elev-3);color:var(--text)}
.onboarding-slides{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.onboarding-slides::-webkit-scrollbar{display:none}
.onboarding-slide{flex:0 0 100%;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 28px;max-width:480px;margin:0 auto;text-align:center;min-width:100%}
.onboarding-icon{font-size:80px;margin-bottom:24px;filter:drop-shadow(0 4px 20px var(--accent-glow));animation:floatY 3s ease-in-out infinite}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.onboarding-slide h2{font-size:28px;margin-bottom:12px;background:var(--accent-grad);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-0.02em}
.onboarding-slide p{font-size:16px;color:var(--text-muted);line-height:1.55;max-width:360px;margin:0}
.onboarding-features{margin-top:24px;display:flex;flex-direction:column;gap:10px;width:100%;max-width:340px}
.onboarding-feature{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius-sm);text-align:left;font-size:14px}
.onboarding-feature i{font-size:22px;color:var(--accent);flex-shrink:0}
.onboarding-footer{padding:24px 28px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px;align-items:center}
.onboarding-dots{display:flex;gap:8px}
.onboarding-dot{width:8px;height:8px;border-radius:50%;background:var(--bg-elev-3);transition:all 0.3s;cursor:pointer}
.onboarding-dot.active{background:var(--accent);width:28px;border-radius:4px}
.onboarding-cta{width:100%;max-width:360px;padding:14px;font-size:15px;font-weight:600}

/* ========== HOME TOUR ========== */
.tour-overlay{position:fixed;inset:0;z-index:360;pointer-events:none;animation:fadeIn 0.25s ease}
.tour-bg{position:absolute;inset:0;background:rgba(5,10,25,0.55);backdrop-filter:blur(1px);-webkit-backdrop-filter:blur(1px);pointer-events:auto}
.tour-spotlight{position:absolute;border-radius:14px;box-shadow:0 0 0 9999px rgba(5,10,25,0.55), 0 0 0 4px var(--accent-glow), 0 0 30px var(--accent);background:transparent;pointer-events:none;transition:all 0.4s cubic-bezier(0.4,0,0.2,1)}
.tour-tooltip{position:absolute;background:var(--bg-elev);border:1px solid var(--border-strong);border-radius:var(--radius);padding:16px 18px;max-width:300px;box-shadow:var(--shadow-lg);pointer-events:auto;z-index:2;animation:tourPop 0.3s cubic-bezier(0.34,1.56,0.64,1)}
@keyframes tourPop{from{opacity:0;transform:scale(0.9)}to{opacity:1;transform:scale(1)}}
.tour-tooltip h3{font-size:15px;font-weight:600;margin-bottom:6px;color:var(--text)}
.tour-tooltip p{font-size:13px;color:var(--text-muted);margin:0 0 12px;line-height:1.5}
.tour-progress{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tour-step{font-family:var(--font-mono);font-size:11px;color:var(--text-dim);letter-spacing:0.05em}
.tour-actions{display:flex;gap:8px}
.tour-actions button{padding:6px 12px;font-size:12px;border-radius:8px}

/* ====== Password input with toggle ====== */
.pw-wrap{position:relative;width:100%}
.pw-wrap input{width:100%;padding-right:42px}
.pw-toggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:transparent;border:none;color:var(--text-muted);padding:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:6px;transition:.15s}
.pw-toggle:hover{color:var(--accent);background:var(--bg-elev-2)}
.pw-toggle i{font-size:16px}
.forgot-link{display:inline-block;font-size:12px;color:var(--accent);text-decoration:none;cursor:pointer;background:transparent;border:none;padding:4px 0;font-family:inherit}
.forgot-link:hover{text-decoration:underline}
</style>

function dateKey(date = new Date()){
  const d = date instanceof Date ? date : new Date(date);
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');

// Normalizar texto para búsqueda (sin acentos, minúsculas)
function normalizeText(s){
  return String(s||'').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9\s]/g, ' ')
    .replace(/\s+/g, ' ').trim();
}

// Encuentra grupo muscular por texto (soporta sinónimos)
function findMuscleGroup(query){
  const n = normalizeText(query);
  if (!n) return null;
  for (const [key, info] of Object.entries(MUSCLE_GROUPS)){
    const all = [key, info.label, ...info.aliases].map(normalizeText);
    // exact match
    if (all.includes(n)) return { key, ...info };
    // partial match (only for queries >= 4 chars to avoid false positives like "lat" → lats)
    if (n.length >= 4){
      if (all.some(a => a.length >= 4 && (a.includes(n) || n.includes(a)))) return { key, ...info };
    }
  }
  return null;
}

// Buscar ejercicios por texto libre. Revisa TODO: nombre ES, nombre EN, grupo,
// músculos (CSV + SVG), categoría. Combina match de nombre con match de grupo muscular.
function searchExercises(query, filters = {}){
  const n = normalizeText(query);
  let results = EXERCISE_DB;

  // Filtros estructurados
  if (filters.category) results = results.filter(e => e.c === filters.category[0]);
  if (filters.tier) results = results.filter(e => e.t === filters.tier);
  if (filters.group) results = results.filter(e => normalizeText(e.g||'').includes(normalizeText(filters.group)));
  if (filters.level && filters.level !== 'todos') results = results.filter(e => (e.lv||'').startsWith(filters.level[0]));

  if (!n) return results.sort((a,b) => (b.s||0) - (a.s||0));

  // Detectar si el query es un grupo muscular conocido (piernas, espalda, abductores, etc.)
  const mg = findMuscleGroup(n);

  // Buscar en todos los campos posibles y dar score combinado
  const scored = results.map(e => {
    const nameN = normalizeText(e.n);
    const enN = normalizeText(e.en||'');
    const groupN = normalizeText(e.g||'');
    const patternN = normalizeText(e.p||'');
    const eqN = normalizeText(e.eq||'');
    let score = 0;

    // Match por nombre (prioridad alta)
    if (nameN === n) score += 1000;
    else if (nameN.startsWith(n)) score += 500;
    else if (nameN.includes(n)) score += 200;
    if (enN.includes(n)) score += Math.max(score, 150) - score + 150;

    // Match por grupo / patrón / equipo
    if (groupN.includes(n)) score += 100;
    if (patternN.includes(n)) score += 60;
    if (eqN.includes(n)) score += 40;

    // Match contra los muscle IDs del CSV (cw) — por ejemplo "biceps_femoral", "gluteo_mayor"
    if (e.cw){
      for (const muscleId of Object.keys(e.cw)){
        const muscleNorm = normalizeText(muscleId.replace(/_/g, ' '));
        if (muscleNorm.includes(n) || n.includes(muscleNorm)){
          // Score proporcional al peso del músculo en ese ejercicio
          const weight = e.cw[muscleId] || 0;
          score += Math.max(score, weight); // tope al weight
          break;
        }
      }
    }

    // Match por grupo muscular detectado (piernas, abductores, etc.)
    if (mg && mg.svg.length && e.sv){
      const maxScore = Math.max(...mg.svg.map(s => e.sv[s] || 0));
      if (maxScore >= 40){
        score += maxScore;
      }
    }

    return { ex: e, score };
  }).filter(r => r.score > 0);

  scored.sort((a,b) => b.score - a.score || (b.ex.s||0) - (a.ex.s||0));
  return scored.map(r => r.ex);
}

// Similitud coseno entre dos ejercicios usando csv_weights
function cosineSimilarity(a, b){
  const wa = a.cw || {}, wb = b.cw || {};
  const keys = new Set([...Object.keys(wa), ...Object.keys(wb)]);
  let dot = 0, magA = 0, magB = 0;
  for (const k of keys){
    const va = wa[k] || 0, vb = wb[k] || 0;
    dot += va * vb;
    magA += va * va;
    magB += vb * vb;
  }
  if (!magA || !magB) return 0;
  return dot / (Math.sqrt(magA) * Math.sqrt(magB));
}

// Encuentra ejercicios similares a uno dado
function findSimilarExercises(ex, n = 5){
  if (!ex || !ex.cw) return [];
  const sims = EXERCISE_DB
    .filter(e => e.id !== ex.id)
    .map(e => ({ ex: e, sim: cosineSimilarity(ex, e) }))
    .filter(r => r.sim > 0.5)
    .sort((a,b) => b.sim - a.sim);
  return sims.slice(0, n).map(r => r.ex);
}

// Encuentra similares basado en músculos custom (para "quizás te interese" en ejercicios custom)
function findSimilarByMuscles(primary = [], secondary = [], n = 5){
  // Convert primary/secondary (SVG ids) into a pseudo csv_weights vector
  const target = {};
  primary.forEach(svg => target[svg] = 80);
  secondary.forEach(svg => target[svg] = 50);
  
  // Compare against each exercise's svg_weights
  const sims = EXERCISE_DB.map(e => {
    if (!e.sv) return { ex: e, sim: 0 };
    const keys = new Set([...Object.keys(target), ...Object.keys(e.sv)]);
    let dot = 0, mA = 0, mB = 0;
    for (const k of keys){
      const va = target[k] || 0, vb = e.sv[k] || 0;
      dot += va * vb; mA += va*va; mB += vb*vb;
    }
    return { ex: e, sim: (!mA||!mB) ? 0 : dot/(Math.sqrt(mA)*Math.sqrt(mB)) };
  }).filter(r => r.sim > 0.5).sort((a,b) => b.sim - a.sim);
  return sims.slice(0, n).map(r => r.ex);
}

// NO juzga el tier — eso ya está visible en el badge.
function buildExerciseTooltip(ex){
  if (!ex) return '';
  const isCardio = ex.c === 'c' || ex.m === 'time';
  const isMobility = ex.c === 'm';

  // Top músculos primarios
  const topMuscles = Object.entries(ex.sv || {})
    .filter(([k,v]) => v >= 60)
    .sort((a,b) => b[1]-a[1])
    .slice(0,3)
    .map(([k]) => (MUSCLES[k]?.label || k).toLowerCase());

  const parts = [];

  // Tipo de ejercicio (cardio / movilidad / fuerza)
  if (isCardio){
    parts.push('Movimiento de cardio / condicionamiento.');
    if (topMuscles.length) parts.push(`Trabaja ${topMuscles.join(', ')}.`);
    parts.push('Se registra por tiempo.');
  } else if (isMobility){
    parts.push('Ejercicio de movilidad / recuperación.');
    if (topMuscles.length) parts.push(`Enfocado en ${topMuscles.join(', ')}.`);
  } else {
    // Fuerza: describe el ejercicio neutralmente
    const tags = [];
    if (ex.co) tags.push('Compuesto');
    else tags.push('Aislado');
    if (ex.u) tags.push('unilateral');

    if (topMuscles.length){
      parts.push(`${tags.join(', ')} para ${topMuscles.join(', ')}.`);
    } else {
      parts.push(tags.join(', ') + '.');
    }

    // Nivel si no es "todos"
    if (ex.lv && ex.lv !== 'todos'){
      parts.push(`Nivel: ${ex.lv}.`);
    }

    // Equipo si está
    if (ex.eq){
      parts.push(`Equipo: ${ex.eq}.`);
    }
  }

  return parts.join(' ');
}

// Image helpers — Sesión 3 groundwork.
// Returnan URL si existe, null si no. Cuando llenes media en los ejercicios,
// aparecen automáticamente en las cards y vista detalle.
// ============================================================
// FREE EXERCISE DB IMAGE MATCHER (Sesión 3 — real images)
// ============================================================
// Conecta con yuhonas/free-exercise-db (dominio público, 800+ ejercicios con 2 imágenes c/u).
// Descarga JSON una sola vez, lo cachea en localStorage por 30 días, y matchea
// los ejercicios de tu CSV por nombre en inglés.

const FREE_EX_DB_URL = 'https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/dist/exercises.json';
const FREE_EX_IMG_BASE = 'https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/';
const FREE_EX_CACHE_KEY = 'free_exercise_db_v1';
const FREE_EX_CACHE_TTL = 30 * 24 * 60 * 60 * 1000; // 30 días

let _freeExIndex = null;   // Map<normalized_name, {id, images}>
let _freeExLoading = null; // Promise activa de carga

function normalizeExerciseName(s){
  return String(s||'').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, ' ')
    .trim();
}

function freeExImageUrl(imagePath){
  return imagePath ? FREE_EX_IMG_BASE + imagePath : null;
}

async function loadFreeExerciseDb(){
  if (_freeExIndex) return _freeExIndex;
  if (_freeExLoading) return _freeExLoading;

  _freeExLoading = (async () => {
    // Intentar leer de localStorage
    try {
      const cached = localStorage.getItem(FREE_EX_CACHE_KEY);
      if (cached){
        const { data, t } = JSON.parse(cached);
        if (Date.now() - t < FREE_EX_CACHE_TTL && Array.isArray(data)){
          buildFreeExIndex(data);
          return _freeExIndex;
        }
      }
    } catch(e){ /* ignorar */ }

    // Descargar
    try {
      const res = await fetch(FREE_EX_DB_URL);
      if (!res.ok) throw new Error('No se pudo descargar');
      const data = await res.json();
      try { localStorage.setItem(FREE_EX_CACHE_KEY, JSON.stringify({ data, t: Date.now() })); }
      catch(e){ /* localStorage lleno, ignorar cache */ }
      buildFreeExIndex(data);
      return _freeExIndex;
    } catch(e){
      console.warn('Free Exercise DB unavailable:', e);
      _freeExIndex = new Map();
      return _freeExIndex;
    }
  })();

  return _freeExLoading;
}

function buildFreeExIndex(data){
  _freeExIndex = new Map();
  for (const ex of data){
    if (!ex.name || !Array.isArray(ex.images) || !ex.images.length) continue;
    const key = normalizeExerciseName(ex.name);
    if (!_freeExIndex.has(key)){
      _freeExIndex.set(key, { id: ex.id, images: ex.images });
    }
  }
}

// Image overrides (admin-managed, stored in Firestore imageOverrides collection)
// Cached in memory, loaded once per session
let _imageOverrides = {};
let _imageOverridesLoading = null;
async function loadImageOverridesFromFirestore(){
  if (_imageOverridesLoading) return _imageOverridesLoading;
  _imageOverridesLoading = (async () => {
    try {
      if (typeof db === 'undefined' || !db) return {};
      const { collection, getDocs } = await import('https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js');
      const snap = await getDocs(collection(db, 'imageOverrides'));
      const obj = {};
      snap.forEach(d => obj[d.id] = d.data());
      _imageOverrides = obj;
      return obj;
    } catch(e){ console.warn('imageOverrides:', e); return {}; }
  })();
  return _imageOverridesLoading;
}
function getImageOverride(exerciseId){
  return _imageOverrides[exerciseId] || null;
}

// Busca una imagen para un ejercicio dado su nombre EN (o ES como fallback).
// Prioriza overrides de admin (Firestore), luego auto-match en Free Exercise DB.
function findFreeExImages(nameEn, nameEs, exerciseId){
  // 1. Override de admin (Firestore)
  if (exerciseId){
    const ov = getImageOverride(exerciseId);
    if (ov && ov.image_url){
      return {
        thumbnail_url: ov.image_url,
        main_url: ov.image_url,
        animation_url: null
      };
    }
  }
  // 2. Auto-match en Free Exercise DB
  if (!_freeExIndex) return null;
  const tryKeys = [];
  if (nameEn) tryKeys.push(normalizeExerciseName(nameEn));
  if (nameEs) tryKeys.push(normalizeExerciseName(nameEs));
  for (const key of tryKeys){
    if (_freeExIndex.has(key)){
      const m = _freeExIndex.get(key);
      return {
        thumbnail_url: freeExImageUrl(m.images[0]),
        main_url: freeExImageUrl(m.images[0]),
        animation_url: m.images.length > 1 ? freeExImageUrl(m.images[1]) : null
      };
    }
  }
  return null;
}

// Carga la DB al iniciar la app (en background, no bloquea)
function initFreeExerciseDb(){
  // En paralelo: free-db + admin overrides
  Promise.all([loadFreeExerciseDb(), loadImageOverridesFromFirestore()]).then(() => {
    // Después de cargar, re-render si la vista actual muestra ejercicios
    const exerciseViews = ['exerciseDetail','exerciseExplorer','day','exercise','home'];
    if (exerciseViews.includes(state.view)){
      try { render(); } catch(e){}
    }
  });
}

// Stats de cobertura — útil para ver qué ejercicios tienen imagen y cuáles no
function getImageCoverageStats(){
  if (!_freeExIndex) return null;
  const total = EXERCISE_DB.length;
  let matched = 0;
  const matchedList = [];
  const unmatchedList = [];
  for (const ex of EXERCISE_DB){
    const m = findFreeExImages(ex.en, ex.n, ex.id);
    if (m){
      matched++;
      matchedList.push({ id: ex.id, name: ex.n, en: ex.en });
    } else {
      unmatchedList.push({ id: ex.id, name: ex.n, en: ex.en, group: ex.g, category: ex.c });
    }
  }
  return { total, matched, unmatched: total - matched, pct: Math.round((matched/total)*100), matchedList, unmatchedList };
}

// Exponer globalmente para usar desde la consola
if (typeof window !== 'undefined'){
  window.showImageStats = async function(){
    if (!_freeExIndex) await loadFreeExerciseDb();
    const s = getImageCoverageStats();
    console.log(`%c📷 Image Coverage Stats`, 'font-size:14px;font-weight:bold;color:#3b9eff;');
    console.log(`Total ejercicios: ${s.total}`);
    console.log(`Con imagen: ${s.matched} (${s.pct}%)`);
    console.log(`Sin imagen: ${s.unmatched}`);
    console.log(`%cEjercicios SIN imagen:`, 'font-weight:bold;color:#f87171;');
    console.table(s.unmatched > 50 ? s.unmatchedList.slice(0, 50).concat([{name: `... y ${s.unmatched-50} más`}]) : s.unmatchedList);
    console.log(`%cEjercicios CON imagen (muestra):`, 'font-weight:bold;color:#22d3a3;');
    console.table(s.matchedList.slice(0, 20));
    return s;
  };
  window.refreshImageDb = async function(){
    try { localStorage.removeItem(FREE_EX_CACHE_KEY); } catch(e){}
    _freeExIndex = null;
    _freeExLoading = null;
    console.log('🔄 Re-descargando Free Exercise DB...');
    await loadFreeExerciseDb();
    console.log('✅ Done. Coverage:', getImageCoverageStats().pct + '%');
  };
}

// ============================================================
// IMAGE HOOKS — Sesión 3 groundwork (sin assets aún)
// ============================================================
// Cuando quieras agregar imágenes a los ejercicios, hay 3 opciones:
//
// 1. URLs en línea (más simple, sin código nuevo):
//    Editar manualmente exercise.media.thumbnail_url = 'https://...'
//    en Firestore o en el editor del ejercicio.
//
// 2. Mapping centralizado por exercise_id:
//    Crear un objeto EXERCISE_IMAGES = { 'ex_001': { thumbnail_url: '...' } }
//    y hacer que dbToAppExercise lea de ahí. Bueno para llenar muchos a la vez.
//
// 3. Firebase Storage / GitHub repo / Cloudinary / Imgur:
//    Subir las imágenes a un host gratis y poner las URLs en el campo media.
//    Recomendado: Firebase Storage (ya tienes Firebase configurado).
//
// Helpers disponibles:
// - exerciseThumbnailUrl(ex) → URL o null
// - exerciseMainImageUrl(ex) → URL o null
// - exerciseAnimationUrl(ex) → URL o null
// - exerciseVisual(ex, size, fallbackIcon, color) → HTML con imagen o icono fallback
//
// Schema:
// exercise.media = {
//   thumbnail_url: '...',   // chica, para listas/cards
//   main_url: '...',        // grande, para detalle
//   animation_url: '...',   // GIF/video corto
//   start_position_url: '...',
//   end_position_url: '...'
// }
// ============================================================

function exerciseThumbnailUrl(ex){
  if (!ex) return null;
  // 1. URL explícita en media (si la pusiste manualmente)
  if (ex.media?.thumbnail_url) return ex.media.thumbnail_url;
  if (ex.media?.main_url) return ex.media.main_url;
  // 2. Fallback: buscar en Free Exercise DB por nombre EN
  const enName = ex._dbId ? EXERCISE_DB.find(e => e.id === ex._dbId)?.en : (ex._en || null);
  const esName = ex.name || ex.n || null;
  const m = findFreeExImages(enName, esName, ex?._dbId || ex?.id);
  return m?.thumbnail_url || null;
}
function exerciseMainImageUrl(ex){
  if (!ex) return null;
  if (ex.media?.main_url) return ex.media.main_url;
  if (ex.media?.thumbnail_url) return ex.media.thumbnail_url;
  const enName = ex._dbId ? EXERCISE_DB.find(e => e.id === ex._dbId)?.en : (ex._en || null);
  const esName = ex.name || ex.n || null;
  const m = findFreeExImages(enName, esName, ex?._dbId || ex?.id);
  return m?.main_url || null;
}
function exerciseAnimationUrl(ex){
  if (ex?.media?.animation_url) return ex.media.animation_url;
  const enName = ex._dbId ? EXERCISE_DB.find(e => e.id === ex._dbId)?.en : (ex?._en || null);
  const esName = ex?.name || ex?.n || null;
  const m = findFreeExImages(enName, esName, ex?._dbId || ex?.id);
  return m?.animation_url || null;
}
// Render thumbnail or fallback icon (for use in exercise cards / lists)
function exerciseVisual(ex, size = 38, fallbackIcon = 'ti-barbell', accentColor = 'var(--accent)'){
  const url = exerciseThumbnailUrl(ex);
  if (url){
    return `<div style="width:${size}px;height:${size}px;border-radius:10px;background:var(--bg-elev-2);overflow:hidden;flex-shrink:0;">
      <img src="${esc(url)}" alt="${esc(ex.name||'')}" loading="lazy" style="width:100%;height:100%;object-fit:cover;" onerror="this.parentElement.innerHTML='<i class=&quot;ti ${fallbackIcon}&quot; style=&quot;font-size:${Math.round(size*0.55)}px;color:${accentColor};display:flex;align-items:center;justify-content:center;width:100%;height:100%;&quot;></i>'" />
    </div>`;
  }
  return `<div style="display:flex;align-items:center;justify-content:center;width:${size}px;height:${size}px;border-radius:10px;background:var(--bg-elev-2);flex-shrink:0;">
    <i class="ti ${fallbackIcon}" style="font-size:${Math.round(size*0.55)}px;color:${accentColor};"></i>
  </div>`;
}

// Convertir un ejercicio del DB al formato del editor de la app
function dbToAppExercise(dbEx){
  const primary = Object.entries(dbEx.sv||{}).filter(([k,v]) => v >= 70).sort((a,b) => b[1]-a[1]).map(([k]) => k);
  const secondary = Object.entries(dbEx.sv||{}).filter(([k,v]) => v >= 40 && v < 70).sort((a,b) => b[1]-a[1]).map(([k]) => k);
  return {
    name: dbEx.n,
    video: (dbEx.n || dbEx.en).toLowerCase() + ' tecnica',
    measurement: dbEx.m || 'weight_reps',
    primary,
    secondary,
    alts: [],
    // Image hooks — schema preparado para futuro. Cuando se llenen URLs, aparecen solas.
    media: {
      thumbnail_url: null,  // imagen pequeña para listas y cards
      main_url: null,       // imagen principal del ejercicio
      animation_url: null,  // GIF / video corto demostrativo
      start_position_url: null,
      end_position_url: null,
    },
    // Metadata extra
    _dbId: dbEx.id,
    _tier: dbEx.t,
    _score: dbEx.s,
    _measurement: dbEx.m,
    _group: dbEx.g,
    _notes: dbEx.no || '',
    _svgWeights: dbEx.sv || {}
  };
}

async function recoverAccountGroupsFromProfiles(account = state.account){
  if (!account || !account.linkedProfiles) return account ? (account.groups || []) : [];
  const profileIds = Array.from(new Set(Object.values(account.linkedProfiles).filter(Boolean)));
  const recovered = new Set(account.groups || []);
  for (const profileId of profileIds){
    try {
      const groups = await loadMembershipGroups(profileId);
      groups.forEach(g => recovered.add(g));
    } catch(e){ console.error(e); }
  }
  const groups = Array.from(recovered).filter(Boolean);
  if (groups.length !== (account.groups || []).length || groups.some(g => !(account.groups || []).includes(g))){
    await saveAccount({ groups });
  }
  return groups;
}

async function filterUsersForGroup(groupId, users, cfg = null, keepIds = []){
  const clean = Array.isArray(users) ? users : [];
  if (groupId === DEFAULT_GROUP) return clean;
  const keep = new Set((keepIds || []).filter(Boolean));
  const admins = new Set(((cfg || state.groupConfig || {}).adminIds || []).filter(Boolean));
  const linkedCurrent = linkedProfileForGroup(groupId);
  if (linkedCurrent) keep.add(linkedCurrent);
  const out = [];
  for (const user of clean){
    if (!user || !user.id) continue;
    if (keep.has(user.id) || admins.has(user.id) || user.joinedAt){
      out.push(user);
      continue;
    }
    if (user.authOwnerUid){
      try {
        const groups = await loadMembershipGroups(user.id);
        if (groups.includes(groupId)) out.push(user);
      } catch(e){ console.error(e); }
    }
  }
  return out;
}

// Cuando todos los users estén migrados, se quita la escritura vieja.
async function savePersonalLibrary(userId, routines){
  if (!userId) return;
  if (!firebaseReady){
    localStorage.setItem(groupLocalKey('personalLibrary:'+userId), JSON.stringify(routines));
    return;
  }
  state.syncing = true;
  try {
    // Escritura dual: vieja + nueva
    await Promise.all([
      setDoc(doc(db,'salas',groupPath(),'personalLibraries',userId), { routines }),
      setDoc(doc(db,'users',userId,'personalLibrary','data'), { routines, updatedAt: Date.now() })
    ]);
  } catch(e){ console.error(e); toast('Error al guardar biblioteca'); }
  state.syncing = false;
}
async function migrateSharedRoutineToLibrary(){
  // Si la biblioteca ya tiene plantillas, no hacemos nada (idempotente)
  if (state.library && Object.keys(state.library).length > 0) return false;
  if (!state.sharedRoutine) return false;
  const lib = {};
  for (const dayKey of Object.keys(state.sharedRoutine)){
    const day = state.sharedRoutine[dayKey];
    if (!day || !day.exercises || !day.exercises.length) continue;
    const r = libRoutineFromDay(dayKey, day);
    lib[r.id] = r;
    // Guardamos cada plantilla en Firestore por separado
    await saveLibraryRoutine(r);
  }
  state.library = lib;
  console.log('[migration] Created library from sharedRoutine:', Object.keys(lib).length, 'routines');
  return true;
}

    if (!a || !a.userId || !a.ts || (a.groupId && a.groupId !== groupPath())) return false;

  state.joinedGroups = Array.from(new Set([...(memberships || []), ...(accountGroups || []), ...(recoveredGroups || []), groupPath()]));

async function handleAuthState(user){
  state.authReady = true;

  state.account = user ? await loadAccount(user) : null;
  if (state.account?.homeTourSeen) localStorage.setItem(LS_TOUR, '1');
  else if (state.account && localStorage.getItem(LS_TOUR)) await saveAccount({ homeTourSeen: true });
  if (state.account) await recoverAccountGroupsFromProfiles();
  if (state.account && state.account.groups && state.account.groups.length){
    state.joinedGroups = Array.from(new Set(state.account.groups));
    saveJoinedGroups(state.joinedGroups);
    if (!state.joinedGroups.includes(state.currentGroup)){
      state.currentGroup = state.joinedGroups[0] || DEFAULT_GROUP;
      saveCurrentGroup(state.currentGroup);
    }
  }
  if (!user){

    state.view = 'setup';

  }
  await reloadGroup();

async function readGroupState(groupId = groupPath()){
  const gid = groupId || DEFAULT_GROUP;
  const [cfg, rawUsers, sharedRoutine, personalRoutines, logs, library] = await Promise.all([
    loadConfig(gid),
    loadUsers(gid),
    loadSharedRoutine(gid),
    loadAllPersonalRoutines(gid),
    loadAllLogs(gid),
    loadSharedLibrary(gid)
  ]);
  const users = await filterUsersForGroup(gid, rawUsers, cfg, [loadMe(gid)]);
  if (gid !== DEFAULT_GROUP && JSON.stringify(rawUsers) !== JSON.stringify(users)){
    await saveUsersForGroup(gid, users);
  }
  return {
    groupConfig: cfg,
    invitationPassword: cfg.invitationPassword || INVITATION_PASSWORD_DEFAULT,
    users,
    sharedRoutine: sharedRoutine || {},
    personalRoutines,
    logs,
    library,
    routineSource: loadRoutineSource(gid)
  };
}
async function loadGroupState(groupId = groupPath()){
  // Defensive reset to prevent any cross-group contamination
  state.personalLibrary = {};
  const data = await readGroupState(groupId);
  state.groupConfig = data.groupConfig;
  state.invitationPassword = data.invitationPassword;
  state.users = data.users;
  state.sharedRoutine = data.sharedRoutine;
  state.personalRoutines = data.personalRoutines;
  state.logs = data.logs;
  state.library = data.library || {};
  state.routineSource = data.routineSource;
  // Auto-migración no destructiva: si no hay biblioteca, la creamos desde sharedRoutine
  if (Object.keys(state.library).length === 0 && state.sharedRoutine){
    await migrateSharedRoutineToLibrary();
  }
}

    state.view = 'setup';
    state.enteringGroup = false;
  } else if (state.authUser){
    state.currentUser = null; state.setupStep = 'groupHub'; state.view = 'setup';
  } else if (meId && state.users.find(u=>u.id===meId) && authValid()){
    state.currentUser = meId; state.view = 'home'; state.setupStep = null;
  } else if (state.users.length === 0){

async function reloadGroup(options = {}){

    const recoveredGroups = await recoverAccountGroupsFromProfiles();

    state.joinedGroups = groups.length ? groups : state.joinedGroups;
    saveJoinedGroups(state.joinedGroups);
  }
  chooseInitialViewForGroup();
  if (state.currentUser){
    try { state.personalLibrary = await loadPersonalLibrary(state.currentUser); }
    catch(e){ console.error(e); state.personalLibrary = {}; }

async function switchGroup(groupId){
  if (!groupId) return;
  if (groupId === state.currentGroup){
    // Si ya estamos en este grupo, simplemente regresar al home limpiamente.
    state.enteringGroup = false;
    state.switchingGroup = false;
    state.setupStep = null;
    state.view = 'home';
    render();
    return;
  }
  const token = ++state.groupSwitchToken;
  state.suppressRealtimeRender = true;
  try {
    const data = await readGroupState(groupId);
    if (token !== state.groupSwitchToken) return;
    unsubs.forEach(u => u && u());
    unsubs = [];

    // ====== FIX: limpiar completamente el estado del grupo anterior ======
    // Esto evita que rutinas, logs o biblioteca del grupo viejo "contaminen" el nuevo.
    state.currentUser = null;
    state.personalLibrary = {};
    state.library = {};
    state.personalRoutines = {};
    state.sharedRoutine = null;
    state.logs = {};
    state.users = [];
    state.routineSource = {};
    state.groupConfig = {};

    state.currentGroup = groupId;
    saveCurrentGroup(groupId);
    rememberGroup(groupId);
    state.currentDay = null;
    state.currentExerciseIdx = null;
    state.editingSession = null;
    state.editingLibraryRoutineId = null;
    state.showAlts = false;
    state.showMuscles = false;
    state.showRoutineMuscles = false;
    state.showGlobalRoutineMuscles = false;

    // Asignar los datos del nuevo grupo
    state.groupConfig = data.groupConfig;
    state.invitationPassword = data.invitationPassword;
    state.users = data.users;
    state.sharedRoutine = data.sharedRoutine;
    state.personalRoutines = data.personalRoutines;
    state.logs = data.logs;
    state.library = data.library || {};
    state.routineSource = data.routineSource;
    // Migración si la biblioteca está vacía
    if (Object.keys(state.library).length === 0 && state.sharedRoutine){
      try { await migrateSharedRoutineToLibrary(); } catch(e){ console.error(e); }
    }
    if (state.account){
      const recoveredGroups = await recoverAccountGroupsFromProfiles();
      const groups = Array.from(new Set([...(state.account.groups || []), ...(recoveredGroups || [])]));
      state.joinedGroups = groups.length ? groups : state.joinedGroups;
      saveJoinedGroups(state.joinedGroups);
    }
    // chooseInitialViewForGroup() asigna state.currentUser para el nuevo grupo
    chooseInitialViewForGroup();
    // AHORA sí cargar la biblioteca personal del usuario correcto del nuevo grupo
    if (state.currentUser){
      try { state.personalLibrary = await loadPersonalLibrary(state.currentUser, groupId); }
      catch(e){ console.error(e); state.personalLibrary = {}; }
    } else {
      state.personalLibrary = {};
    }
    subscribeRealtime();
  } catch(e){
    console.error(e);
    toast('No pude cambiar de grupo. Intenta de nuevo.');
  } finally {
    if (token === state.groupSwitchToken){
      // Keep suppressing realtime renders briefly so the initial snapshot callbacks
      // (which fire immediately after onSnapshot) don't trigger extra re-renders.
      state.realtimeQuietUntil = Date.now() + 1200;
      state.switchingGroup = false;
      render();
      // Release the hard suppression after the initial snapshots settle
      setTimeout(() => {
        if (token === state.groupSwitchToken) state.suppressRealtimeRender = false;
      }, 800);
    }
  }
}
async function createGroup(groupId, groupName, invitationPassword, routineMode){

    invitationPassword,

    adminIds: [me.id],
    createdAt: Date.now()
  };

  if (routineMode === 'blank') routine = blankRoutine();
  if (routineMode === 'copy-current') routine = JSON.parse(JSON.stringify(state.sharedRoutine || DEFAULT_ROUTINE));
  const newGroupUsers = [{ ...me }];

  }

  state.users = newGroupUsers;

  state.groupConfig = config;
  state.invitationPassword = invitationPassword;
  state.routineSource = 'shared';

  state.currentUser = me.id;

async function joinGroup(groupId, password){

  let cfg = null;

  } else {

    if (!targetUsers.some(u => u.id === currentMe.id)){

    const groups = Array.from(new Set([...(state.account?.groups || []), safeId]));
    await saveAccount({ groups });
    state.joinedGroups = groups;
    saveJoinedGroups(groups);

  if (currentMe) {
    try { await afterLogin(currentMe.id); }

async function deleteCurrentGroup(){
  if (groupPath() === DEFAULT_GROUP){ toast('El grupo original está protegido'); return; }
  if (!isAdmin()){ toast('Solo admin'); return; }
  const gid = groupPath();
  if (!firebaseReady){
    localStorage.removeItem(groupLocalKey('config', gid));
    localStorage.removeItem(groupLocalKey('users', gid));
    localStorage.removeItem(groupLocalKey('sharedRoutine', gid));
  } else {
    for (const col of ['logs','personalRoutines']){
      const snap = await getDocs(collection(db,'salas',gid,col));
      for (const d of snap.docs) await deleteDoc(d.ref);

  });

  if (set.unilateral){
    return Math.max(Number(set.left?.weight)||0, Number(set.right?.weight)||0, dropMax);
  }
  return Math.max(Number(set.weight)||0, dropMax);
}

  if (!set) return 0;

function setBaseVolume(set, measurement = 'weight_reps'){
  if (!set) return 0;

    if (measurement === 'reps_only'){
      return (Number(set.left?.reps)||0) + (Number(set.right?.reps)||0);
    }
    return (Number(set.left?.reps)||0) * (Number(set.left?.weight)||0) +
      (Number(set.right?.reps)||0) * (Number(set.right?.weight)||0);
  }
  if (measurement === 'reps_only') return Number(set.reps)||0;

}

      byExercise[ek].sets += setCount;
      byExercise[ek].volume += volume;
      byExercise[ek].maxWeight = Math.max(byExercise[ek].maxWeight, best ? setMaxWeight(best) : 0);
      sessions.push({ ek, name: exerciseNameForKey(ek), date: entry.date, sets: setCount, volume, maxWeight: best ? setMaxWeight(best) : 0 });
    });
  }
  sessions.sort((a,b) => String(b.date).localeCompare(String(a.date)));
  const topExercises = Object.values(byExercise).sort((a,b) => b.sessions - a.sessions || b.volume - a.volume).slice(0,5);
  return { sessions, topExercises, totalSessions: sessions.length, totalSets, totalVolume: totalVolumeNum, maxWeight, lastDate: sessions[0]?.date || null };
}
const latestEntry = (uid, ek) => {
  const a = getEntries(uid, ek);
  return a.length ? a.slice().sort((x,y)=>x.date.localeCompare(y.date)).pop() : null;
};
function bucketEntries(entries, mode){
  const b = {};
  for (const e of entries){
    let key;
    if (mode==='week'){
      const d = parseDateKey(e.date); const day = (d.getDay()+6)%7;
      d.setDate(d.getDate()-day); key = dateKey(d);
    } else if (mode==='month'){ key = e.date.slice(0,7); }
    else { key = e.date.slice(0,4); }
    if (!b[key]) b[key] = { key, maxWeight:0, totalVolume:0, sessions:0 };
    const best = bestSet(e);
    if (best && setMaxWeight(best) > b[key].maxWeight) b[key].maxWeight = setMaxWeight(best);
    b[key].totalVolume += totalVolume(e);
    b[key].sessions += 1;
  }
  return Object.values(b).sort((x,y)=>x.key.localeCompare(y.key));
}

function routineMuscleStats(routine){
  const scores = {};
  let total = 0;
  const useGradient = state.muscleGradientMap;
  (routine?.exercises || []).forEach(ex => {
    // Try to find the DB exercise to get full svg_weights
    const dbEx = ex._dbId ? EXERCISE_DB.find(e => e.id === ex._dbId) : null;
    const sv = ex._svgWeights || (dbEx ? dbEx.sv : null);
    if (useGradient && sv && Object.keys(sv).length){
      // Use real scores: each muscle's contribution = score/100
      for (const [id, score] of Object.entries(sv)){
        if (!MUSCLES[id] || score < 20) continue;
        const contribution = score / 100;
        scores[id] = (scores[id] || 0) + contribution;
        total += contribution;
      }
    } else {
      // Fallback: binary primary/secondary (old system)
      (ex.primary || []).forEach(id => {
        if (!MUSCLES[id]) return;
        scores[id] = (scores[id] || 0) + 1;
        total += 1;
      });
      (ex.secondary || []).forEach(id => {
        if (!MUSCLES[id]) return;
        scores[id] = (scores[id] || 0) + 0.5;
        total += 0.5;
      });
    }
  });
  const max = Math.max(0, ...Object.values(scores));
  const rows = Object.entries(scores)
    .map(([id, score]) => ({
      id,
      label: MUSCLES[id].label,
      score,
      percent: total ? Math.round((score / total) * 100) : 0,
      intensity: max ? score / max : 0
    }))
    .sort((a,b) => b.score - a.score || a.label.localeCompare(b.label));
  const map = {};
  rows.forEach(row => { map[row.id] = row; });
  return { rows, map, total };
}

function fullRoutineMuscleStats(){
  const merged = { exercises: [] };
  getAllDayKeys().forEach(dayKey => {
    const dayRoutine = getRoutineForDay(dayKey);
    if (dayRoutine && Array.isArray(dayRoutine.exercises)){
      merged.exercises.push(...dayRoutine.exercises);
    }
  });
  return routineMuscleStats(merged);
}

function muscleHeatColor(intensity){
  const t = Math.max(0, Math.min(1, Number(intensity) || 0));
  if (!t) return 'var(--bg-elev-2)';
  if (t >= 0.72) return '#f97316';
  if (t >= 0.45) return '#3b9eff';
  if (t >= 0.22) return '#72c8ff';
  return '#b8e4ff';
}

function isLibraryRoutineKey(key){
  return !!((state.library && state.library[key]) || (state.personalLibrary && state.personalLibrary[key]));

function libraryRoutineAsDay(routine){
  if (!routine) return null;
  return {
    label: routine.name || routine.label || 'Rutina',
    focus: routine.focus || '',
    icon: routine.icon || 'ti-barbell',
    exercises: Array.isArray(routine.exercises) ? routine.exercises : [],
    libraryId: routine.id,
    scope: routine.scope || 'shared'
  };
}
function getDayLabel(dayKey){
  if (!dayKey) return '';
  const r = getRoutineForDay(dayKey);
  if (r && r.label) return r.label;
  return dayKey.charAt(0).toUpperCase() + dayKey.slice(1);
}
function getRoutineForDay(dayKey){
  if (state.personalLibrary && state.personalLibrary[dayKey]) return libraryRoutineAsDay(state.personalLibrary[dayKey]);
  if (state.library && state.library[dayKey]) return libraryRoutineAsDay(state.library[dayKey]);
  const src = state.routineSource[dayKey] || 'shared';
  if (src === 'personal'){
    const pr = state.personalRoutines[state.currentUser];
    if (pr && pr[dayKey]) return pr[dayKey];
  }
  return (state.sharedRoutine && state.sharedRoutine[dayKey]) || null;
}
function getCurrentSource(dayKey){
  if (state.personalLibrary && state.personalLibrary[dayKey]) return 'personalLibrary';
  if (state.library && state.library[dayKey]) return 'library';
  return state.routineSource[dayKey] || 'shared';
}
function setCurrentSource(dayKey, src){
  state.routineSource[dayKey] = src;
  saveRoutineSource(state.routineSource);
}
function getAllDayKeys(){
  const all = new Set(DAY_ORDER);
  if (state.sharedRoutine) Object.keys(state.sharedRoutine).forEach(k => all.add(k));
  const pr = state.personalRoutines[state.currentUser];
  if (pr) Object.keys(pr).forEach(k => all.add(k));
  const libraryKeys = [
    ...Object.values(state.library || {}),
    ...Object.values(state.personalLibrary || {})
  ]
    .filter(r => r && r.id && !r.originDay)
    .sort((a,b) => (a.createdAt || 0) - (b.createdAt || 0) || (a.name || '').localeCompare(b.name || ''))
    .map(r => r.id);
  const ordered = DAY_ORDER.filter(k => all.has(k));
  const extras = [...all].filter(k => !DAY_ORDER.includes(k));
  return [...ordered, ...extras, ...libraryKeys.filter(k => !all.has(k))];
}

// Sesión 2: Build intensity map from an exercise's svg_weights (or estimate from primary/secondary)
function exerciseIntensityMap(ex){
  if (!state.muscleGradientMap) return null;
  // If exercise has _svgWeights (from DB), use them directly
  const sv = ex._svgWeights || (ex._dbId ? (EXERCISE_DB.find(e => e.id === ex._dbId)?.sv || {}) : null);
  if (sv && Object.keys(sv).length){
    const map = {};
    for (const [id, score] of Object.entries(sv)){
      if (score >= 20) map[id] = { intensity: score / 100, percent: score };
    }
    return map;
  }
  // Fallback: estimate from primary/secondary (binary → fake gradient)
  const map = {};
  (ex.primary || []).forEach(id => map[id] = { intensity: 0.85, percent: 85 });
  (ex.secondary || []).forEach(id => { if (!map[id]) map[id] = { intensity: 0.5, percent: 50 }; });
  return Object.keys(map).length ? map : null;
}

function openModal(html, onAttach){
  modalRoot.innerHTML = `<div class="modal-backdrop" id="mb">

  </div>`;
  document.getElementById('mb').addEventListener('click', (e) => { if (e.target.id === 'mb') closeModal(); });

}

function openSimilarSuggestions(savedEx, similars){
  const cards = similars.map(ex => {
    const tinfo = TIER_INFO[ex.t] || TIER_INFO.B;
    const muscles = Object.entries(ex.sv||{}).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([k])=>MUSCLES[k]?.label||k).join(' · ');
    return `<button data-ssm-id="${esc(ex.id)}" style="width:100%;text-align:left;padding:11px;margin-bottom:6px;background:var(--bg-elev-2);border:1px solid var(--border);border-radius:10px;display:flex;align-items:center;gap:10px;">
      <div style="width:32px;height:32px;border-radius:8px;background:${tinfo.color}22;color:${tinfo.color};display:flex;align-items:center;justify-content:center;font-weight:700;font-family:var(--font-mono);font-size:12px;flex-shrink:0;">${ex.t}</div>
      <div style="min-width:0;flex:1;">
        <div style="font-weight:500;font-size:13px;">${esc(ex.n)}</div>
        <div class="muted" style="font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px;">${esc(muscles || ex.g || '')}</div>
      </div>
      <div class="mono" style="font-size:11px;color:var(--text-dim);">${ex.s||'—'}</div>

  }).join('');

  modalRoot.innerHTML = `<div class="modal-backdrop" id="ssmb">

      </div>
      ${cards}
      <button id="ssmDone" style="width:100%;padding:11px;margin-top:8px;">Listo</button>
    </div>
  </div>`;

    b.addEventListener('click', () => {
      state.exSelectedId = b.dataset.ssmId;
      closeModal();
      state.view = 'exerciseDetail';
      render();

function openSearchModal(opts = {}){
  const fromDay = opts.fromDay || null;
  const returnView = state.view;
  const returnDay = state.currentDay;
  let query = state.homeExQuery || '';
  let cat = '', tier = '', level = '', group = '';
  let showFilters = false;

  function getResults(){
    return searchExercises(query, { category: cat, tier, level, group });
  }
  function resultsHtml(){
    const all = getResults();
    const shown = all.slice(0, 3);
    const more = all.length - shown.length;
    const cards = shown.length ? shown.map(ex => {
      const tinfo = TIER_INFO[ex.t] || TIER_INFO.B;
      const muscles = Object.entries(ex.sv||{}).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([k])=>MUSCLES[k]?.label||k).join(' · ');
      return `<button data-sm-open="${esc(ex.id)}" style="width:100%;text-align:left;padding:10px;margin-bottom:5px;background:var(--bg-elev-2);border:1px solid var(--border);border-radius:10px;display:flex;align-items:center;gap:10px;">
        <div style="width:30px;height:30px;border-radius:8px;background:${tinfo.color}22;color:${tinfo.color};display:flex;align-items:center;justify-content:center;font-weight:700;font-family:var(--font-mono);font-size:11px;flex-shrink:0;">${ex.t}</div>
        <div style="min-width:0;flex:1;">
          <div style="font-weight:500;font-size:13px;">${esc(ex.n)}</div>
          <div class="muted" style="font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px;">${esc(muscles || ex.g || '')}</div>
        </div>
        <div class="mono" style="font-size:11px;color:var(--text-dim);">${ex.s||'—'}</div>
      </button>`;
    }).join('') : `<div class="muted" style="text-align:center;padding:24px;font-size:13px;">${query.trim() ? 'Sin resultados.' : 'Empezá a escribir...'}</div>`;
    const seeMore = more > 0 ? `<button id="smSeeMore" style="width:100%;padding:11px;margin-top:6px;background:transparent;border:1px dashed var(--border);color:var(--accent);font-weight:500;font-size:13px;">Ver todos los ${all.length} resultados →</button>` : '';
    return { html: cards + seeMore, totalCount: all.length };
  }
  function attachResultHandlers(){
    document.querySelectorAll('#smResults [data-sm-open]').forEach(b => {
      b.addEventListener('click', () => {
        state.exSelectedId = b.dataset.smOpen;
        if (fromDay) state.exAddToDay = fromDay;
        state.exReturnView = returnView;
        state.exReturnDay = returnDay;
        closeModal();
        state.view = 'exerciseDetail';
        render();
      });
    });
    const sm = document.getElementById('smSeeMore');
    if (sm) sm.addEventListener('click', () => {
      state.exQuery = query;
      state.exFilters = { category: cat, tier, group, level };
      state.exReturnView = returnView;
      state.exReturnDay = returnDay;
      closeModal();
      state.view = 'exerciseExplorer';
      render();
    });
  }
  function updateResultsOnly(){
    const r = resultsHtml();
    const el = document.getElementById('smResults');
    if (el) el.innerHTML = r.html;
    const counter = document.getElementById('smCounter');
    if (counter) counter.textContent = `${r.totalCount} de ${EXERCISE_DB.length}`;
    attachResultHandlers();
  }
  function build(){
    const r = resultsHtml();
    const tierPills = ['','S','A','B','C'].map(t => `<button data-ft="${t}" class="small ${tier===t?'primary':''}" style="font-size:11px;padding:4px 10px;">${t?'Tier '+t:'Cualquier tier'}</button>`).join('');
    const catPills = [['','Todo'],['fuerza','Fuerza'],['cardio','Cardio'],['movilidad','Movilidad']].map(([v,l]) => `<button data-fc="${v}" class="small ${cat===v?'primary':''}" style="font-size:11px;padding:4px 10px;">${l}</button>`).join('');
    const levelPills = [['','Todos'],['principiante','Principiante'],['intermedio','Intermedio'],['avanzado','Avanzado']].map(([v,l]) => `<button data-fl="${v}" class="small ${level===v?'primary':''}" style="font-size:11px;padding:4px 10px;">${l}</button>`).join('');
    const groupOptions = [['','Todos los grupos'],['pecho','Pecho'],['espalda','Espalda'],['hombros','Hombros'],['cuádriceps/glúteos','Cuádriceps/Glúteos'],['femorales/isquiosurales','Femorales'],['glúteos','Glúteos'],['bíceps/brazo','Bíceps'],['tríceps/brazo','Tríceps'],['core','Core'],['pantorrillas/aductores/antebrazo','Pantorrillas / aductores'],['cardio','Cardio'],['movilidad/recuperación','Movilidad']];
    const filtersBlock = showFilters ? `<div style="border-top:1px solid var(--border);padding-top:12px;margin-bottom:10px;">
      <div class="section-label" style="margin-bottom:6px;">Categoría</div>
      <div class="row" style="gap:6px;flex-wrap:wrap;margin-bottom:10px;">${catPills}</div>
      <div class="section-label" style="margin-bottom:6px;">Tier</div>
      <div class="row" style="gap:6px;flex-wrap:wrap;margin-bottom:10px;">${tierPills}</div>
      <div class="section-label" style="margin-bottom:6px;">Nivel</div>
      <div class="row" style="gap:6px;flex-wrap:wrap;margin-bottom:10px;">${levelPills}</div>
      <div class="section-label" style="margin-bottom:6px;">Grupo muscular</div>
      <select id="smGroup" style="width:100%;margin-bottom:6px;">
        ${groupOptions.map(([v,l]) => `<option value="${esc(v)}" ${group===v?'selected':''}>${esc(l)}</option>`).join('')}
      </select>
    </div>` : '';

    modalRoot.innerHTML = `<div class="modal-backdrop" id="smb">
      <div class="modal" onclick="event.stopPropagation()" style="max-width:560px;max-height:90vh;display:flex;flex-direction:column;">
        <div class="row" style="gap:8px;margin-bottom:10px;">
          <h2 style="flex:1;">Buscar ejercicios</h2>
          <button id="smClose" aria-label="Cerrar" style="padding:6px 10px;font-size:18px;line-height:1;background:transparent;border:none;">×</button>
        </div>
        ${fromDay ? `<div class="banner banner-info" style="margin-bottom:10px;padding:8px 10px;font-size:12px;"><i class="ti ti-info-circle"></i><div>Click en un ejercicio para agregarlo al día <strong>${esc(getDayLabel(fromDay))}</strong>.</div></div>` : ''}
        <div style="position:relative;margin-bottom:8px;">
          <i class="ti ti-search" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-dim);font-size:15px;pointer-events:none;"></i>
          <input id="smInput" type="text" placeholder="Nombre, músculo, grupo..." value="${esc(query)}" style="width:100%;padding:11px 12px 11px 36px;" />
        </div>
        <div class="row" style="margin-bottom:10px;gap:8px;">
          <button id="smFilterToggle" class="small ${showFilters?'primary':''}" style="font-size:11px;padding:4px 10px;">
            <i class="ti ti-adjustments-horizontal" style="font-size:12px;vertical-align:-1px;"></i> ${showFilters ? 'Ocultar filtros' : 'Filtros'}
          </button>
          ${cat||tier||level||group ? `<button id="smClearFilters" class="small" style="font-size:11px;padding:4px 10px;color:var(--warning);">Limpiar filtros</button>` : ''}

          <span id="smCounter" class="muted" style="font-size:11px;">${r.totalCount} de ${EXERCISE_DB.length}</span>
        </div>
        ${filtersBlock}
        <div id="smResults" style="flex:1;overflow-y:auto;min-height:120px;max-height:55vh;">
          ${r.html}
        </div>
        <div class="muted" style="font-size:11px;text-align:center;margin-top:10px;">
          <a id="smHelp" style="color:var(--accent);cursor:pointer;text-decoration:underline;">¿Cómo funciona el rating?</a>
        </div>
      </div>
    </div>`;

    document.getElementById('smb').addEventListener('click', e => { if (e.target.id === 'smb') closeModal(); });
    document.getElementById('smClose').addEventListener('click', closeModal);
    document.getElementById('smFilterToggle').addEventListener('click', () => { showFilters = !showFilters; build(); });
    document.getElementById('smHelp').addEventListener('click', () => { closeModal(); state.view = 'howRatingWorks'; render(); });
    const cb = document.getElementById('smClearFilters');
    if (cb) cb.addEventListener('click', () => { cat = tier = level = group = ''; build(); });

    let timer;
    const inp = document.getElementById('smInput');
    inp.focus();
    inp.setSelectionRange(inp.value.length, inp.value.length);
    inp.addEventListener('input', e => {
      query = e.target.value;
      state.homeExQuery = query;
      clearTimeout(timer);
      timer = setTimeout(updateResultsOnly, 180);
    });

    document.querySelectorAll('[data-fc]').forEach(b => b.addEventListener('click', () => { cat = (cat === b.dataset.fc) ? '' : b.dataset.fc; build(); }));
    document.querySelectorAll('[data-ft]').forEach(b => b.addEventListener('click', () => { tier = (tier === b.dataset.ft) ? '' : b.dataset.ft; build(); }));
    document.querySelectorAll('[data-fl]').forEach(b => b.addEventListener('click', () => { level = (level === b.dataset.fl) ? '' : b.dataset.fl; build(); }));
    const gs = document.getElementById('smGroup');
    if (gs) gs.addEventListener('change', e => { group = e.target.value; build(); });

    attachResultHandlers();
  }
  build();
}

function openLibExerciseEditor(initial, onSave){
  const ex = JSON.parse(JSON.stringify(initial || { name:'', video:'', primary:[], secondary:[], alts:[] }));
  window._libExDraft = ex;

  function renderMuscles(){
    return MUSCLE_IDS.map(m => {
      const isP = ex.primary.includes(m);
      const isS = ex.secondary.includes(m);
      const cls = isP ? 'primary' : isS ? 'secondary' : '';
      return `<div class="muscle-chip ${cls}" data-mid="${m}">
        <span>${MUSCLES[m].label}</span>
        <span style="font-size:10px;font-weight:600;">${isP?'●●':isS?'●':''}</span>
      </div>`;
    }).join('');
  }
  function renderAlts(){
    return (ex.alts || []).map((a, i) => `
      <div class="alt-row">
        <input type="text" data-alt-i="${i}" value="${esc(a)}" maxlength="80" />
        <button data-rm-alt="${i}" style="padding:6px;border:none;color:var(--danger);"><i class="ti ti-x" style="font-size:14px;"></i></button>
      </div>`).join('');
  }
  function cycleLibMuscle(m){
    const inP = ex.primary.indexOf(m);
    const inS = ex.secondary.indexOf(m);
    if (inP === -1 && inS === -1){ ex.primary.push(m); }
    else if (inP !== -1){ ex.primary.splice(inP, 1); ex.secondary.push(m); }
    else { ex.secondary.splice(inS, 1); }
    const grid = document.getElementById('libMuscleGrid');
    if (!grid) return;
    grid.innerHTML = renderMuscles();
    attachMuscleHandlers();
  }
  function attachMuscleHandlers(){
    document.querySelectorAll('#libMuscleGrid [data-mid]').forEach(el => {
      el.addEventListener('click', () => cycleLibMuscle(el.dataset.mid));
    });
  }

  function rebuild(){
    modalRoot.innerHTML = `<div class="modal-backdrop" id="mb">
      <div class="modal" onclick="event.stopPropagation()" style="max-width:520px;">
        <h2 style="margin-bottom:14px;">${ex.name ? 'Editar ejercicio' : 'Nuevo ejercicio'}</h2>

        <button id="libSearchBtn" style="width:100%;padding:11px;margin-bottom:14px;background:var(--accent-bg);border:1px solid var(--accent-border);color:var(--accent);font-weight:500;">
          <i class="ti ti-database-search" style="font-size:14px;vertical-align:-2px;"></i> Buscar en biblioteca de 359 ejercicios
        </button>

        <label class="section-label" style="margin-bottom:6px;">Nombre</label>
        <input id="libExName" type="text" value="${esc(ex.name)}" maxlength="80" style="margin-bottom:12px;" />
        <label class="section-label" style="margin-bottom:6px;">Búsqueda del video en YouTube</label>
        <input id="libExVideo" type="text" value="${esc(ex.video || '')}" maxlength="120" placeholder="ej: lat pulldown technique" />
        <div class="muted" style="font-size:11px;margin-top:6px;margin-bottom:14px;">En inglés funciona mejor.</div>

        <label class="section-label" style="margin-bottom:6px;">Tipo de registro</label>
        <select id="libMeasurement" style="margin-bottom:14px;">
          <option value="weight_reps" ${exerciseMeasurementType(ex)==='weight_reps'?'selected':''}>Peso × reps</option>
          <option value="reps_only" ${exerciseMeasurementType(ex)==='reps_only'?'selected':''}>Solo reps</option>
          <option value="time" ${exerciseMeasurementType(ex)==='time'?'selected':''}>Tiempo (min + seg)</option>
        </select>
        ${initial && initial.name ? `<label style="display:flex;align-items:flex-start;gap:9px;padding:10px 12px;background:var(--warning-bg);border:1px solid rgba(251,191,36,0.25);border-radius:var(--radius-sm);margin-bottom:14px;cursor:pointer;">
          <input type="checkbox" id="libResetBaseline" style="margin-top:3px;" />
          <span style="font-size:12px;line-height:1.4;color:var(--warning);">
            <strong>Reiniciar progreso de este ejercicio</strong><br>
            El historial anterior se conserva, pero este ejercicio empezará desde una nueva base.
          </span>
        </label>` : ''}

        <div class="section-label">Músculos trabajados</div>
        <div class="muted" style="font-size:12px;margin-bottom:10px;">Toca: vacío → <strong style="color:var(--accent);">principal ●●</strong> → <strong style="color:var(--warning);">secundario ●</strong> → vacío</div>
        <div class="muscle-grid" id="libMuscleGrid">${renderMuscles()}</div>

        <div class="section-label" style="margin-top:18px;">Alternativas</div>
        <div id="libAltsContainer">${renderAlts()}</div>
        <button id="libAddAlt" style="margin-top:6px;width:100%;padding:11px;border-style:dashed;color:var(--text-muted);">
          <i class="ti ti-plus" style="font-size:14px;vertical-align:-2px;"></i> Agregar alternativa
        </button>

        <label class="row" style="margin-top:18px;gap:10px;cursor:pointer;font-size:13px;">
          <input type="checkbox" id="libSuggest" ${ex._suggestSimilar ? 'checked' : ''} style="margin:0;" />
          <span style="flex:1;">
            <span style="font-weight:500;">Sugerir ejercicios similares</span>
            <span class="muted" style="display:block;font-size:11px;margin-top:1px;">Al guardar te muestra 3 alternativas con músculos parecidos.</span>
          </span>

        <div class="row" style="gap:8px;margin-top:18px;">
          <button id="libCancel" style="flex:1;padding:12px;">Cancelar</button>
          <button class="primary" id="libSave" style="flex:1;padding:12px;font-weight:600;">Guardar</button>

      // Show suggestions modal AFTER save, if toggle is on and we have muscles
      if (wantSuggest && (ex.primary?.length || ex.secondary?.length)){
        const similars = findSimilarByMuscles(ex.primary || [], ex.secondary || [], 3);
        if (similars.length) openSimilarSuggestions(ex, similars);
      }
    });
    attachMuscleHandlers();
    document.getElementById('libAddAlt').addEventListener('click', () => {
      ex.alts = Array.from(document.querySelectorAll('[data-alt-i]')).map(i => i.value.trim());
      ex.alts.push('');
      document.getElementById('libAltsContainer').innerHTML = renderAlts();
      attachAltHandlers();
      document.querySelector(`[data-alt-i="${ex.alts.length-1}"]`)?.focus();
    });
    document.getElementById('libSearchBtn').addEventListener('click', () => {
      openDbPicker((dbEx) => {
        const conv = dbToAppExercise(dbEx);
        ex.name = conv.name;
        ex.video = conv.video;
        ex.primary = conv.primary;
        ex.secondary = conv.secondary;
        ex.alts = conv.alts;
        ex.measurement = conv.measurement || 'weight_reps';
        rebuild();
      });
    });
    attachAltHandlers();
  }
  function attachAltHandlers(){
    document.querySelectorAll('[data-rm-alt]').forEach(b => {
      b.addEventListener('click', () => {
        const i = Number(b.dataset.rmAlt);
        ex.alts = Array.from(document.querySelectorAll('[data-alt-i]')).map(inp => inp.value.trim());
        ex.alts.splice(i, 1);
        document.getElementById('libAltsContainer').innerHTML = renderAlts();
        attachAltHandlers();
      });
    });
  }
  rebuild();
}

function renderOnboarding(){
  // Bail if already mounted (render() may be called multiple times by realtime listeners)
  if (document.querySelector('.onboarding-wrap')) return;
  let currentSlide = 0;
  const totalSlides = ONBOARDING_SLIDES.length;
  const wrap = document.createElement('div');
  wrap.className = 'onboarding-wrap';
  wrap.innerHTML = `
    <button class="onboarding-skip" id="obSkip">Saltar</button>
    <div class="onboarding-slides" id="obSlides">
      ${ONBOARDING_SLIDES.map((s, i) => `
        <div class="onboarding-slide" data-i="${i}">
          <div class="onboarding-icon">${s.icon}</div>
          <h2>${esc(s.title)}</h2>
          <p>${esc(s.subtitle)}</p>
          ${s.features ? `<div class="onboarding-features">
            ${s.features.map(f => `<div class="onboarding-feature"><i class="ti ${f.icon}"></i><span>${esc(f.text)}</span></div>`).join('')}
          </div>` : ''}
        </div>`).join('')}
    </div>
    <div class="onboarding-footer">
      <div class="onboarding-dots" id="obDots">
        ${ONBOARDING_SLIDES.map((_, i) => `<div class="onboarding-dot ${i===0?'active':''}" data-i="${i}"></div>`).join('')}
      </div>
      <button class="primary onboarding-cta" id="obCta">Siguiente</button>
    </div>`;
  document.body.appendChild(wrap);
  const slidesEl = wrap.querySelector('#obSlides');
  const dotsEl = wrap.querySelector('#obDots');
  const ctaBtn = wrap.querySelector('#obCta');
  const skipBtn = wrap.querySelector('#obSkip');
  function close(){
    markOnboardingSeen();
    // Render the underlying app FIRST (login or home), THEN fade out the slides on top
    try { render(); } catch(e){ console.error(e); }
    wrap.style.transition = 'opacity 0.3s ease';
    wrap.style.opacity = '0';
    wrap.style.pointerEvents = 'none';
    setTimeout(() => wrap.remove(), 320);
  }
  function goTo(i){
    currentSlide = Math.max(0, Math.min(totalSlides - 1, i));
    const slide = slidesEl.children[currentSlide];
    slidesEl.scrollTo({ left: slide.offsetLeft, behavior: 'smooth' });
    updateUI();
  }
  function updateUI(){
    dotsEl.querySelectorAll('.onboarding-dot').forEach((d, i) => d.classList.toggle('active', i === currentSlide));
    ctaBtn.textContent = currentSlide === totalSlides - 1 ? '¡Comenzar!' : 'Siguiente';
  }
  ctaBtn.addEventListener('click', () => { if (currentSlide === totalSlides - 1) close(); else goTo(currentSlide + 1); });
  skipBtn.addEventListener('click', close);
  dotsEl.querySelectorAll('.onboarding-dot').forEach(d => d.addEventListener('click', () => goTo(Number(d.dataset.i))));
  let scrollTimer;
  slidesEl.addEventListener('scroll', () => {
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(() => {
      const i = Math.round(slidesEl.scrollLeft / slidesEl.offsetWidth);
      if (i !== currentSlide){ currentSlide = i; updateUI(); }
    }, 80);
  });
}

const TOUR_STEPS = [
  { selector:'[data-action="openDay"]', title:'💪 Tus días de entreno', body:'Cada tarjeta es un día. Toca uno para ver los ejercicios y registrar tu sesión.' },
  { selector:'[data-action="goCompare"]', title:'📈 Ver progreso', body:'Aquí ves cómo evolucionas: peso máximo, volumen, comparado con tu buddy.' },

function startHomeTour(){
  if (!shouldShowTour()) return;
  if (document.querySelector('.tour-overlay')) return; // already showing
  let step = 0;
  const overlay = document.createElement('div');
  overlay.className = 'tour-overlay';
  overlay.innerHTML = `
    <div class="tour-bg"></div>
    <div class="tour-spotlight" id="tourSpot"></div>
    <div class="tour-tooltip" id="tourTip">
      <h3 id="tourTitle"></h3>
      <p id="tourBody"></p>
      <div class="tour-progress">
        <span class="tour-step" id="tourStep"></span>
        <div class="tour-actions">
          <button id="tourSkip" style="background:transparent;border:none;color:var(--text-muted);">Saltar</button>
          <button class="primary" id="tourNext" style="padding:6px 14px;">Siguiente</button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const spot = overlay.querySelector('#tourSpot');
  const tip = overlay.querySelector('#tourTip');
  const titleEl = overlay.querySelector('#tourTitle');
  const bodyEl = overlay.querySelector('#tourBody');
  const stepEl = overlay.querySelector('#tourStep');
  const nextBtn = overlay.querySelector('#tourNext');
  const skipBtn = overlay.querySelector('#tourSkip');
  function close(){
    markTourSeen();
    overlay.style.animation = 'fadeIn 0.2s ease reverse';
    setTimeout(() => overlay.remove(), 200);
  }
  function showStep(){
    const s = TOUR_STEPS[step];
    if (!s){ close(); return; }
    const target = document.querySelector(s.selector);
    if (!target){ step++; showStep(); return; }
    target.scrollIntoView({ behavior:'smooth', block:'center' });
    setTimeout(() => {
      const rect = target.getBoundingClientRect();
      const pad = 8;
      spot.style.left = (rect.left - pad) + 'px';
      spot.style.top = (rect.top - pad) + 'px';
      spot.style.width = (rect.width + pad * 2) + 'px';
      spot.style.height = (rect.height + pad * 2) + 'px';
      titleEl.textContent = s.title;
      bodyEl.textContent = s.body;
      stepEl.textContent = `${step + 1} / ${TOUR_STEPS.length}`;
      nextBtn.textContent = step === TOUR_STEPS.length - 1 ? '¡Listo!' : 'Siguiente';
      const tipW = 300; const tipH = 150;
      const vpW = window.innerWidth; const vpH = window.innerHeight;
      let left = rect.left + rect.width / 2 - tipW / 2;
      left = Math.max(12, Math.min(vpW - tipW - 12, left));
      let top = rect.bottom + 16;
      if (top + tipH > vpH - 20) top = rect.top - tipH - 16;
      tip.style.left = left + 'px';
      tip.style.top = Math.max(12, top) + 'px';
      tip.style.maxWidth = tipW + 'px';
    }, 300);
  }
  nextBtn.addEventListener('click', () => { step++; showStep(); });
  skipBtn.addEventListener('click', close);
  showStep();
}

let realtimeRenderTimer = null;
function requestRealtimeRender(){
  if (state.suppressRealtimeRender) return;
  const wait = Math.max(0, (state.realtimeQuietUntil || 0) - Date.now());
  if (wait > 0){
    if (!realtimeRenderTimer){
      realtimeRenderTimer = setTimeout(() => {
        realtimeRenderTimer = null;
        render();
      }, wait + 30);
    }
    return;
  }
  if (realtimeRenderTimer){
    clearTimeout(realtimeRenderTimer);
    realtimeRenderTimer = null;
  }
  render();
}
