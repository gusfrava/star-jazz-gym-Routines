// ====== HOME ======
function renderHome(){
  const others = state.users.filter(u=>u.id!==state.currentUser);
  const lastByUser = state.users.map(u=>{
    let latest = null;
    const ul = state.logs[u.id] || {};
    for (const k in ul) for (const e of ul[k]){
      if (!latest || e.date > latest.date) latest = { date:e.date, exKey:k };
    }
    return { user:u, latest };
  });

  const allDays = getAllDayKeys();
  const homeSrc = state.homeSource || 'shared';
  const sourceTabs = state.currentUser ? `
    <div class="tab-bar fade-in" style="margin-bottom:14px;width:100%;animation-delay:90ms;">
      <button class="${homeSrc==='shared'?'active':''}" data-action="setHomeSource" data-src="shared" style="flex:1;">
        <i class="ti ti-users" style="font-size:13px;vertical-align:-1px;"></i> Compartida
      </button>
      <button class="${homeSrc==='personal'?'active':''}" data-action="setHomeSource" data-src="personal" style="flex:1;">
        <i class="ti ti-user" style="font-size:13px;vertical-align:-1px;"></i> Personal
      </button>
    </div>` : '';
  const globalMuscleStats = fullRoutineMuscleStats();
  const globalMuscleMapBtn = `
    <button data-action="toggleGlobalRoutineMuscles" style="margin-bottom:12px;padding:11px;width:100%;background:${state.showGlobalRoutineMuscles?'var(--accent-bg-strong)':'var(--bg-elev)'};color:${state.showGlobalRoutineMuscles?'var(--accent)':'var(--text)'};border:1px solid ${state.showGlobalRoutineMuscles?'var(--accent-border)':'var(--border)'};display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:500;">
      <i class="ti ti-body-scan" style="font-size:15px;"></i> ${state.showGlobalRoutineMuscles ? 'Ocultar Mapa Muscular General' : 'Mapa Muscular General'}
    </button>`;
  const globalMuscleOverview = state.showGlobalRoutineMuscles
    ? routineMuscleOverview(globalMuscleStats, {
      title: 'Mapa Muscular General',
      subtitle: 'Resumen de todos los días de tu rutina actual. Usa la rutina compartida o personal seleccionada en cada día.',
      scope: 'general'
    })
    : '';
  const dayCards = allDays.map((dk, i) => {
    // Filtrar las rutinas de biblioteca standalone según el tab activo
    if (state.library && state.library[dk] && !state.library[dk].originDay){
      if (homeSrc !== 'shared') return '';
    }
    if (state.personalLibrary && state.personalLibrary[dk] && !state.personalLibrary[dk].originDay){
      if (homeSrc !== 'personal') return '';
    }

    let r;
    if (homeSrc === 'personal'){
      // En Personal: solo mostrar si el usuario tiene algo personal para este día.
      // No hacer fallback a la rutina compartida.
      const personalForDay = state.personalRoutines[state.currentUser]?.[dk];
      const personalLibForDay = state.personalLibrary && state.personalLibrary[dk];
      if (!personalForDay && !personalLibForDay) return '';
      r = personalForDay || (personalLibForDay ? libraryRoutineAsDay(personalLibForDay) : null);
    } else {
      // En Compartida: mostrar rutina del grupo (biblioteca migrada o sharedRoutine)
      const libForDay = state.library && state.library[dk];
      r = (libForDay ? libraryRoutineAsDay(libForDay) : null)
        || (state.sharedRoutine && state.sharedRoutine[dk]);
    }
    if (!r) return '';
    const totalEx = (r.exercises || []).length;
    const muscleSummary = [...new Set((r.exercises || []).flatMap(ex => ex.primary || []))]
      .slice(0, 3)
      .map(id => MUSCLES[id]?.label)
      .filter(Boolean)
      .join(' · ');
    const detailText = r.focus || muscleSummary || `${totalEx} ejercicio${totalEx===1?'':'s'}`;
    let logged = 0;
    const ws = new Date(); ws.setDate(ws.getDate()-((ws.getDay()+6)%7));
    const wss = dateKey(ws);
    for (let j=0;j<totalEx;j++){
      const ek = exerciseKey(dk,j);
      if (state.currentUser && getEntries(state.currentUser, ek).some(e => e.date >= wss)) logged++;
    }
    const pct = totalEx ? Math.round((logged/totalEx)*100) : 0;
    const sourceLabel = '';
    return `<button data-action="openDay" data-day="${dk}" class="day-card fade-in" style="animation-delay:${i*60}ms;">
      <div class="row" style="position:relative;z-index:1;">
        <div class="icon-tile">
          <i class="ti ${r.icon || 'ti-barbell'}" style="font-size:20px;"></i>
        </div>
        <div style="min-width:0;flex:1;">
          <div style="font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px;">${esc(r.label)} ${sourceLabel}</div>
          <div class="muted" style="font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px;">${esc(detailText)}</div>
        </div>
        ${state.currentUser ? `<div style="text-align:right;">
          <div class="mono" style="font-size:11px;color:var(--text-dim);letter-spacing:0.02em;">${logged}/${totalEx}</div>
          <div style="width:36px;height:4px;background:var(--bg-elev-2);border-radius:2px;margin-top:4px;overflow:hidden;">
            <div style="height:100%;background:var(--accent-grad);width:${pct}%;transition:width 0.5s ease;border-radius:2px;"></div>
          </div>
        </div>` : ''}
        <i class="ti ti-chevron-right" style="font-size:18px;color:var(--text-dim);"></i>
      </div>
    </button>`;
  }).join('');

  // Empty state cuando estamos en Personal y no hay nada para mostrar
  const dayCardsEmpty = !dayCards.trim() && homeSrc === 'personal' && state.currentUser ? `
    <div class="card fade-in" style="padding:40px 20px;text-align:center;">
      <i class="ti ti-user-plus" style="font-size:36px;color:var(--text-dim);display:block;margin-bottom:8px;"></i>
      <div style="font-weight:500;margin-bottom:4px;">No tienes rutinas personales aún</div>
      <div class="muted" style="font-size:13px;margin-bottom:14px;">Crea una rutina personal para verla aquí sin afectar al grupo.</div>
      <button class="primary" data-action="goLibrary" style="padding:11px 18px;font-weight:600;">
        <i class="ti ti-plus" style="font-size:14px;vertical-align:-2px;"></i> Ir a Mi Biblioteca
      </button>
    </div>` : '';

  const partnersBlock = others.length ? `
    <div style="margin-top:28px;">
      <div class="section-label">Compañeros</div>
      ${others.map((u,i)=>{
        const last = lastByUser.find(x=>x.user.id===u.id);
        const lastTxt = last && last.latest ? `Último entreno: ${last.latest.date}` : 'Sin entrenos registrados';
        return `<div class="card fade-in" style="margin-bottom:6px;padding:12px 14px;animation-delay:${i*40}ms;">
          <div class="row">
            ${avatarHtml(u, 28)}
            <div style="flex:1;">
              <div style="font-size:14px;font-weight:500;display:flex;align-items:center;gap:6px;">${esc(u.name)} ${isUserAdmin(u) ? '<span class="admin-pill">admin</span>' : ''}</div>
              <div class="muted" style="font-size:12px;margin-top:2px;">${lastTxt}</div>
            </div>
            <button data-action="viewPublicProfile" data-uid="${u.id}" aria-label="Ver perfil de ${esc(u.name)}" title="Ver perfil" style="padding:8px 10px;border-color:var(--border);background:var(--bg-elev);">
              <i class="ti ti-eye" style="font-size:16px;color:var(--accent);"></i>
            </button>
          </div>
        </div>`;
      }).join('')}
    </div>` : `
    <div class="card fade-in" style="margin-top:28px;padding:16px;font-size:13px;color:var(--text-muted);text-align:center;">
      <i class="ti ti-users" style="font-size:24px;color:var(--text-dim);display:block;margin-bottom:6px;"></i>
      Cuando tu compañero entre, aparecerá aquí.
    </div>`;

  const me = state.users.find(u=>u.id===state.currentUser);
  const viewOnlyBanner = !state.currentUser ? `
    <div class="banner banner-info"><i class="ti ti-eye"></i>
      <div>Modo solo lectura. <button data-action="switchUser" style="background:transparent;border:none;color:var(--info);text-decoration:underline;cursor:pointer;padding:0;font-size:13px;font-family:inherit;">Inicia sesión</button> para registrar entrenos.</div>
    </div>` : '';

  const currentGroupName = state.currentGroup ? groupDisplayName(state.currentGroup) : '';
  const groupPill = state.currentGroup ? `
    <button data-action="goGroupHub" class="group-pill" style="display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 8px;margin-top:6px;border-radius:var(--radius-pill);background:var(--bg-elev);border:1px solid var(--border);font-size:12px;color:var(--text-muted);font-family:inherit;cursor:pointer;transition:all 0.15s;">
      <i class="ti ti-users-group" style="font-size:13px;color:var(--accent);"></i>
      <span style="color:var(--text);font-weight:500;">${esc(currentGroupName)}</span>
      <i class="ti ti-chevron-right" style="font-size:12px;opacity:0.5;"></i>
    </button>` : '';

  root.innerHTML = `
    ${configBanner()}
    ${viewOnlyBanner}
    <div class="row fade-in" style="margin-bottom:20px;">
      <div>
        <h1>Mi Rutina</h1>
        <div class="muted" style="font-size:13px;margin-top:2px;">${new Date().toLocaleDateString('es-ES', {weekday:'long', day:'numeric', month:'long'})}</div>
        ${groupPill}
      </div>
      <div class="spacer"></div>
      ${syncIndicator()}
      ${me ? `<button class="user-pill" data-action="userMenu">
        <span class="dot" style="background:${me.color};width:14px;height:14px;border:2px solid var(--bg-elev);box-shadow:0 0 0 1px ${me.color};"></span>${esc(me.name)}
        ${isAdmin() ? '<span class="admin-pill">admin</span>' : ''}
        <i class="ti ti-chevron-down" style="font-size:14px;color:var(--text-muted);"></i>
      </button>` : `<button data-action="switchUser" style="font-size:13px;">Iniciar Sesión</button>`}
    </div>

    <div class="fade-in" style="display:flex;gap:8px;margin-bottom:20px;animation-delay:80ms;">
      <button data-action="goCompare" style="flex:1;padding:14px;background:var(--bg-elev);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:500;border:1px solid var(--border);">
        <i class="ti ti-chart-line" style="font-size:17px;color:var(--accent);"></i> Ver Progreso
      </button>
      <button data-action="openSearchModal" aria-label="Buscar ejercicios" style="padding:14px;background:var(--bg-elev);border:1px solid var(--border);">
        <i class="ti ti-search" style="font-size:17px;color:var(--accent);"></i>
      </button>
      <button data-action="goSettings" aria-label="Configuración" style="padding:14px;background:var(--bg-elev);border:1px solid var(--border);">
        <i class="ti ti-settings" style="font-size:17px;color:var(--text-muted);"></i>
      </button>
    </div>
    ${globalMuscleMapBtn}
    ${globalMuscleOverview}
    ${sourceTabs}
    ${dayCards}
    ${dayCardsEmpty}
    ${partnersBlock}`;
  attach();

  if (state.currentUser && shouldShowTour()){
    setTimeout(() => startHomeTour(), 500);
  }
}

// ====== DAY ======
function renderDay(){
  const dayKey = state.currentDay;
  const r = getRoutineForDay(dayKey);
  if (!r){
    root.innerHTML = `${headerBar('Día Sin Rutina', 'goHome')}
      <p class="muted">Este día no tiene una rutina asignada todavía.</p>
      ${state.currentUser ? `<button class="primary" data-action="editRoutineNew" data-day="${dayKey}" style="margin-top:10px;">Crear Rutina</button>` : ''}`;
    attach(); return;
  }
  const src = getCurrentSource(dayKey);
  const personalAvail = !!(state.personalRoutines[state.currentUser] && state.personalRoutines[state.currentUser][dayKey]);

  const me = state.users.find(u=>u.id===state.currentUser);
  const meColor = me ? me.color : 'var(--border)';
  const exList = r.exercises.map((ex,idx)=>{
    const ek = exerciseKey(dayKey, idx);
    const myLatest = state.currentUser ? latestEntry(state.currentUser, ek) : null;
    const others = state.users.filter(u=>u.id!==state.currentUser);
    const meDot = state.currentUser ? `<span class="dot" title="Tú" style="background:${myLatest?meColor:'transparent'};border:1.5px solid ${myLatest?meColor:'var(--border-strong)'};"></span>` : '';
    const otherDots = others.map(u=>{
      const has = getEntries(u.id, ek).length > 0;
      return `<span class="dot" title="${esc(u.name)}" style="background:${has?u.color:'transparent'};border:1.5px solid ${has?u.color:'var(--border-strong)'};"></span>`;
    }).join('');

      <div class="row">

          <div style="font-size:14px;font-weight:500;margin-bottom:3px;">${esc(ex.name)}</div>
          <div class="muted" style="font-size:12px;">${esc(musclePill)}${lastInfo ? ' · '+lastInfo : ''}</div>
        </div>
        <div class="user-dots">${meDot}${otherDots}</div>
        <i class="ti ti-chevron-right" style="font-size:18px;color:var(--text-dim);"></i>
      </div>
    </button>`;
  }).join('');

  const isLibraryRoutine = src === 'library' || src === 'personalLibrary';
  const switcher = state.currentUser && !isLibraryRoutine ? `
    <div class="tab-bar">
      <button class="${src==='shared'?'active':''}" data-action="setSource" data-src="shared">
        <i class="ti ti-users" style="font-size:13px;vertical-align:-1px;"></i> Compartida
      </button>
      <button class="${src==='personal'?'active':''}" data-action="setSource" data-src="personal">
        <i class="ti ti-user" style="font-size:13px;vertical-align:-1px;"></i> ${personalAvail ? 'Personal' : 'Crear Personal'}
      </button>
    </div>` : '';

  const editBtn = state.currentUser ? `
    <button data-action="editRoutine" style="margin-bottom:16px;padding:11px;width:100%;background:var(--bg-elev);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:500;">
      <i class="ti ti-edit" style="font-size:15px;color:var(--accent);"></i> ${isLibraryRoutine ? 'Editar Rutina De Biblioteca' : `Editar ${src==='personal' ? 'Mi Rutina' : 'Rutina Compartida'}`}
    </button>` : '';
  const routineMapBtn = `
    <div class="row" style="gap:8px;margin-bottom:12px;">
      <button data-action="toggleRoutineMuscles" style="flex:1;padding:11px;background:${state.showRoutineMuscles?'var(--accent-bg-strong)':'var(--bg-elev)'};color:${state.showRoutineMuscles?'var(--accent)':'var(--text)'};border:1px solid ${state.showRoutineMuscles?'var(--accent-border)':'var(--border)'};display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:500;">
        <i class="ti ti-body-scan" style="font-size:15px;"></i> ${state.showRoutineMuscles ? 'Ocultar Mapa Muscular' : 'Mapa Muscular De La Rutina'}

        <i class="ti ti-search" style="font-size:15px;color:var(--accent);"></i>
      </button>
    </div>`;
  const routineOverview = state.showRoutineMuscles ? routineMuscleOverview(r, {
    title: 'Mapa Muscular Del Día',
    subtitle: 'Resumen de los ejercicios de este día. Sirve para ver qué zonas domina esta sesión.',
    scope: 'day'
  }) : '';

  root.innerHTML = `
    ${headerBar(r.label, 'goHome')}
    <div class="muted fade-in" style="font-size:13px;margin-top:-12px;margin-bottom:16px;">${esc(r.focus)}</div>
    ${switcher}
    ${editBtn}
    ${routineMapBtn}
    ${routineOverview}
    ${exList}`;
  attach();
}

// ====== EXERCISE ======
function renderExercise(){
  const dayKey = state.currentDay;
  const r = getRoutineForDay(dayKey);
  const ex = r.exercises[state.currentExerciseIdx];
  const measurement = exerciseMeasurementType(ex);
  const repsOnly = measurement === 'reps_only';
  const timeMode = measurement === 'time';
  const metricLabel = timeMode ? 'Tiempo' : repsOnly ? 'Solo reps' : 'Peso × reps';
  const ek = exerciseKey(dayKey, state.currentExerciseIdx);
  const myEntries = state.currentUser ? getEntries(state.currentUser, ek).slice().sort((a,b)=>b.date.localeCompare(a.date)) : [];
  const lastEntry = myEntries[0]; const prevEntry = myEntries[1];
  const editing = state.editingSession && state.editingSession.uid === state.currentUser && state.editingSession.ek === ek
    ? getEntries(state.currentUser, ek).find(e => e.date === state.editingSession.date)
    : null;
  const formEntry = editing || lastEntry;

  let formHtml = '';
  if (state.currentUser){
    const initialCount = formEntry ? formEntry.sets.length : 4;
    // Cada set guardado mantiene su propio modo. El checkbox global solo aplica a sets nuevos.
    // Por eso lo dejamos sin marcar por default (no fuerza el estado de los sets guardados).
    const unilateralMode = false;
    const setRows = [];
    for (let i=0;i<initialCount;i++){
      const set = formEntry && formEntry.sets[i] ? formEntry.sets[i] : null;
      const lastSet = lastEntry && lastEntry.sets[i] ? lastEntry.sets[i] : null;
      setRows.push(renderSetRow(i, set, lastSet, unilateralMode, measurement));
    }
    const sessionNotePh = lastEntry && lastEntry.note ? 'Nota anterior: ' + lastEntry.note.slice(0,60) : 'Cómo te sentiste, observaciones, ajustes…';
    formHtml = `<div class="card" style="margin-bottom:18px;">
      <div class="row" style="margin-bottom:14px;">
        <h2>${editing ? 'Editar Sesión' : 'Registrar Sesión'}</h2>
        <div class="spacer"></div>
        <input type="date" id="sessionDate" value="${editing ? esc(editing.date) : today()}" style="width:auto;padding:7px 11px;font-size:13px;font-family:var(--font-mono);" />
      </div>
      ${editing ? `<div class="banner banner-info" style="margin-bottom:12px;"><i class="ti ti-edit"></i><div>Editando la sesión del ${esc(editing.date)}. Puedes cambiar la fecha, sets, peso, reps y notas.</div></div>` : ''}
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap;">
        <span class="badge" style="background:var(--accent-bg);color:var(--accent);border:1px solid var(--accent-border);">${esc(metricLabel)}</span>
        <label style="display:${timeMode?'none':'inline-flex'};align-items:center;gap:8px;padding:8px 11px;background:var(--bg-elev-2);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;cursor:pointer;">
          <input id="unilateralMode" type="checkbox" data-action="toggleUnilateral" ${unilateralMode?'checked':''} />
          Unilateral
        </label>
        <button data-action="copyFirstSet" style="padding:8px 11px;font-size:13px;border-color:var(--border);background:var(--bg-elev-2);">
          <i class="ti ti-copy" style="font-size:14px;vertical-align:-2px;color:var(--accent);"></i> Copiar set 1
        </button>
        <div class="muted" style="font-size:11px;flex-basis:100%;line-height:1.35;">${timeMode ? 'Registra duración por set en minutos y segundos.' : 'Puedes mezclar sets normales, unilaterales y drop sets. Todo se suma al mismo progreso de este ejercicio.'}</div>
      </div>
      <div class="dim" style="display:grid;grid-template-columns:30px ${timeMode || !repsOnly ? '1fr 1fr' : '1fr'} 28px;gap:8px;margin-bottom:8px;padding:0 10px;font-size:10px;text-transform:uppercase;letter-spacing:0.08em;font-family:var(--font-mono);">
        <div style="text-align:center;">SET</div>${timeMode ? '<div style="text-align:center;">MIN</div><div style="text-align:center;">SEG</div>' : `<div style="text-align:center;">REPS</div>${repsOnly ? '' : '<div style="text-align:center;">PESO (LB)</div>'}`}<div></div>
      </div>
      <div id="setsContainer">${setRows.join('')}</div>
      <button data-action="addSet" style="margin-top:6px;width:100%;padding:11px;border-style:dashed;color:var(--text-muted);">
        <i class="ti ti-plus" style="font-size:14px;vertical-align:-2px;"></i> Agregar set
      </button>
      <div style="margin-top:16px;">
        <label class="section-label" style="margin-bottom:6px;">
          <i class="ti ti-message" style="font-size:11px;vertical-align:-1px;"></i> Comentario general
        </label>
        <textarea id="sessionNote" rows="2" maxlength="300" placeholder="${esc(sessionNotePh)}" style="resize:vertical;font-family:inherit;">${editing && editing.note ? esc(editing.note) : ''}</textarea>
      </div>
      <button class="primary" data-action="saveSession" style="margin-top:12px;width:100%;padding:13px;font-weight:600;font-size:15px;">${editing ? 'Actualizar Sesión' : 'Guardar Sesión'}</button>
      ${editing ? `<button data-action="cancelEditSession" style="margin-top:8px;width:100%;padding:11px;background:var(--bg-elev);border:1px solid var(--border);">Cancelar Edición</button>` : ''}
      <div id="saveStatus" style="font-size:12px;color:var(--success);text-align:center;margin-top:8px;min-height:14px;"></div>
    </div>`;
  }

  const historyRows = [];
  for (const u of state.users){
    const entries = getEntries(u.id, ek).slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
    for (const e of entries){
      const best = bestSet(e); const vol = totalVolume(e);
      const setNotes = (e.sets||[]).map((s,i)=> s.note ? `Set ${i+1}: ${s.note}` : null).filter(Boolean);
      historyRows.push({ date:e.date, user:u, ek, uid:u.id,
        summary: sessionMetricSummary(e, best, vol, e.measurement || measurement),
        sessionNote: e.note || null, setNotes });
    }
  }
  historyRows.sort((a,b)=>b.date.localeCompare(a.date));
  const historyList = historyRows.slice(0,8).map(h => `<div class="history-entry">
    <div class="row">
      <span class="dot" style="background:${h.user.color};"></span>
      <div style="flex:1;min-width:0;">
        <div style="font-size:13px;font-weight:500;">${esc(h.user.name)} <span class="mono dim" style="font-weight:400;font-size:11px;">· ${h.date}</span></div>
        <div class="muted mono" style="font-size:11px;margin-top:2px;">${h.summary}</div>
      </div>
      ${state.currentUser && h.uid === state.currentUser ? `<div style="display:flex;gap:4px;">
        <button data-action="editSession" data-uid="${h.uid}" data-ek="${h.ek}" data-date="${h.date}" aria-label="Editar" style="padding:6px;border-color:var(--border);"><i class="ti ti-edit" style="font-size:14px;color:var(--accent);"></i></button>
        <button data-action="deleteSession" data-uid="${h.uid}" data-ek="${h.ek}" data-date="${h.date}" aria-label="Eliminar" style="padding:6px;border:none;color:var(--danger);"><i class="ti ti-trash" style="font-size:14px;"></i></button>
      </div>` : ''}
    </div>
    ${h.sessionNote ? `<div class="wrap-text" style="margin-top:8px;padding:7px 10px;background:var(--bg-elev);border-radius:8px;font-size:12px;color:var(--text-muted);font-style:italic;"><i class="ti ti-message" style="font-size:12px;"></i> ${esc(h.sessionNote)}</div>` : ''}
    ${h.setNotes.length ? `<div class="dim wrap-text" style="margin-top:6px;font-size:11px;padding-left:18px;">${h.setNotes.map(n=>esc(n)).join(' · ')}</div>` : ''}
  </div>`).join('') || '<div class="muted" style="font-size:13px;padding:14px;text-align:center;">Sin historial todavía.</div>';

  let progressBadge = '';
  if (lastEntry && prevEntry){
    const lb = bestSet(lastEntry); const pb = bestSet(prevEntry);
    if (lb && pb){
      const diff = setComparableValue(lb, measurement) - setComparableValue(pb, measurement);
      const unit = measurement === 'time' ? 's' : measurement === 'reps_only' ? ' reps' : ' lb';
      if (diff>0) progressBadge = `<span class="badge" style="background:var(--success-bg);color:var(--success);"><i class="ti ti-trending-up" style="font-size:12px;"></i>+${diff}${unit}</span>`;
      else if (diff<0) progressBadge = `<span class="badge" style="background:var(--warning-bg);color:var(--warning);"><i class="ti ti-trending-down" style="font-size:12px;"></i>${diff}${unit}</span>`;
      else progressBadge = `<span class="badge" style="background:var(--bg-elev-2);color:var(--text-muted);">Igual</span>`;
    }
  }

  const altsList = (ex.alts||[]).map(a=> `<li style="padding:8px 0;font-size:14px;color:var(--text-muted);border-bottom:1px solid var(--border);list-style:none;"><i class="ti ti-arrow-right" style="font-size:12px;color:var(--accent);margin-right:6px;"></i>${esc(a)}</li>`).join('');
  const videoUrl = ex.video ? `https://www.youtube.com/results?search_query=${encodeURIComponent(ex.video)}` : '#';
  const { primLabels, secLabels } = muscleLabels(ex.primary, ex.secondary);

  root.innerHTML = `
    ${headerBar(ex.name, 'goDay')}
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;">
      ${ex.video ? `<a href="${videoUrl}" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:6px;padding:9px 14px;background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;text-decoration:none;color:var(--text);font-weight:500;">
        <i class="ti ti-brand-youtube" style="font-size:16px;color:#ff0000;"></i> Ver técnica
      </a>` : ''}
      <button data-action="toggleMuscles" style="background:${state.showMuscles?'var(--accent-bg-strong)':'var(--bg-elev)'};color:${state.showMuscles?'var(--accent)':'var(--text)'};border-color:${state.showMuscles?'var(--accent-border)':'var(--border)'};">
        <i class="ti ti-body-scan" style="font-size:16px;"></i> Músculos
      </button>
      ${(ex.alts && ex.alts.length) ? `<button data-action="toggleAlts" style="background:${state.showAlts?'var(--accent-bg-strong)':'var(--bg-elev)'};color:${state.showAlts?'var(--accent)':'var(--text)'};border-color:${state.showAlts?'var(--accent-border)':'var(--border)'};">
        <i class="ti ti-arrows-shuffle" style="font-size:16px;"></i> Alternativas
      </button>` : ''}
      ${state.currentUser ? `<button data-action="editExerciseFromView" style="padding:9px 14px;font-size:13px;background:var(--bg-elev);border:1px solid var(--border);"><i class="ti ti-edit" style="font-size:14px;vertical-align:-2px;"></i> Editar</button>` : ''}
      ${progressBadge}
    </div>
    ${state.showMuscles ? `<div class="card" style="margin-bottom:16px;">
      ${bodyDiagram(ex.primary, ex.secondary, exerciseIntensityMap(ex))}
      <div style="display:flex;flex-direction:column;gap:10px;margin-top:14px;">
        <div class="row" style="font-size:13px;">
          <span style="width:14px;height:14px;background:var(--accent);border-radius:4px;flex-shrink:0;"></span>
          <span class="muted">Principal:</span>

        </div>
        ${secLabels.length ? `<div class="row" style="font-size:13px;">
          <span style="width:14px;height:14px;background:var(--warning);border-radius:4px;flex-shrink:0;"></span>
          <span class="muted">Secundario:</span>
          <span style="font-weight:500;">${secLabels.join(', ')}</span>
        </div>` : ''}
      </div>
    </div>` : ''}
    ${state.showAlts && (ex.alts && ex.alts.length) ? `<div class="card" style="margin-bottom:16px;background:var(--bg-elev-2);">
      <div style="font-size:13px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px;"><i class="ti ti-bulb" style="font-size:15px;color:var(--accent);"></i> Si la máquina está ocupada</div>
      <ul style="margin:0;padding:0;list-style:none;">${altsList}</ul>
    </div>` : ''}
    ${formHtml}
    <div class="section-label">Historial reciente</div>
    ${historyList}
    <button data-action="goCompareEx" style="margin-top:16px;width:100%;padding:13px;background:var(--bg-elev);border:1px solid var(--border);font-weight:500;">
        <i class="ti ti-chart-line" style="font-size:16px;vertical-align:-2px;color:var(--accent);"></i> Comparar Progreso
    </button>`;
  attach();
  attachSetHandlers();
}

// ====== COMPARE ======
function renderCompare(){
  const mode = state.compareMode;
  if (mode === 'day') return renderDaily(true);
  const focused = state.currentExerciseIdx != null ? { day: state.currentDay, idx: state.currentExerciseIdx } : null;

  const exerciseOptions = [`<option value="">Todos los ejercicios (volumen total)</option>`];
  for (const dk of getAllDayKeys()){
    const r = getRoutineForDay(dk);
    if (!r) continue;
    exerciseOptions.push(`<optgroup label="${esc(r.label)} - ${esc(r.focus)}">`);
    r.exercises.forEach((ex,idx)=>{
      const val = dk+':'+idx;
      const sel = focused && focused.day===dk && focused.idx===idx ? ' selected' : '';
      exerciseOptions.push(`<option value="${val}"${sel}>${esc(ex.name)}</option>`);
    });
    exerciseOptions.push(`</optgroup>`);
  }

  function getExerciseStats(exKey){
    return state.users.map(u => ({ user:u, buckets: bucketEntries(getEntries(u.id, exKey), mode) }));
  }

  let content = '';
  if (focused){
    const ek = exerciseKey(focused.day, focused.idx);
    const r = getRoutineForDay(focused.day);
    const ex = r ? r.exercises[focused.idx] : null;
    if (ex){
      const stats = getExerciseStats(ek);
      const maxW = Math.max(1, ...stats.flatMap(s=>s.buckets.map(b=>b.maxWeight)));
      const allKeys = Array.from(new Set(stats.flatMap(s=>s.buckets.map(b=>b.key)))).sort();
      content = `<div class="card" style="margin-bottom:16px;">
        <div style="font-size:16px;font-weight:600;margin-bottom:4px;">${esc(ex.name)}</div>
        <div class="muted" style="font-size:12px;margin-bottom:18px;">Peso máximo · ${mode==='week'?'semanal':mode==='month'?'mensual':'anual'}</div>
        ${renderBarChart(stats, allKeys, maxW, false)}
      </div>
      ${stats.map(s => renderUserStatCard(s)).join('')}`;
    }
  } else {
    const byUser = state.users.map(u => {
      const ul = state.logs[u.id] || {};
      const all = []; for (const k in ul) for (const e of ul[k]) all.push(e);
      return { user:u, buckets: bucketEntries(all, mode), totalSessions: all.length };
    });
    const maxV = Math.max(1, ...byUser.flatMap(s=>s.buckets.map(b=>b.totalVolume)));
    const allKeys = Array.from(new Set(byUser.flatMap(s=>s.buckets.map(b=>b.key)))).sort();
    content = `<div class="card" style="margin-bottom:16px;">
      <div style="font-size:16px;font-weight:600;margin-bottom:4px;">Volumen total</div>
      <div class="muted" style="font-size:12px;margin-bottom:18px;">Reps × peso · ${mode==='week'?'semanal':mode==='month'?'mensual':'anual'}</div>
      ${renderBarChart(byUser.map(b=>({...b, buckets: b.buckets.map(x=>({...x, maxWeight: x.totalVolume}))})), allKeys, maxV, true)}
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;">
      ${byUser.map(s => `<div class="stat-card">
        <div class="row" style="margin-bottom:8px;">
          <span class="dot" style="background:${s.user.color};width:14px;height:14px;border:2px solid var(--bg-elev);box-shadow:0 0 0 1px ${s.user.color};"></span>
          <div style="font-size:13px;font-weight:500;">${esc(s.user.name)}</div>
        </div>
        <div class="stat-label">Sesiones totales</div>
        <div class="stat-value" style="color:${s.user.color};">${s.totalSessions}</div>
      </div>`).join('')}
    </div>`;
  }

  root.innerHTML = `
    ${headerBar('Progreso', 'goHome')}
    <div class="tab-bar">
      ${['day','week','month','year'].map(m => `<button class="${mode===m?'active':''}" data-action="setMode" data-mode="${m}">${m==='day'?'Día':m==='week'?'Semana':m==='month'?'Mes':'Año'}</button>`).join('')}
    </div>
    <select id="exPicker" style="margin-bottom:18px;">${exerciseOptions.join('')}</select>
    ${content}`;
  attach();
  const picker = document.getElementById('exPicker');
  if (picker) picker.addEventListener('change', e => {
    const v = e.target.value;
    if (!v){ state.currentDay = null; state.currentExerciseIdx = null; }
    else { const [d,i] = v.split(':'); state.currentDay = d; state.currentExerciseIdx = Number(i); }
    render();
  });
}

function renderBarChart(stats, allKeys, maxVal, isVolume){
  if (!allKeys.length){
    return `<div style="padding:40px 20px;text-align:center;">
      <i class="ti ti-chart-bar-off" style="font-size:36px;color:var(--text-dim);display:block;margin-bottom:8px;"></i>
      <div class="muted" style="font-size:13px;">Sin datos registrados todavía.</div>
    </div>`;
  }
  const numUsers = Math.max(1, stats.length);
  const cH = 180;
  const lH = 32;
  const padL = 32;
  const padR = 10;
  const padT = 24;
  // Compute layout
  const innerW = Math.max(280, allKeys.length * 70);
  const groupW = innerW / allKeys.length;
  const barW = Math.min(36, (groupW - 16) / numUsers);
  const sW = innerW + padL + padR;

  // Y axis gridlines
  const gridLines = [0, 0.25, 0.5, 0.75, 1].map(p => {
    const y = padT + (cH - padT) * (1 - p);
    return `<line x1="${padL}" y1="${y}" x2="${sW - padR}" y2="${y}" stroke="var(--border)" stroke-dasharray="2 4"/>
      <text x="${padL - 6}" y="${y + 3}" text-anchor="end" class="chart-label">${isVolume ? Math.round(maxVal * p) : Math.round(maxVal * p)}</text>`;
  }).join('');

  // Defs for gradients per user
  const defs = stats.map((s, i) => {
    const color = s.user.color;
    return `<linearGradient id="grad-${i}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity="1"/>
      <stop offset="100%" stop-color="${color}" stop-opacity="0.5"/>
    </linearGradient>`;
  }).join('');

  // Bars
  const bars = [];
  allKeys.forEach((k, gi) => {
    const groupX = padL + gi * groupW + (groupW - barW * numUsers) / 2;
    stats.forEach((s, ui) => {
      const b = s.buckets.find(x => x.key === k);
      const val = b ? b.maxWeight : 0;
      const h = Math.max(0, Math.round((val / maxVal) * (cH - padT - 4)));
      const x = groupX + ui * barW;
      const y = padT + (cH - padT - 4) - h;
      bars.push(`<g>
        ${val > 0 ? `<rect class="chart-bar-rect" x="${x + 1}" y="${y}" width="${barW - 2}" height="${h}" fill="url(#grad-${ui})" rx="3"></rect>
        <text x="${x + barW/2}" y="${y - 5}" text-anchor="middle" class="chart-label" style="fill:${s.user.color};font-weight:500;">${isVolume ? Math.round(val) : val}</text>` : ''}
      </g>`);
    });
    // X axis label
    const lx = padL + gi * groupW + groupW / 2;
    bars.push(`<text x="${lx}" y="${cH + 18}" text-anchor="middle" class="chart-label">${formatBucket(k, state.compareMode)}</text>`);
  });

  const legend = stats.map(s => `<div style="display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted);">
    <span style="width:12px;height:12px;border-radius:3px;background:linear-gradient(180deg, ${s.user.color}, ${s.user.color}88);"></span>${esc(s.user.name)}
  </div>`).join('');

  return `<div style="overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;">
    <svg viewBox="0 0 ${sW} ${cH + lH}" width="${Math.max(sW, 320)}" height="${cH + lH}" style="display:block;min-width:100%;">
      <defs>${defs}</defs>
      ${gridLines}
      ${bars.join('')}
    </svg>
  </div>
  <div style="display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--border);">${legend}</div>`;
}

function renderUserStatCard(s){
  if (!s.buckets.length){
    return `<div class="stat-card" style="margin-bottom:8px;">
      <div class="row">
        <span class="dot" style="background:${s.user.color};"></span>
        <div style="font-size:14px;font-weight:500;">${esc(s.user.name)}</div>
        <div class="spacer"></div>
        <div class="muted" style="font-size:12px;">Sin registros</div>
      </div>
    </div>`;
  }
  const f = s.buckets[0]; const l = s.buckets[s.buckets.length-1];
  const diff = l.maxWeight - f.maxWeight;
  const pct = f.maxWeight ? Math.round((diff/f.maxWeight)*100) : 0;
  const arrowColor = diff>0 ? 'var(--success)' : diff<0 ? 'var(--warning)' : 'var(--text-muted)';
  const arrow = diff>0 ? '<i class="ti ti-trending-up"></i>' : diff<0 ? '<i class="ti ti-trending-down"></i>' : '<i class="ti ti-minus"></i>';
  return `<div class="stat-card" style="margin-bottom:10px;">
    <div class="row" style="margin-bottom:14px;">
      <span class="dot" style="background:${s.user.color};width:14px;height:14px;border:2px solid var(--bg-elev);box-shadow:0 0 0 1px ${s.user.color};"></span>
      <div style="font-size:14px;font-weight:500;">${esc(s.user.name)}</div>
      <div class="spacer"></div>
      <div style="display:flex;align-items:center;gap:6px;font-size:13px;color:${arrowColor};font-weight:500;">${arrow}<span class="mono">${diff>=0?'+':''}${diff} lb (${pct>=0?'+':''}${pct}%)</span></div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;">
      <div><div class="stat-label" style="margin-bottom:4px;">Primer</div><div class="stat-value" style="font-size:18px;">${f.maxWeight}<span style="font-size:11px;color:var(--text-dim);margin-left:3px;">lb</span></div></div>
      <div><div class="stat-label" style="margin-bottom:4px;">Último</div><div class="stat-value" style="font-size:18px;color:${s.user.color};">${l.maxWeight}<span style="font-size:11px;color:var(--text-dim);margin-left:3px;">lb</span></div></div>
      <div><div class="stat-label" style="margin-bottom:4px;">Sesiones</div><div class="stat-value" style="font-size:18px;">${s.buckets.reduce((x,b)=>x+b.sessions,0)}</div></div>
    </div>
  </div>`;
}
function formatBucket(key, mode){
  if (mode==='week'){ const d = new Date(key); return d.toLocaleDateString('es', {month:'short', day:'numeric'}); }
  if (mode==='month'){ const [y,m] = key.split('-'); return new Date(Number(y), Number(m)-1, 1).toLocaleDateString('es', {month:'short', year:'2-digit'}); }
  return key;
}

// ====== DAILY PROGRESS ======
function renderDaily(insideProgress = false){
  const rows = [];
  for (const u of state.users){
    const userLogs = state.logs[u.id] || {};
    for (const ek in userLogs){
      for (const entry of userLogs[ek] || []){
        if (entry.date === state.dailyDate){
          const best = bestSet(entry);
          rows.push({ user:u, ek, entry, best, volume: totalVolume(entry) });
        }
      }
    }
  }
  rows.sort((a,b)=> a.user.name.localeCompare(b.user.name) || exerciseNameForKey(a.ek).localeCompare(exerciseNameForKey(b.ek)));
  const totals = rows.reduce((acc,r)=>{
    acc.sessions += 1;
    acc.sets += entrySetCount(r.entry);
    acc.volume += r.volume;
    acc.max = Math.max(acc.max, r.best ? setMaxWeight(r.best) : 0);
    return acc;
  }, { sessions:0, sets:0, volume:0, max:0 });
  const list = rows.map(r => {
    const mine = state.currentUser && r.user.id === state.currentUser;
    const measurement = r.entry.measurement || 'weight_reps';
    const setText = (r.entry.sets || []).map((set,i)=>formatSetLine(set, i, measurement)).join(' · ');
    const metricSummary = sessionMetricSummary(r.entry, r.best, r.volume, measurement);
    return `<div class="history-entry">
      <div class="row" style="align-items:flex-start;">
        <span class="dot" style="background:${r.user.color};width:14px;height:14px;margin-top:3px;"></span>
        <div style="flex:1;min-width:0;">
          <div style="font-size:13px;font-weight:600;">${esc(r.user.name)} · ${esc(exerciseNameForKey(r.ek))}</div>
          <div class="muted mono" style="font-size:11px;margin-top:2px;">${esc(metricSummary)}</div>
          <div class="dim wrap-text" style="font-size:11px;margin-top:6px;">${esc(setText)}</div>
          ${r.entry.note ? `<div class="wrap-text" style="margin-top:7px;padding:7px 10px;background:var(--bg-elev);border-radius:8px;font-size:12px;color:var(--text-muted);font-style:italic;"><i class="ti ti-message" style="font-size:12px;"></i> ${esc(r.entry.note)}</div>` : ''}
        </div>
        ${mine ? `<div style="display:flex;gap:4px;">
          <button data-action="editSession" data-uid="${r.user.id}" data-ek="${r.ek}" data-date="${r.entry.date}" aria-label="Editar" style="padding:6px;border-color:var(--border);"><i class="ti ti-edit" style="font-size:14px;color:var(--accent);"></i></button>
          <button data-action="deleteSession" data-uid="${r.user.id}" data-ek="${r.ek}" data-date="${r.entry.date}" aria-label="Eliminar" style="padding:6px;border:none;color:var(--danger);"><i class="ti ti-trash" style="font-size:14px;"></i></button>
        </div>` : ''}
      </div>
    </div>`;
  }).join('');

  root.innerHTML = `
    ${headerBar(insideProgress ? 'Progreso' : 'Progreso diario', 'goHome')}
    ${insideProgress ? `<div class="tab-bar">
      ${['day','week','month','year'].map(m => `<button class="${state.compareMode===m?'active':''}" data-action="setMode" data-mode="${m}">${m==='day'?'Día':m==='week'?'Semana':m==='month'?'Mes':'Año'}</button>`).join('')}
    </div>` : ''}
    <div class="card" style="margin-bottom:16px;">
      <label class="section-label" style="margin-bottom:6px;">Fecha</label>
      <input id="dailyDate" class="date-field" type="date" value="${esc(state.dailyDate)}" />
    </div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px;">
      <div class="stat-card"><div class="stat-label">Sesiones</div><div class="stat-value" style="font-size:18px;">${totals.sessions}</div></div>
      <div class="stat-card"><div class="stat-label">Sets</div><div class="stat-value" style="font-size:18px;">${totals.sets}</div></div>
      <div class="stat-card"><div class="stat-label">Volumen</div><div class="stat-value" style="font-size:18px;">${Math.round(totals.volume)}</div></div>
      <div class="stat-card"><div class="stat-label">Max</div><div class="stat-value" style="font-size:18px;">${totals.max}<span style="font-size:10px;color:var(--text-dim);">lb</span></div></div>
    </div>

    ${list || '<div class="card" style="text-align:center;padding:24px;color:var(--text-muted);font-size:13px;">No hay sesiones guardadas en esta fecha.</div>'}`;
  attach();

// ====== EXERCISE EXPLORER (Sesión 1) ======
function renderExerciseExplorer(){
  function buildResults(){
    const q = state.exQuery || '';
    const f = state.exFilters || {};
    const results = searchExercises(q, f);
    const total = results.length;
    const shown = results.slice(0, 80);
    const byGroup = {};
    shown.forEach(ex => {
      const g = ex.g || 'Otros';
      if (!byGroup[g]) byGroup[g] = [];
      byGroup[g].push(ex);
    });
    const groupLabel = q ? findMuscleGroup(q) : null;
    const headerNote = groupLabel
      ? `<div class="banner banner-info" style="margin-bottom:14px;"><i class="ti ti-info-circle"></i><div>Mostrando ejercicios que trabajan <strong>${esc(groupLabel.label)}</strong>, ordenados por intensidad muscular.</div></div>`
      : '';
    const resultsHtml = shown.length === 0 ? `
      <div class="card" style="padding:40px 20px;text-align:center;">
        <i class="ti ti-search-off" style="font-size:36px;color:var(--text-dim);display:block;margin-bottom:8px;"></i>
        <div class="muted">Sin resultados. Probá con otro término o quitá filtros.</div>
      </div>`
      : Object.entries(byGroup).map(([group, exs]) => `
        <div class="section-label" style="margin-top:18px;">${esc(group)} <span style="opacity:0.5;font-weight:400;">(${exs.length})</span></div>
        ${exs.map(ex => renderExerciseCard(ex)).join('')}
      `).join('');
    const footer = total > shown.length ? `<div class="muted" style="text-align:center;font-size:12px;margin-top:12px;">Mostrando ${shown.length} de ${total}. Refiná tu búsqueda para ver más.</div>` : '';
    return { html: headerNote + resultsHtml + footer, total };
  }

  function updateResultsOnly(){
    const r = buildResults();
    const el = document.getElementById('exResults');
    if (el) el.innerHTML = r.html;
    const counter = document.getElementById('exCounter');
    if (counter) counter.textContent = `${r.total} ejercicios disponibles`;
    // Re-attach handlers for newly rendered exercise cards
    el.querySelectorAll('[data-action]').forEach(b => b.addEventListener('click', handle));
  }

  const q = state.exQuery || '';
  const f = state.exFilters || {};
  const r = buildResults();

  const filterPills = `
    <div class="row" style="gap:8px;flex-wrap:wrap;margin-bottom:14px;">
      ${['','fuerza','cardio','movilidad'].map(c => `
        <button class="${(f.category||'') === c ? 'primary' : ''} small" data-action="exFilter" data-filter="category" data-val="${c}" style="font-size:12px;padding:5px 11px;">
          ${c ? (c==='fuerza'?'Fuerza':c==='cardio'?'Cardio':'Movilidad') : 'Todo'}
        </button>`).join('')}
      <span style="border-left:1px solid var(--border);margin:0 4px;"></span>
      ${['','S','A','B'].map(t => `
        <button class="${(f.tier||'') === t ? 'primary' : ''} small" data-action="exFilter" data-filter="tier" data-val="${t}" style="font-size:12px;padding:5px 11px;">
          ${t ? 'Tier '+t : 'Cualquier tier'}

    </div>`;

  root.innerHTML = `
    ${headerBar('Explorar Ejercicios', 'goSettings')}
    <div class="card" style="margin-bottom:14px;padding:12px;">
      <input id="exSearch" type="text" placeholder="Buscar por nombre, músculo o grupo..." value="${esc(q)}" style="width:100%;margin-bottom:10px;" />
      ${filterPills}
      <div class="muted" style="font-size:12px;">
        <i class="ti ti-database" style="font-size:13px;vertical-align:-1px;color:var(--accent);"></i>
        <span id="exCounter">${r.total} ejercicios disponibles</span> · <a data-action="goHowRatingWorks" style="color:var(--accent);cursor:pointer;text-decoration:underline;">¿Cómo funciona el rating?</a>
      </div>
    </div>
    <div id="exResults">${r.html}</div>`;
  attach();
  const inp = document.getElementById('exSearch');
  if (inp){
    inp.focus();
    inp.setSelectionRange(inp.value.length, inp.value.length);
    let timer;
    inp.addEventListener('input', e => {
      state.exQuery = e.target.value;
      clearTimeout(timer);
      timer = setTimeout(updateResultsOnly, 180);
    });
  }
}

function renderExerciseDetail(){

  }

  const primary = Object.entries(ex.sv||{}).filter(([k,v]) => v >= 70).sort((a,b) => b[1]-a[1]);
  const secondary = Object.entries(ex.sv||{}).filter(([k,v]) => v >= 40 && v < 70).sort((a,b) => b[1]-a[1]);

  const muscleBars = [...primary, ...secondary].map(([id, score]) => {
    const label = MUSCLES[id]?.label || id;
    const color = score >= 80 ? '#f87171' : score >= 60 ? '#fb923c' : score >= 40 ? '#fbbf24' : '#22d3a3';
    return `<div style="margin-bottom:6px;">

      </div>

  const measurementLabel = ex.m === 'time' ? '⏱️ Tiempo' : ex.m === 'reps_only' ? '🔢 Solo reps' : '🏋️ Peso × Reps';

  const backAction = state.exReturnView === 'day' ? 'exDetailBackToDay' :

  // Image hooks — Sesión 3. Si el ejercicio del DB tiene media (en el futuro), mostrar arriba.

    <div class="card" style="margin-bottom:14px;padding:0;overflow:hidden;">

    </div>` : '';

  root.innerHTML = `
    ${headerBar(ex.n, backAction)}
    ${mainImageBlock}
    <div class="card" style="margin-bottom:14px;">
      <div class="row" style="gap:12px;margin-bottom:14px;">
        <div style="display:flex;align-items:center;justify-content:center;width:60px;height:60px;border-radius:14px;background:${tinfo.color}22;color:${tinfo.color};font-weight:700;font-family:var(--font-mono);font-size:24px;flex-shrink:0;">${ex.t}</div>
        <div style="flex:1;min-width:0;">
          <div style="font-size:13px;color:var(--text-muted);">${esc(tinfo.label)}</div>
          <div style="font-size:13px;color:var(--text-muted);margin-top:4px;">${esc(ex.g||'')}${ex.eq?' · '+esc(ex.eq):''}</div>
        </div>
        <div style="text-align:right;">
          <div class="mono" style="font-size:24px;font-weight:700;">${ex.s||'—'}</div>
          <div style="font-size:10px;color:var(--text-dim);font-family:var(--font-mono);">SCORE</div>
        </div>
      </div>
      <div class="row" style="gap:6px;flex-wrap:wrap;font-size:11px;">
        <span class="pill" style="font-size:10px;">${measurementLabel}</span>
        ${ex.co ? '<span class="pill" style="font-size:10px;">Compuesto</span>' : '<span class="pill" style="font-size:10px;">Aislado</span>'}
        ${ex.u ? '<span class="pill" style="font-size:10px;">Unilateral</span>' : ''}
        <span class="pill" style="font-size:10px;">${esc(ex.lv||'todos')}</span>
      </div>
    </div>
    ${(() => { const tip = buildExerciseTooltip(ex); return tip ? `<div class="banner banner-info" style="margin-bottom:14px;"><i class="ti ti-info-circle"></i><div>${esc(tip)}</div></div>` : ''; })()}
    <div class="card" style="margin-bottom:14px;">
      <div class="section-label" style="margin-bottom:10px;">Músculos trabajados</div>
      ${muscleBars || '<div class="muted" style="font-size:13px;">Sin datos de músculos.</div>'}
    </div>
    ${state.exAddToDay ? `
      <button class="primary" data-action="addExerciseToDay" style="width:100%;padding:14px;margin-bottom:10px;font-weight:600;">
        <i class="ti ti-plus" style="font-size:15px;vertical-align:-2px;"></i> Agregar a ${esc(getDayLabel(state.exAddToDay))}

    ` : ''}
    <a href="${videoUrl}" target="_blank" rel="noopener" style="display:block;text-decoration:none;">
      <button style="width:100%;padding:12px;background:var(--bg-elev);border:1px solid var(--border);">
        <i class="ti ti-brand-youtube" style="color:#ff0033;font-size:16px;vertical-align:-2px;"></i>
        Ver técnica en YouTube
      </button>
    </a>
    ${(() => {
      const isLowTier = ex.t === 'D' || ex.t === 'F';
      if (!isLowTier) {
        return similars.length ? `
          <div class="section-label" style="margin-top:24px;">Ejercicios similares</div>
          ${similars.map(s => renderExerciseCard(s)).join('')}
        ` : '';
      }
      // Para D y F tier: mostrar alternativas MEJORES (S/A/B tier) que trabajen lo mismo
      const betterAlts = similars.filter(s => ['S','A','B'].includes(s.t)).slice(0, 3);
      const otherSimilars = similars.filter(s => !['S','A','B'].includes(s.t)).slice(0, 3);
      let out = '';
      if (betterAlts.length){
        out += `
          <div class="section-label" style="margin-top:24px;color:var(--accent);">💡 Alternativas mejor calificadas</div>
          <div class="muted" style="font-size:12px;margin-bottom:10px;">Trabajan los mismos músculos con mejor estímulo o resistance profile.</div>
          ${betterAlts.map(s => renderExerciseCard(s)).join('')}
        `;
      }
      if (otherSimilars.length){
        out += `
          <div class="section-label" style="margin-top:18px;">Otros similares</div>
          ${otherSimilars.map(s => renderExerciseCard(s)).join('')}
        `;
      }
      return out;
    })()}`;
  attach();
}

function renderLibrary(){
  const view = state.libraryView || 'shared';
  const lib = view === 'shared' ? (state.library || {}) : (state.personalLibrary || {});
  const routines = Object.values(lib).sort((a,b) => {
    const ai = DAY_ORDER.indexOf(a.originDay);
    const bi = DAY_ORDER.indexOf(b.originDay);
    if (ai !== -1 || bi !== -1){
      if (ai === -1) return 1;
      if (bi === -1) return -1;
      return ai - bi;
    }
    return (a.createdAt || 0) - (b.createdAt || 0) || (a.name || '').localeCompare(b.name || '');
  });
  const canEdit = view === 'personal' || isAdmin();
  const me = getMe();

  const cards = routines.map(r => {
    const exCount = (r.exercises || []).length;
    const muscles = [...new Set((r.exercises || []).flatMap(e => e.primary || []))].slice(0, 3).map(m => MUSCLES[m]?.label).filter(Boolean).join(' · ');
    return `<button class="day-card fade-in" data-action="openLibraryRoutine" data-rid="${esc(r.id)}" style="text-align:left;">
      <div class="row" style="position:relative;z-index:1;">
        <div class="icon-tile">
          <i class="ti ${r.icon || 'ti-barbell'}" style="font-size:20px;"></i>
        </div>
        <div style="min-width:0;flex:1;">
          <div style="font-size:15px;font-weight:600;">${esc(r.name)}</div>
          <div class="muted" style="font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px;">
            ${exCount} ejercicio${exCount===1?'':'s'}${muscles ? ' · '+esc(muscles) : ''}
          </div>
        </div>
        <i class="ti ti-chevron-right" style="font-size:18px;color:var(--text-dim);"></i>
      </div>
    </button>`;
  }).join('');

  const empty = routines.length === 0 ? `
    <div class="card" style="padding:40px 20px;text-align:center;">
      <i class="ti ti-book-off" style="font-size:36px;color:var(--text-dim);display:block;margin-bottom:8px;"></i>
      <div class="muted" style="font-size:13px;">
        ${view === 'shared' ? 'No hay rutinas compartidas todavía.' : 'No tienes rutinas personales aún.'}
      </div>
      ${canEdit ? `<button class="primary" data-action="createLibraryRoutine" style="margin-top:14px;">
        <i class="ti ti-plus" style="font-size:14px;vertical-align:-2px;"></i> Crear primera rutina
      </button>` : ''}
    </div>` : '';

  root.innerHTML = `
    ${headerBar('Biblioteca de Rutinas', 'goSettings')}
    <div class="banner banner-info" style="margin-bottom:16px;">
      <i class="ti ti-info-circle"></i>
      <div>Esta es tu nueva biblioteca de rutinas (Fase 1). Por ahora puedes verlas y editarlas. En Fase 2 podrás asignarlas a los días de la semana.</div>
    </div>
    <div class="tab-bar">
      <button class="${view==='shared'?'active':''}" data-action="libView" data-v="shared">
        <i class="ti ti-users" style="font-size:13px;vertical-align:-1px;"></i> Del grupo (${Object.keys(state.library||{}).length})
      </button>
      <button class="${view==='personal'?'active':''}" data-action="libView" data-v="personal">
        <i class="ti ti-user" style="font-size:13px;vertical-align:-1px;"></i> Mis personales (${Object.keys(state.personalLibrary||{}).length})
      </button>
    </div>
    ${empty}
    ${cards}
    ${canEdit && routines.length > 0 ? `
      <button data-action="createLibraryRoutine" style="margin-top:14px;width:100%;padding:14px;border-style:dashed;color:var(--text-muted);">
        <i class="ti ti-plus" style="font-size:14px;vertical-align:-2px;"></i> Crear nueva rutina

function renderEditRoutine(){
  const dayKey = state.currentDay;
  const src = getCurrentSource(dayKey);
  let routine;
  if (src === 'personal'){
    const pr = state.personalRoutines[state.currentUser] || {};
    routine = pr[dayKey];
    if (!routine){
      const shared = state.sharedRoutine && state.sharedRoutine[dayKey];
      routine = shared ? JSON.parse(JSON.stringify(shared)) : { label: 'Nuevo día', focus: '', icon:'ti-barbell', exercises: [] };
    }
  } else {
    routine = state.sharedRoutine && state.sharedRoutine[dayKey];
    if (!routine) routine = { label: 'Nuevo día', focus: '', icon:'ti-barbell', exercises: [] };

// ====== EVENTS ======
function attach(){
  root.querySelectorAll('[data-action]').forEach(el => el.addEventListener('click', handle));
}
function attachSetHandlers(){
  document.querySelectorAll('.del-set').forEach(b => b.addEventListener('click', e => e.target.closest('.set-row').remove()));
  document.querySelectorAll('.set-unilateral').forEach(b => b.addEventListener('change', e => setRowUnilateral(e.target.closest('.set-row'), e.target.checked)));
  document.querySelectorAll('.set-drop').forEach(b => b.addEventListener('change', e => setRowDrop(e.target.closest('.set-row'), e.target.checked)));
  document.querySelectorAll('.add-drop').forEach(b => b.addEventListener('click', e => addDropRow(e.target.closest('.set-row'))));
  document.querySelectorAll('.del-drop').forEach(b => b.addEventListener('click', e => e.target.closest('.drop-row')?.remove()));
}
function setRowUnilateral(row, on){
  if (!row) return;
  if (row.dataset.measurement === 'time') return;
  const normal = row.querySelector('.normal-fields');
  const uni = row.querySelector('.unilateral-fields');
  if (normal) normal.style.display = on ? 'none' : 'grid';
  if (uni) uni.style.display = on ? 'grid' : 'none';
  row.querySelectorAll('.drop-normal-fields').forEach(el => { el.style.display = on ? 'none' : 'grid'; });
  row.querySelectorAll('.drop-unilateral-fields').forEach(el => { el.style.display = on ? 'grid' : 'none'; });
  const cb = row.querySelector('.set-unilateral');
  if (cb) cb.checked = !!on;
  if (on){
    const reps = row.querySelector('.reps-in')?.value || '';
    const weight = row.querySelector('.weight-in')?.value || '';
    ['left','right'].forEach(side => {
      const repsIn = row.querySelector(`.${side}-reps-in`);
      const weightIn = row.querySelector(`.${side}-weight-in`);
      if (repsIn && !repsIn.value) repsIn.value = reps;
      if (weightIn && !weightIn.value) weightIn.value = weight;
    });
  } else {
    const reps = row.querySelector('.left-reps-in')?.value || row.querySelector('.right-reps-in')?.value || '';
    const weight = row.querySelector('.left-weight-in')?.value || row.querySelector('.right-weight-in')?.value || '';
    const repsIn = row.querySelector('.reps-in');
    const weightIn = row.querySelector('.weight-in');
    if (repsIn && !repsIn.value) repsIn.value = reps;
    if (weightIn && !weightIn.value) weightIn.value = weight;
  }
}
function setRowDrop(row, on){
  if (!row) return;
  const container = row.querySelector('.drops-container');
  const addBtn = row.querySelector('.add-drop');
  if (container) container.style.display = on ? 'block' : 'none';
  if (addBtn) addBtn.style.display = on ? 'inline-flex' : 'none';
  const cb = row.querySelector('.set-drop');
  if (cb) cb.checked = !!on;
  if (on && container && !container.querySelector('.drop-row')) addDropRow(row);
}
function addDropRow(row, seed = null){
  if (!row) return;
  const container = row.querySelector('.drops-container');
  if (!container) return;
  const measurement = row.dataset.measurement || 'weight_reps';
  const isUnilateral = !!row.querySelector('.set-unilateral')?.checked;
  const idx = container.querySelectorAll('.drop-row').length;
  container.insertAdjacentHTML('beforeend', renderDropRow(seed, idx, isUnilateral, measurement));
  const added = container.lastElementChild;
  added?.querySelectorAll('.del-drop').forEach(b => b.addEventListener('click', e => e.target.closest('.drop-row')?.remove()));
}
function readDropRows(row, rowUnilateral, measurement){
  if (measurement === 'time') return [];
  return Array.from(row.querySelectorAll('.drop-row')).map(dropRow => {
    if (rowUnilateral){
      const left = {
        reps: Number(dropRow.querySelector('.drop-left-reps-in')?.value || 0),
        weight: measurement === 'reps_only' ? 0 : Number(dropRow.querySelector('.drop-left-weight-in')?.value || 0)
      };
      const right = {
        reps: Number(dropRow.querySelector('.drop-right-reps-in')?.value || 0),
        weight: measurement === 'reps_only' ? 0 : Number(dropRow.querySelector('.drop-right-weight-in')?.value || 0)
      };
      if (left.reps > 0 && !(right.reps > 0)){ right.reps = left.reps; right.weight = left.weight; }
      if (right.reps > 0 && !(left.reps > 0)){ left.reps = right.reps; left.weight = right.weight; }
      return { unilateral:true, left, right, reps:setDisplayReps({unilateral:true,left,right}), weight:setMaxWeight({unilateral:true,left,right}) };
    }
    const reps = Number(dropRow.querySelector('.drop-reps-in')?.value || 0);
    const weight = measurement === 'reps_only' ? 0 : Number(dropRow.querySelector('.drop-weight-in')?.value || 0);
    return measurement === 'reps_only' ? { reps } : { reps, weight };
  }).filter(drop => {
    if (drop.unilateral) return (drop.left?.reps > 0) || (drop.right?.reps > 0);
    return Number(drop.reps) > 0 && (measurement === 'reps_only' || Number(drop.weight) >= 0);
  });
}
function setDraftFromRow(row, measurement){
  if (!row) return null;
  if (measurement === 'time'){
    const minutes = Number(row.querySelector('.time-min-in')?.value || 0);
    const seconds = Number(row.querySelector('.time-sec-in')?.value || 0);
    return { durationSeconds: minutes * 60 + seconds };
  }
  const rowUnilateral = !!row.querySelector('.set-unilateral')?.checked;
  let draft;
  if (rowUnilateral){
    const left = {
      reps: row.querySelector('.left-reps-in')?.value || '',
      weight: measurement === 'reps_only' ? 0 : (row.querySelector('.left-weight-in')?.value || '')
    };
    const right = {
      reps: row.querySelector('.right-reps-in')?.value || '',
      weight: measurement === 'reps_only' ? 0 : (row.querySelector('.right-weight-in')?.value || '')
    };
    draft = { unilateral:true, left, right };
  } else {
    draft = {
      reps: row.querySelector('.reps-in')?.value || '',
      weight: measurement === 'reps_only' ? 0 : (row.querySelector('.weight-in')?.value || '')
    };
  }
  const drops = readDropRows(row, rowUnilateral, measurement);
  if (drops.length) draft.drops = drops;
  return draft;
}
function renderCopiedDrops(row, sourceSet, measurement){
  if (!row || measurement === 'time') return;
  const drops = sourceSet?.drops || [];
  setRowDrop(row, drops.length > 0);
  if (!drops.length) return;
  const container = row.querySelector('.drops-container');
  if (!container) return;
  const isUnilateral = !!row.querySelector('.set-unilateral')?.checked;
  container.innerHTML = drops.map((drop, i) => renderDropRow(drop, i, isUnilateral, measurement)).join('');
  container.querySelectorAll('.del-drop').forEach(b => b.addEventListener('click', e => e.target.closest('.drop-row')?.remove()));
}

async function handle(e){
  const btn = e.currentTarget; const a = btn.dataset.action;

  // ====== Firebase Auth ======
  if (a === 'authEmailLogin' || a === 'authEmailSignup'){
    const email = (document.getElementById('authEmail')?.value || '').trim();
    const password = document.getElementById('authPassword')?.value || '';
    const errEl = document.getElementById('authError');
    if (!email){ errEl.textContent = 'Escribe tu email'; return; }
    if (password.length < 6){ errEl.textContent = 'La contraseña debe tener mínimo 6 caracteres'; return; }
    try {
      errEl.textContent = '';
      btn.disabled = true;
      btn.textContent = a === 'authEmailSignup' ? 'Creando...' : 'Entrando...';
      if (a === 'authEmailSignup'){
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        if (cred.user && !cred.user.displayName){
          await updateProfile(cred.user, { displayName: email.split('@')[0] });
        }
        await handleAuthState(cred.user);
        toast('Cuenta creada');
      } else {
        const cred = await signInWithEmailAndPassword(auth, email, password);
        await handleAuthState(cred.user);
        toast('Sesión iniciada');
      }
    } catch(err){
      console.error(err);
      const code = err.code || '';
      errEl.textContent = code.includes('email-already-in-use') ? 'Ese email ya tiene cuenta. Toca "Iniciar Sesión".' :
        code.includes('invalid-email') ? 'Escribe un email válido, no tu nombre del gym.' :
        code.includes('weak-password') ? 'La contraseña debe tener mínimo 6 caracteres.' :
        code.includes('invalid-credential') || code.includes('wrong-password') ? 'Email o contraseña incorrectos. Si es primera vez, toca "Crear Cuenta".' :
        code.includes('user-not-found') ? 'No encontré una cuenta con ese email. Toca "Crear Cuenta".' :
        code.includes('operation-not-allowed') ? 'Activa Email/Password en Firebase Auth.' :
        code.includes('configuration-not-found') ? 'Firebase Auth todavía no está activado en este proyecto.' :
        code.includes('unauthorized-domain') ? 'Agrega este dominio en Firebase Auth > Authorized domains.' :
        code.includes('network-request-failed') ? 'No hay conexión con Firebase. Revisa internet o bloqueadores.' :
        `No pude iniciar sesión (${code || 'error desconocido'}).`;
    } finally {
      btn.disabled = false;
      btn.textContent = a === 'authEmailSignup' ? 'Crear Cuenta' : 'Iniciar Sesión';
    }
    return;
  }
  if (a === 'authGoogle'){
    try {
      const provider = new GoogleAuthProvider();
      const cred = await signInWithPopup(auth, provider);
      await handleAuthState(cred.user);
      toast('Sesión iniciada');
    } catch(err){
      console.error(err);
      const code = err.code || '';
      toast(code.includes('operation-not-allowed') ? 'Activa Google en Firebase Auth' :
        code.includes('unauthorized-domain') ? 'Autoriza este dominio en Firebase' :
        code.includes('popup-blocked') ? 'El navegador bloqueó el popup de Google' :
        `No pude entrar con Google (${code || 'error'})`);
    }
    return;
  }
  if (a === 'authForgotPassword'){
    const emailInput = document.getElementById('authEmail');
    const errEl = document.getElementById('authError');
    const email = (emailInput?.value || '').trim();
    if (!email){
      if (errEl) errEl.textContent = 'Ingresa tu email arriba para enviarte el correo de recuperación.';
      emailInput?.focus();
      return;
    }
    if (!firebaseReady || !auth){
      toast('Firebase no está disponible');
      return;
    }
    try {
      btn.disabled = true;
      const original = btn.textContent;
      btn.textContent = 'Enviando...';
      await sendPasswordResetEmail(auth, email);
      if (errEl){
        errEl.style.color = 'var(--success)';
        errEl.textContent = `📧 Te enviamos un correo a ${email} con instrucciones.`;
        setTimeout(() => { if (errEl){ errEl.textContent = ''; errEl.style.color = 'var(--danger)'; } }, 8000);
      }
      toast('Correo de recuperación enviado', 'success');
      btn.disabled = false;
      btn.textContent = original;
    } catch(err){
      console.error(err);
      btn.disabled = false;
      btn.textContent = '¿Olvidaste tu contraseña?';
      const code = err.code || '';
      const msg = code.includes('user-not-found') ? 'No encontré una cuenta con ese email.' :
        code.includes('invalid-email') ? 'Email no válido.' :
        code.includes('too-many-requests') ? 'Demasiados intentos. Espera unos minutos.' :
        `No pude enviar el correo (${code || 'error'})`;
      if (errEl) errEl.textContent = msg;
    }
    return;
  }

  // ====== Setup / Auth ======
  if (a === 'newUser'){ state.setupStep = 'newUser'; render(); return; }
  if (a === 'backToPick'){ state.setupStep = state.users.length ? 'pickUser' : 'newUser'; render(); return; }
  if (a === 'loginByName'){
    const name = (document.getElementById('loginNameInput').value || '').trim();
    const errEl = document.getElementById('loginNameError');
    if (!name){ errEl.textContent = 'Escribe tu nombre'; return; }
    const matches = state.users.filter(u => u.name.toLowerCase().trim() === name.toLowerCase());
    if (!matches.length){ errEl.textContent = 'No encontré ese nombre en este grupo'; return; }
    if (matches.length > 1){ errEl.textContent = 'Hay más de una cuenta con ese nombre. Pide a la admin que renombre una.'; return; }
    state.pendingUserId = matches[0].id;
    state.setupStep = 'enterPin';
    render();
    return;
  }
  if (a === 'pickUser'){
    const uid = btn.dataset.uid;
    state.pendingUserId = uid;
    state.setupStep = 'enterPin';
    render();
    return;
  }
  if (a === 'submitPin'){
    const u = state.users.find(x => x.id === state.pendingUserId);
    const pin = document.getElementById('pinInput').value;
    const errEl = document.getElementById('pinError');
    if (!u) return;
    // Migration from v1: if user has no pinHash, treat this entry as SETTING their PIN
    if (!u.pinHash){
      if (pin.length < 4){ errEl.textContent = 'Crea un PIN de al menos 4 caracteres'; return; }
      u.pinHash = await sha(pin);
      await saveUsers(state.users);
      state.currentUser = u.id;
      try { await afterLogin(u.id); }
      catch(err){ errEl.textContent = err.message || 'No pude enlazar este usuario.'; state.currentUser = null; return; }
      state.view = 'home'; state.setupStep = null;
      toast('PIN creado. ¡Bienvenida! 💪');
      render(); return;
    }
    const hash = await sha(pin);
    if (hash === u.pinHash){
      state.currentUser = u.id;
      try { await afterLogin(u.id); }
      catch(err){ errEl.textContent = err.message || 'No pude enlazar este usuario.'; state.currentUser = null; return; }
      state.view = 'home'; state.setupStep = null;
      toast('Bienvenida 💪');
      render();
    } else {
      errEl.textContent = 'PIN incorrecto';
      document.getElementById('pinInput').value = '';
    }
    return;
  }
  if (a === 'viewOnlyMode'){
    state.currentUser = null; clearMe(); clearAuth();
    state.view = 'home'; state.setupStep = null;
    render(); return;
  }
  if (a === 'selectAccountGroup'){
    state.enteringGroup = true;
    await switchGroup(btn.dataset.group);
    return;
  }
  if (a === 'checkInvite'){
    const name = (document.getElementById('nameInput').value || '').trim();
    const inv = (document.getElementById('invInput').value || '').trim();
    const errEl = document.getElementById('invError');
    if (!name){ errEl.textContent = 'Ingresa tu nombre'; return; }
    if (name.length < 2){ errEl.textContent = 'Nombre muy corto'; return; }
    if (state.users.some(u => u.name.toLowerCase().trim() === name.toLowerCase().trim())){
      errEl.textContent = 'Ese nombre ya está en uso'; return;
    }
    const expected = state.invitationPassword || INVITATION_PASSWORD_DEFAULT;
    if (inv !== expected){ errEl.textContent = 'Contraseña de invitación incorrecta'; return; }
    state.pendingNewName = name;
    state.setupStep = 'newUserPin';
    render();
    return;
  }
  if (a === 'finalizeUser'){
    const p1 = document.getElementById('newPin').value;
    const p2 = document.getElementById('newPin2').value;
    const errEl = document.getElementById('pinError2');
    if (p1.length < 4){ errEl.textContent = 'El PIN debe tener al menos 4 caracteres'; return; }
    if (p1 !== p2){ errEl.textContent = 'Los PINs no coinciden'; return; }
    const id = 'u_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
    const color = userColor(state.users.length);
    const pinHash = await sha(p1);
    const user = { id, name: state.pendingNewName, color, pinHash, createdAt: Date.now() };
    if (groupPath() !== DEFAULT_GROUP) user.joinedAt = Date.now();
    state.users.push(user);
    await saveUsers(state.users);
    state.currentUser = id;
    try { await afterLogin(id); }
    catch(err){ errEl.textContent = err.message || 'No pude enlazar este usuario.'; state.currentUser = null; return; }
    state.view = 'home'; state.setupStep = null;
    state.pendingNewName = null;
    toast('¡Cuenta creada!');
    render();
    return;
  }

  // ====== Groups ======
  if (a === 'groupMenu'){
    closeModal();
    const canShowGroups = !!state.currentUser;
    const groups = canShowGroups ? visibleAccountGroups().map(g => `
      <button data-action="switchGroup" data-group="${esc(g)}" style="width:100%;padding:12px;display:flex;align-items:center;gap:10px;background:${g===groupPath()?'var(--accent-bg)':'transparent'};border:none;text-align:left;border-radius:8px;">
        <i class="ti ${g===groupPath()?'ti-circle-check':'ti-circle'}" style="font-size:17px;color:${g===groupPath()?'var(--accent)':'var(--text-dim)'};"></i>
