<style>
:root {
  --bg:#0a0e1a;
  --bg-grad: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(59,158,255,0.15), transparent 70%), #0a0e1a;
  --bg-elev:#10172a;
  --bg-elev-2:#1a2440;
  --bg-elev-3:#243156;
  --border:rgba(255,255,255,0.06);
  --border-strong:rgba(255,255,255,0.12);
  --border-accent:rgba(59,158,255,0.3);
  --text:#f0f4ff;
  --text-muted:#8b96b3;
  --text-dim:#5a6585;
  --accent:#3b9eff;
  --accent-hover:#5cb0ff;
  --accent-glow:rgba(59,158,255,0.35);
  --accent-bg:rgba(59,158,255,0.12);
  --accent-bg-strong:rgba(59,158,255,0.2);
  --accent-border:rgba(59,158,255,0.4);
  --accent-grad: linear-gradient(135deg, #3b9eff 0%, #6ec2ff 100%);
  --accent-grad-soft: linear-gradient(135deg, rgba(59,158,255,0.15), rgba(110,194,255,0.05));
  --success:#34d399;
  --success-bg:rgba(52,211,153,0.12);
  --warning:#fbbf24;
  --warning-bg:rgba(251,191,36,0.12);
  --danger:#f87171;
  --danger-bg:rgba(248,113,113,0.12);
  --info:#60a5fa;
  --info-bg:rgba(96,165,250,0.12);
  --radius:14px;
  --radius-sm:10px;
  --radius-lg:20px;
  --radius-pill:999px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.25), 0 1px 3px rgba(0,0,0,0.15);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4), 0 2px 6px rgba(0,0,0,0.2);
  --shadow-glow: 0 0 0 1px rgba(59,158,255,0.3), 0 8px 24px rgba(59,158,255,0.25);
  --font-sans: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'Geist Mono', ui-monospace, monospace;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg:#f5f8ff;
    --bg-grad: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(59,158,255,0.12), transparent 70%), #f5f8ff;
    --bg-elev:#ffffff;
    --bg-elev-2:#eef3fc;
    --bg-elev-3:#dfe8f7;
    --border:rgba(15,23,42,0.06);
    --border-strong:rgba(15,23,42,0.12);
    --text:#0f172a;
    --text-muted:#5e6c87;
    --text-dim:#94a3b8;
    --accent:#1e7fe6;
    --accent-bg:rgba(59,158,255,0.1);
    --accent-bg-strong:rgba(59,158,255,0.18);
    --accent-border:rgba(59,158,255,0.35);
    --success-bg:rgba(52,211,153,0.15);
    --warning-bg:rgba(251,191,36,0.18);
    --info-bg:rgba(96,165,250,0.15);
    --danger-bg:rgba(248,113,113,0.12);
    --shadow-md: 0 4px 12px rgba(15,23,42,0.06), 0 1px 3px rgba(15,23,42,0.04);
    --shadow-lg: 0 10px 30px rgba(15,23,42,0.08), 0 2px 6px rgba(15,23,42,0.04);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg-grad);background-attachment:fixed;color:var(--text);
  font-family:var(--font-sans);font-size:15px;line-height:1.5;font-feature-settings:'cv11','ss01';
  letter-spacing:-0.005em;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
#app{max-width:720px;margin:0 auto;padding:20px 18px 80px;min-height:100vh}
h1,h2,h3{font-weight:600;margin:0;letter-spacing:-0.02em}
h1{font-size:26px;line-height:1.15}h2{font-size:18px}h3{font-size:15px}
button{font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;background:transparent;color:var(--text);
  border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:9px 16px;
  transition:all 0.18s cubic-bezier(0.4,0,0.2,1);letter-spacing:-0.005em}
button:hover{background:var(--bg-elev-2)}
button:active{transform:scale(0.97)}
button:disabled{opacity:0.4;cursor:not-allowed}
button.primary{background:var(--accent-grad);color:#fff;border-color:transparent;
  box-shadow:0 2px 8px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,0.2);font-weight:600}
button.primary:hover{filter:brightness(1.08);box-shadow:0 4px 16px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,0.25);transform:translateY(-1px)}
button.danger{background:var(--danger);color:#fff;border-color:transparent;box-shadow:0 2px 8px rgba(248,113,113,0.35);font-weight:600}
button.danger:hover{filter:brightness(1.1)}
button.ghost-danger{color:var(--danger);border-color:var(--danger);background:transparent}
button.ghost-danger:hover{background:var(--danger-bg)}
input,textarea,select{font-family:inherit;font-size:14px;background:var(--bg-elev);color:var(--text);
  border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:11px 14px;width:100%;
  transition:all 0.18s ease;letter-spacing:-0.005em}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-bg)}
input[type="number"]{-moz-appearance:textfield}
input[type="number"]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type="checkbox"]{width:auto;margin:0;accent-color:var(--accent)}
input[type="date"]{color-scheme:dark}
@media (prefers-color-scheme:light){input[type="date"]{color-scheme:light}}
.card{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow-sm)}
.muted{color:var(--text-muted)}.dim{color:var(--text-dim)}.mono{font-family:var(--font-mono)}
.row{display:flex;align-items:center;gap:10px}.spacer{flex:1}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex-shrink:0}
.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:var(--radius-pill);
  font-size:12px;font-weight:500;letter-spacing:-0.005em}
.admin-pill{background:var(--accent-bg);color:var(--accent);border:1px solid var(--accent-border);
  padding:2px 8px;border-radius:var(--radius-pill);font-size:10px;font-weight:600;
  text-transform:uppercase;letter-spacing:0.06em;font-family:var(--font-mono)}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(10px);
  background:var(--bg-elev-3);color:var(--text);padding:12px 22px;border-radius:var(--radius-pill);
  border:1px solid var(--border-accent);box-shadow:var(--shadow-lg), 0 0 0 4px rgba(59,158,255,0.08);
  font-size:13px;font-weight:500;z-index:500;opacity:0;pointer-events:none;
  transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);letter-spacing:-0.005em}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.loader{display:inline-block;width:16px;height:16px;border:2px solid var(--border-strong);
  border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sync-pill{display:inline-flex;align-items:center;gap:7px;font-size:11px;color:var(--text-muted);
  background:var(--bg-elev-2);border:1px solid var(--border);padding:5px 11px;border-radius:var(--radius-pill);
  font-family:var(--font-mono);letter-spacing:0.02em}
.sync-pill .pulse{width:6px;height:6px;border-radius:50%;background:var(--success);animation:pulse-ring 2s infinite}
@keyframes pulse-ring{0%{box-shadow:0 0 0 0 rgba(52,211,153,0.5)}70%{box-shadow:0 0 0 6px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
.modal-backdrop{position:fixed;inset:0;background:rgba(5,10,25,0.7);backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);z-index:400;display:flex;align-items:center;justify-content:center;
  padding:16px;animation:fadeIn 0.2s ease}
.modal{background:var(--bg-elev);border:1px solid var(--border-strong);border-radius:var(--radius-lg);
  padding:24px;max-width:440px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);
  animation:slideUp 0.3s cubic-bezier(0.34,1.56,0.64,1)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px) scale(0.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.muscle-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.muscle-chip{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;
  background:var(--bg-elev-2);border-radius:var(--radius-sm);font-size:13px;cursor:pointer;user-select:none;
  border:1px solid transparent;transition:all 0.15s ease}
.muscle-chip:hover{background:var(--bg-elev-3)}
.muscle-chip.primary{background:var(--accent-bg-strong);color:var(--accent);border-color:var(--accent-border)}
.muscle-chip.secondary{background:var(--warning-bg);color:var(--warning);border-color:var(--warning)}
.alt-row{display:flex;gap:6px;align-items:center;margin-bottom:6px}.alt-row input{flex:1}
.tab-bar{display:flex;background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);
  padding:4px;gap:4px;margin-bottom:16px}
.tab-bar button{flex:1;padding:9px 12px;border:none;background:transparent;font-size:13px;
  color:var(--text-muted);border-radius:8px;transition:all 0.2s ease;letter-spacing:-0.005em}
.tab-bar button:hover{color:var(--text);background:var(--bg-elev-2)}
.tab-bar button.active{background:var(--accent-grad);color:#fff;font-weight:600;box-shadow:0 2px 8px var(--accent-glow)}
.day-card{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px 16px;margin-bottom:10px;display:block;width:100%;text-align:left;font:inherit;color:inherit;
  cursor:pointer;transition:all 0.2s ease;position:relative;overflow:hidden}
.day-card::before{content:'';position:absolute;inset:0;background:var(--accent-grad-soft);
  opacity:0;transition:opacity 0.25s;pointer-events:none}
.day-card:hover{border-color:var(--border-accent);transform:translateY(-1px);box-shadow:var(--shadow-md)}
.day-card:hover::before{opacity:1}
.day-card:active{transform:translateY(0)}
.exercise-card{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:12px 14px;margin-bottom:8px;display:block;width:100%;text-align:left;font:inherit;color:inherit;
  cursor:pointer;transition:all 0.18s ease}
.exercise-card:hover{background:var(--bg-elev-2);border-color:var(--border-strong)}
.icon-tile{width:42px;height:42px;border-radius:12px;background:var(--accent-bg);border:1px solid var(--accent-border);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--accent)}
.user-pill{display:inline-flex;align-items:center;gap:7px;padding:5px 12px 5px 6px;
  border-radius:var(--radius-pill);font-size:13px;background:var(--bg-elev);border:1px solid var(--border);
  font-weight:500;cursor:pointer;transition:all 0.15s;font-family:inherit}
.user-pill:hover{background:var(--bg-elev-2);border-color:var(--border-strong)}
.section-label{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:0.1em;
  color:var(--text-dim);margin-bottom:10px;font-weight:500}
.set-row{margin-bottom:8px;padding:10px;background:var(--bg-elev-2);border:1px solid var(--border);
  border-radius:var(--radius-sm);transition:all 0.15s ease}
.set-row:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.user-dots{display:flex;gap:3px;align-items:center}
.user-dots .dot{width:8px;height:8px;transition:all 0.2s}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--text-dim)}
::selection{background:var(--accent-bg-strong);color:var(--text)}
.history-entry{padding:12px;background:var(--bg-elev-2);border:1px solid var(--border);
  border-radius:var(--radius-sm);margin-bottom:6px;transition:all 0.15s}
.history-entry:hover{border-color:var(--border-strong)}
.wrap-text{overflow-wrap:anywhere;word-break:break-word;white-space:normal;line-height:1.45}
.date-field{display:block;width:100%;max-width:360px;margin:0 auto;text-align:center;text-align-last:center;font-family:var(--font-mono)}
.banner{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:var(--radius-sm);
  font-size:13px;margin-bottom:14px}
.banner i{font-size:16px;flex-shrink:0;margin-top:1px}
.banner-info{background:var(--info-bg);color:var(--info);border:1px solid rgba(96,165,250,0.25)}
.banner-warning{background:var(--warning-bg);color:var(--warning);border:1px solid rgba(251,191,36,0.25)}
.stat-card{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;box-shadow:var(--shadow-sm);transition:all 0.2s}
.stat-card:hover{border-color:var(--border-strong)}
.stat-value{font-size:24px;font-weight:600;font-family:var(--font-mono);letter-spacing:-0.02em}
.stat-label{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-dim)}
.chart-bar-rect{transition:all 0.4s cubic-bezier(0.34,1.56,0.64,1)}
.chart-bar-rect:hover{filter:brightness(1.15)}
@keyframes fadeInUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeInUp 0.4s ease backwards}

/* ========== ONBOARDING SLIDES ========== */
.onboarding-wrap{position:fixed;inset:0;background:var(--bg-grad);background-attachment:fixed;z-index:350;display:flex;flex-direction:column;animation:fadeIn 0.3s ease}
.onboarding-skip{position:absolute;top:16px;right:16px;background:var(--bg-elev-2);border:1px solid var(--border);color:var(--text-muted);font-size:13px;padding:7px 14px;border-radius:var(--radius-pill);cursor:pointer;z-index:5;font-family:inherit}
.onboarding-skip:hover{background:var(--bg-elev-3);color:var(--text)}
.onboarding-slides{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.onboarding-slides::-webkit-scrollbar{display:none}
.onboarding-slide{flex:0 0 100%;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 28px;max-width:480px;margin:0 auto;text-align:center;min-width:100%}
.onboarding-icon{font-size:80px;margin-bottom:24px;filter:drop-shadow(0 4px 20px var(--accent-glow));animation:floatY 3s ease-in-out infinite}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.onboarding-slide h2{font-size:28px;margin-bottom:12px;background:var(--accent-grad);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-0.02em}
.onboarding-slide p{font-size:16px;color:var(--text-muted);line-height:1.55;max-width:360px;margin:0}
.onboarding-features{margin-top:24px;display:flex;flex-direction:column;gap:10px;width:100%;max-width:340px}
.onboarding-feature{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius-sm);text-align:left;font-size:14px}
.onboarding-feature i{font-size:22px;color:var(--accent);flex-shrink:0}
.onboarding-footer{padding:24px 28px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px;align-items:center}
.onboarding-dots{display:flex;gap:8px}
.onboarding-dot{width:8px;height:8px;border-radius:50%;background:var(--bg-elev-3);transition:all 0.3s;cursor:pointer}
.onboarding-dot.active{background:var(--accent);width:28px;border-radius:4px}
.onboarding-cta{width:100%;max-width:360px;padding:14px;font-size:15px;font-weight:600}

/* ========== HOME TOUR ========== */
.tour-overlay{position:fixed;inset:0;z-index:360;pointer-events:none;animation:fadeIn 0.25s ease}
.tour-bg{position:absolute;inset:0;background:rgba(5,10,25,0.55);backdrop-filter:blur(1px);-webkit-backdrop-filter:blur(1px);pointer-events:auto}
.tour-spotlight{position:absolute;border-radius:14px;box-shadow:0 0 0 9999px rgba(5,10,25,0.55), 0 0 0 4px var(--accent-glow), 0 0 30px var(--accent);background:transparent;pointer-events:none;transition:all 0.4s cubic-bezier(0.4,0,0.2,1)}
.tour-tooltip{position:absolute;background:var(--bg-elev);border:1px solid var(--border-strong);border-radius:var(--radius);padding:16px 18px;max-width:300px;box-shadow:var(--shadow-lg);pointer-events:auto;z-index:2;animation:tourPop 0.3s cubic-bezier(0.34,1.56,0.64,1)}
@keyframes tourPop{from{opacity:0;transform:scale(0.9)}to{opacity:1;transform:scale(1)}}
.tour-tooltip h3{font-size:15px;font-weight:600;margin-bottom:6px;color:var(--text)}
.tour-tooltip p{font-size:13px;color:var(--text-muted);margin:0 0 12px;line-height:1.5}
.tour-progress{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tour-step{font-family:var(--font-mono);font-size:11px;color:var(--text-dim);letter-spacing:0.05em}
.tour-actions{display:flex;gap:8px}
.tour-actions button{padding:6px 12px;font-size:12px;border-radius:8px}
</style>
</head>

function groupPath(){ return state.currentGroup || DEFAULT_GROUP; }
function groupLocalKey(base, groupId = groupPath()){ return groupId === DEFAULT_GROUP ? base : base + ':' + groupId; }
function loadCurrentGroup(){ return localStorage.getItem(LS_GROUP) || DEFAULT_GROUP; }
function saveCurrentGroup(groupId){ localStorage.setItem(LS_GROUP, groupId); }
function loadJoinedGroups(){
  try {
    const groups = JSON.parse(localStorage.getItem(LS_GROUPS) || 'null');
    return Array.isArray(groups) && groups.length ? Array.from(new Set([DEFAULT_GROUP, ...groups])) : [DEFAULT_GROUP];
  } catch { return [DEFAULT_GROUP]; }
}
function saveJoinedGroups(groups){ localStorage.setItem(LS_GROUPS, JSON.stringify(Array.from(new Set([DEFAULT_GROUP, ...groups])))); }
function rememberGroup(groupId){ state.joinedGroups = Array.from(new Set([DEFAULT_GROUP, ...state.joinedGroups, groupId])); saveJoinedGroups(state.joinedGroups); }
function forgetGroup(groupId){ state.joinedGroups = state.joinedGroups.filter(g => g !== groupId); saveJoinedGroups(state.joinedGroups); }
function slugGroupName(name){ return String(name || '').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,48); }
function membershipLocalKey(userId){ return 'membership:'+userId; }
async function loadMembershipGroups(userId){
  if (!userId) return [];
  if (!firebaseReady){
    try { return JSON.parse(localStorage.getItem(membershipLocalKey(userId)) || '[]'); } catch { return []; }
  }
  try {
    const snap = await getDoc(doc(db,'memberships',userId));
    return snap.exists() ? (snap.data().groups || []) : [];
  } catch(e){ console.error(e); return []; }
}
async function saveMembershipGroups(userId, groups){
  if (!userId) return;
  const clean = Array.from(new Set(groups.filter(Boolean)));
  if (!firebaseReady){ localStorage.setItem(membershipLocalKey(userId), JSON.stringify(clean)); return; }
  try { await setDoc(doc(db,'memberships',userId), { groups: clean, updatedAt: Date.now() }); }
  catch(e){ console.error(e); localStorage.setItem(membershipLocalKey(userId), JSON.stringify(clean)); }
}
async function rememberMembership(userId, groupId){
  if (!userId || !groupId) return;
  try {
    const groups = Array.from(new Set([...(await loadMembershipGroups(userId)), groupId]));
    await saveMembershipGroups(userId, groups);
    if (userId === state.currentUser){ state.joinedGroups = groups; saveJoinedGroups(groups); }
  } catch(e){ console.error(e); }
}
async function forgetMembership(userId, groupId){
  if (!userId || !groupId) return;
  try {
    const groups = (await loadMembershipGroups(userId)).filter(g => g !== groupId);
    await saveMembershipGroups(userId, groups);
    if (userId === state.currentUser){ state.joinedGroups = groups.length ? groups : [DEFAULT_GROUP]; saveJoinedGroups(state.joinedGroups); }
  } catch(e){ console.error(e); }
}
function defaultAccount(user){
  return {
    uid: user.uid,
    email: user.email || '',
    displayName: user.displayName || '',
    groups: [],
    linkedProfiles: {},
    createdAt: Date.now(),
    updatedAt: Date.now()
  };
}
async function loadAccount(user){
  if (!firebaseReady || !user) return null;
  try {
    const ref = doc(db, 'accounts', user.uid);
    const snap = await getDoc(ref);
    const account = snap.exists() ? { ...defaultAccount(user), ...snap.data(), uid: user.uid } : defaultAccount(user);
    account.groups = Array.from(new Set(account.groups || []));
    account.linkedProfiles = account.linkedProfiles || {};
    if (!snap.exists()) await setDoc(ref, account);
    return account;
  } catch(e){
    console.error(e);
    toast('No pude cargar tu cuenta');
    return defaultAccount(user);
  }
}
async function recoverAccountGroupsFromProfiles(account = state.account){
  if (!account || !account.linkedProfiles) return account ? (account.groups || []) : [];
  const profileIds = Array.from(new Set(Object.values(account.linkedProfiles).filter(Boolean)));
  const recovered = new Set(account.groups || []);
  for (const profileId of profileIds){
    try {
      const groups = await loadMembershipGroups(profileId);
      groups.forEach(g => recovered.add(g));
    } catch(e){ console.error(e); }
  }
  const groups = Array.from(recovered).filter(Boolean);
  if (groups.length !== (account.groups || []).length || groups.some(g => !(account.groups || []).includes(g))){
    await saveAccount({ groups });
  }
  return groups;
}
async function saveAccount(patch = {}){
  if (!firebaseReady || !state.authUser) return;
  const next = {
    ...defaultAccount(state.authUser),
    ...(state.account || {}),
    ...patch,
    uid: state.authUser.uid,
    email: state.authUser.email || (state.account && state.account.email) || '',
    displayName: state.authUser.displayName || (state.account && state.account.displayName) || '',
    updatedAt: Date.now()
  };
  next.groups = Array.from(new Set(next.groups || []));
  next.linkedProfiles = next.linkedProfiles || {};
  state.account = next;
  try { await setDoc(doc(db, 'accounts', state.authUser.uid), next); }
  catch(e){ console.error(e); toast('No pude guardar tu cuenta'); }
}
function linkedProfileForGroup(groupId = groupPath()){
  return state.account && state.account.linkedProfiles ? state.account.linkedProfiles[groupId] : null;
}
function visibleAccountGroups(){
  if (state.authUser && state.account){
    return Array.from(new Set(state.account.groups || [])).filter(Boolean);
  }
  return Array.from(new Set(state.joinedGroups || [])).filter(Boolean);
}
function removeStrayBodyTextNodes(){
  Array.from(document.body.childNodes).forEach(node => {
    if (node.nodeType === Node.TEXT_NODE && node.textContent.trim()){
      node.remove();
    }
  });
}
async function filterUsersForGroup(groupId, users, cfg = null, keepIds = []){
  const clean = Array.isArray(users) ? users : [];
  if (groupId === DEFAULT_GROUP) return clean;
  const keep = new Set((keepIds || []).filter(Boolean));
  const admins = new Set(((cfg || state.groupConfig || {}).adminIds || []).filter(Boolean));
  const linkedCurrent = linkedProfileForGroup(groupId);
  if (linkedCurrent) keep.add(linkedCurrent);
  const out = [];
  for (const user of clean){
    if (!user || !user.id) continue;
    if (keep.has(user.id) || admins.has(user.id) || user.joinedAt){
      out.push(user);
      continue;
    }
    if (user.authOwnerUid){
      try {
        const groups = await loadMembershipGroups(user.id);
        if (groups.includes(groupId)) out.push(user);
      } catch(e){ console.error(e); }
    }
  }
  return out;
}
async function linkAuthToProfile(userId, groupId = groupPath()){
  if (!state.authUser || !userId || !groupId) return true;
  const u = state.users.find(x => x.id === userId);
  if (!u) throw new Error('No encontré ese usuario del gym.');
  if (u.authOwnerUid && u.authOwnerUid !== state.authUser.uid){
    throw new Error('Este usuario del gym ya está enlazado a otra cuenta. Pide a la admin que lo revise.');
  }
  if (!u.authOwnerUid){
    u.authOwnerUid = state.authUser.uid;
    u.authOwnerEmail = state.authUser.email || '';
    u.authLinkedAt = Date.now();
    await saveUsers(state.users);
  }
  const groups = Array.from(new Set([...(state.account?.groups || []), groupId]));
  const linkedProfiles = { ...(state.account?.linkedProfiles || {}), [groupId]: userId };
  await saveAccount({ groups, linkedProfiles });
  return true;
}

function authValid(){
  if (state.authUser && linkedProfileForGroup() === state.currentUser){
    const u = state.users.find(x => x.id === state.currentUser);
    return !u?.authOwnerUid || u.authOwnerUid === state.authUser.uid;
  }
  try {
    const a = JSON.parse(localStorage.getItem(groupLocalKey(LS_AUTH)) || (groupPath() === DEFAULT_GROUP ? localStorage.getItem(LS_AUTH) : 'null'));
    if (!a || !a.userId || !a.ts || (a.groupId && a.groupId !== groupPath())) return false;
    const days = (Date.now() - a.ts) / (1000*60*60*24);
    return days < 30 && a.userId === state.currentUser;

async function switchGroup(groupId){

  }
  const token = ++state.groupSwitchToken;
  state.suppressRealtimeRender = true;
  try {

    if (token !== state.groupSwitchToken) return;
    unsubs.forEach(u => u && u());
    unsubs = [];
    state.currentGroup = groupId;
    saveCurrentGroup(groupId);
    rememberGroup(groupId);
    state.currentDay = null;
    state.currentExerciseIdx = null;

      state.joinedGroups = groups.length ? groups : state.joinedGroups;

    }
    chooseInitialViewForGroup();
    subscribeRealtime();
  } catch(e){
    console.error(e);
    toast('No pude cambiar de grupo. Intenta de nuevo.');
  } finally {
    if (token === state.groupSwitchToken){

async function createGroup(groupId, groupName, invitationPassword, routineMode){
  let me = state.users.find(u => u.id === state.currentUser);
  if (!me && window._pendingGroupCreator) me = window._pendingGroupCreator;
  if (!me){ toast('Crea tu perfil de admin para crear el grupo'); return; }
  const safeId = slugGroupName(groupId || groupName);
  if (!safeId){ toast('Nombre de grupo inválido'); return; }
  const config = {
    ...defaultGroupConfig(safeId),
    groupName: groupName || safeId,
    invitationPassword,
    createdBy: me.id,
    adminIds: [me.id],
    createdAt: Date.now()
  };
  let routine = normalizeRoutine(DEFAULT_ROUTINE);
  if (routineMode === 'blank') routine = blankRoutine();
  if (routineMode === 'copy-current') routine = JSON.parse(JSON.stringify(state.sharedRoutine || DEFAULT_ROUTINE));
  const newGroupUsers = [{ ...me }];
  if (!firebaseReady){
    localStorage.setItem(groupLocalKey('config', safeId), JSON.stringify(config));
    localStorage.setItem(groupLocalKey('users', safeId), JSON.stringify(newGroupUsers));
    localStorage.setItem(groupLocalKey('sharedRoutine', safeId), JSON.stringify(routine));
  } else {
    await setDoc(doc(db,'salas',safeId,'meta','config'), config);
    await setDoc(doc(db,'salas',safeId,'meta','users'), { users: newGroupUsers });
    await setDoc(doc(db,'salas',safeId,'routines','shared'), { routine });
  }
  window._pendingGroupCreator = null;
  // CRITICAL: reset local state BEFORE switching to the new group so any
  // subsequent saveUsers() calls don't write old users into the new group's Firestore.
  state.users = newGroupUsers;
  state.logs = {};
  state.personalRoutines = {};
  state.sharedRoutine = normalizeRoutine(routine);
  state.groupConfig = config;
  state.invitationPassword = invitationPassword;
  state.routineSource = 'shared';
  state.currentDay = null;
  state.currentExerciseIdx = null;
  state.editingSession = null;
  rememberGroup(safeId);
  state.currentGroup = safeId;
  saveCurrentGroup(safeId);
  state.currentUser = me.id;
  try { await afterLogin(me.id); }
  catch(err){ toast(err.message || 'No pude enlazar este usuario'); return; }
  await reloadGroup();
  toast('Grupo creado');
}
async function joinGroup(groupId, password){
  const safeId = slugGroupName(groupId);
  if (!safeId){ toast('Escribe el código del grupo'); return; }
  const currentMe = state.users.find(u => u.id === state.currentUser);
  let cfg = null;
  if (!firebaseReady){
    cfg = JSON.parse(localStorage.getItem(groupLocalKey('config', safeId)) || 'null');
  } else {
    const snap = await getDoc(doc(db,'salas',safeId,'meta','config'));
    cfg = snap.exists() ? snap.data() : null;
  }
  if (!cfg){ toast('No encontré ese grupo'); return; }
  if ((cfg.invitationPassword || INVITATION_PASSWORD_DEFAULT) !== password){ toast('Contraseña incorrecta'); return; }
  if (currentMe && currentMe.pinHash){
    let targetUsers = await filterUsersForGroup(safeId, await loadUsersForGroup(safeId), cfg, [currentMe.id]);
    if (!targetUsers.some(u => u.id === currentMe.id)){
      targetUsers.push({ ...currentMe, joinedAt: Date.now() });
    }
    await saveUsersForGroup(safeId, targetUsers);
  }
  rememberGroup(safeId);
  if (state.authUser){
    const groups = Array.from(new Set([...(state.account?.groups || []), safeId]));
    await saveAccount({ groups });
    state.joinedGroups = groups;
    saveJoinedGroups(groups);
  }
  state.currentGroup = safeId;
  saveCurrentGroup(safeId);
  state.enteringGroup = !currentMe;
  state.currentDay = null;
  state.currentExerciseIdx = null;
  state.editingSession = null;
  state.showAlts = false;
  state.showMuscles = false;
  state.showRoutineMuscles = false;
  state.showGlobalRoutineMuscles = false;
  await reloadGroup();
  if (currentMe) {
    try { await afterLogin(currentMe.id); }
    catch(err){ toast(err.message || 'No pude enlazar este usuario'); return; }
  }
  toast(currentMe ? 'Entraste con tu mismo usuario' : 'Grupo agregado');
}

async function sha(s){
  if (!s) return '';
  const b = new TextEncoder().encode(s);
  const h = await crypto.subtle.digest('SHA-256', b);
  return Array.from(new Uint8Array(h)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function readJsonFile(file){

      catch(e){ reject(e); }

    reader.readAsText(file);
  });
}

function setMaxWeight(set){
  if (!set) return 0;
  if (set.unilateral){
    return Math.max(Number(set.left?.weight)||0, Number(set.right?.weight)||0);
  }
  return Number(set.weight)||0;
}
function setDisplayReps(set){
  if (!set) return 0;
  if (set.unilateral){
    return Math.max(Number(set.left?.reps)||0, Number(set.right?.reps)||0);
  }
  return Number(set.reps)||0;
}
function setVolume(set){
  if (!set) return 0;
  if (set.unilateral){
    return (Number(set.left?.reps)||0) * (Number(set.left?.weight)||0) +
      (Number(set.right?.reps)||0) * (Number(set.right?.weight)||0);
  }
  return (Number(set.reps)||0) * (Number(set.weight)||0);
}
function formatSetLine(set, idx){
  if (set.unilateral){
    const l = set.left || {}; const r = set.right || {};
    return `${idx+1}) Izq ${l.weight||0}lb × ${l.reps||0} / Der ${r.weight||0}lb × ${r.reps||0}${set.note ? ' · '+set.note : ''}`;
  }
  return `${idx+1}) ${set.weight}lb × ${set.reps}${set.note ? ' · '+set.note : ''}`;
}
const bestSet = (e) => !e.sets || !e.sets.length ? null : e.sets.reduce((b,s)=> setMaxWeight(s)>setMaxWeight(b)?s:b, e.sets[0]);
const totalVolume = (e) => !e.sets ? 0 : e.sets.reduce((sum,x)=> sum + setVolume(x), 0);
function publicTrainingStats(uid){
  const userLogs = state.logs[uid] || {};
  const sessions = [];
  const byExercise = {};
  let totalSets = 0;
  let totalVolumeNum = 0;
  let maxWeight = 0;
  for (const [ek, entries] of Object.entries(userLogs)){
    (entries || []).forEach(entry => {
      const sets = entry.sets || [];
      const volume = totalVolume(entry);
      const best = bestSet(entry);
      totalSets += sets.length;
      totalVolumeNum += volume;
      maxWeight = Math.max(maxWeight, best ? setMaxWeight(best) : 0);
      if (!byExercise[ek]) byExercise[ek] = { ek, name: exerciseNameForKey(ek), sessions:0, sets:0, volume:0, maxWeight:0 };
      byExercise[ek].sessions += 1;
      byExercise[ek].sets += sets.length;
      byExercise[ek].volume += volume;
      byExercise[ek].maxWeight = Math.max(byExercise[ek].maxWeight, best ? setMaxWeight(best) : 0);
      sessions.push({ ek, name: exerciseNameForKey(ek), date: entry.date, sets: sets.length, volume, maxWeight: best ? setMaxWeight(best) : 0 });
    });
  }
  sessions.sort((a,b) => String(b.date).localeCompare(String(a.date)));
  const topExercises = Object.values(byExercise).sort((a,b) => b.sessions - a.sessions || b.volume - a.volume).slice(0,5);
  return { sessions, topExercises, totalSessions: sessions.length, totalSets, totalVolume: totalVolumeNum, maxWeight, lastDate: sessions[0]?.date || null };
}
const latestEntry = (uid, ek) => {
  const a = getEntries(uid, ek);
  return a.length ? a.slice().sort((x,y)=>x.date.localeCompare(y.date)).pop() : null;
};
function bucketEntries(entries, mode){
  const b = {};
  for (const e of entries){
    let key;
    if (mode==='week'){
      const d = parseDateKey(e.date); const day = (d.getDay()+6)%7;
      d.setDate(d.getDate()-day); key = dateKey(d);
    } else if (mode==='month'){ key = e.date.slice(0,7); }
    else { key = e.date.slice(0,4); }
    if (!b[key]) b[key] = { key, maxWeight:0, totalVolume:0, sessions:0 };
    const best = bestSet(e);
    if (best && setMaxWeight(best) > b[key].maxWeight) b[key].maxWeight = setMaxWeight(best);
    b[key].totalVolume += totalVolume(e);
    b[key].sessions += 1;
  }
  return Object.values(b).sort((x,y)=>x.key.localeCompare(y.key));
}

function routineMuscleStats(routine){

    (ex.primary || []).forEach(id => {
      if (!MUSCLES[id]) return;
      scores[id] = (scores[id] || 0) + 1;
      total += 1;
    });
    (ex.secondary || []).forEach(id => {
      if (!MUSCLES[id]) return;
      scores[id] = (scores[id] || 0) + 0.5;
      total += 0.5;
    });
  });
  const max = Math.max(0, ...Object.values(scores));
  const rows = Object.entries(scores)
    .map(([id, score]) => ({
      id,
      label: MUSCLES[id].label,
      score,
      percent: total ? Math.round((score / total) * 100) : 0,
      intensity: max ? score / max : 0
    }))
    .sort((a,b) => b.score - a.score || a.label.localeCompare(b.label));
  const map = {};
  rows.forEach(row => { map[row.id] = row; });
  return { rows, map, total };
}

function fullRoutineMuscleStats(){
  const merged = { exercises: [] };
  getAllDayKeys().forEach(dayKey => {
    const dayRoutine = getRoutineForDay(dayKey);
    if (dayRoutine && Array.isArray(dayRoutine.exercises)){
      merged.exercises.push(...dayRoutine.exercises);
    }
  });
  return routineMuscleStats(merged);
}

function muscleHeatColor(intensity){
  const t = Math.max(0, Math.min(1, Number(intensity) || 0));
  if (!t) return 'var(--bg-elev-2)';
  if (t >= 0.72) return '#f97316';
  if (t >= 0.45) return '#3b9eff';
  if (t >= 0.22) return '#72c8ff';
  return '#b8e4ff';
}

function getRoutineForDay(dayKey){
  const src = state.routineSource[dayKey] || 'shared';
  if (src === 'personal'){
    const pr = state.personalRoutines[state.currentUser];
    if (pr && pr[dayKey]) return pr[dayKey];
  }
  return (state.sharedRoutine && state.sharedRoutine[dayKey]) || null;
}
function getCurrentSource(dayKey){
  return state.routineSource[dayKey] || 'shared';
}
function setCurrentSource(dayKey, src){
  state.routineSource[dayKey] = src;
  saveRoutineSource(state.routineSource);
}
function getAllDayKeys(){
  const all = new Set(DAY_ORDER);
  if (state.sharedRoutine) Object.keys(state.sharedRoutine).forEach(k => all.add(k));
  const pr = state.personalRoutines[state.currentUser];
  if (pr) Object.keys(pr).forEach(k => all.add(k));
  const ordered = DAY_ORDER.filter(k => all.has(k));
  const extras = [...all].filter(k => !DAY_ORDER.includes(k));
  return [...ordered, ...extras];
}

function renderOnboarding(){
  // Bail if already mounted (render() may be called multiple times by realtime listeners)
  if (document.querySelector('.onboarding-wrap')) return;
  let currentSlide = 0;
  const totalSlides = ONBOARDING_SLIDES.length;
  const wrap = document.createElement('div');
  wrap.className = 'onboarding-wrap';
  wrap.innerHTML = `
    <button class="onboarding-skip" id="obSkip">Saltar</button>
    <div class="onboarding-slides" id="obSlides">
      ${ONBOARDING_SLIDES.map((s, i) => `
        <div class="onboarding-slide" data-i="${i}">
          <div class="onboarding-icon">${s.icon}</div>
          <h2>${esc(s.title)}</h2>
          <p>${esc(s.subtitle)}</p>
          ${s.features ? `<div class="onboarding-features">
            ${s.features.map(f => `<div class="onboarding-feature"><i class="ti ${f.icon}"></i><span>${esc(f.text)}</span></div>`).join('')}
          </div>` : ''}
        </div>`).join('')}
    </div>
    <div class="onboarding-footer">
      <div class="onboarding-dots" id="obDots">
        ${ONBOARDING_SLIDES.map((_, i) => `<div class="onboarding-dot ${i===0?'active':''}" data-i="${i}"></div>`).join('')}
      </div>
      <button class="primary onboarding-cta" id="obCta">Siguiente</button>
    </div>`;
  document.body.appendChild(wrap);
  const slidesEl = wrap.querySelector('#obSlides');
  const dotsEl = wrap.querySelector('#obDots');
  const ctaBtn = wrap.querySelector('#obCta');
  const skipBtn = wrap.querySelector('#obSkip');
  function close(){
    markOnboardingSeen();
    // Render the underlying app FIRST (login or home), THEN fade out the slides on top
    try { render(); } catch(e){ console.error(e); }
    wrap.style.transition = 'opacity 0.3s ease';
    wrap.style.opacity = '0';
    wrap.style.pointerEvents = 'none';
    setTimeout(() => wrap.remove(), 320);
  }
  function goTo(i){
    currentSlide = Math.max(0, Math.min(totalSlides - 1, i));
    const slide = slidesEl.children[currentSlide];
    slidesEl.scrollTo({ left: slide.offsetLeft, behavior: 'smooth' });
    updateUI();
  }
  function updateUI(){
    dotsEl.querySelectorAll('.onboarding-dot').forEach((d, i) => d.classList.toggle('active', i === currentSlide));
    ctaBtn.textContent = currentSlide === totalSlides - 1 ? '¡Comenzar!' : 'Siguiente';
  }
  ctaBtn.addEventListener('click', () => { if (currentSlide === totalSlides - 1) close(); else goTo(currentSlide + 1); });
  skipBtn.addEventListener('click', close);
  dotsEl.querySelectorAll('.onboarding-dot').forEach(d => d.addEventListener('click', () => goTo(Number(d.dataset.i))));
  let scrollTimer;
  slidesEl.addEventListener('scroll', () => {
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(() => {
      const i = Math.round(slidesEl.scrollLeft / slidesEl.offsetWidth);
      if (i !== currentSlide){ currentSlide = i; updateUI(); }
    }, 80);
  });
}

  const skipBtn = overlay.querySelector('#tourSkip');
  function close(){
    markTourSeen();
    overlay.style.animation = 'fadeIn 0.2s ease reverse';
    setTimeout(() => overlay.remove(), 200);
  }
  function showStep(){
    const s = TOUR_STEPS[step];
    if (!s){ close(); return; }
    const target = document.querySelector(s.selector);
    if (!target){ step++; showStep(); return; }
    target.scrollIntoView({ behavior:'smooth', block:'center' });
    setTimeout(() => {
      const rect = target.getBoundingClientRect();
      const pad = 8;
      spot.style.left = (rect.left - pad) + 'px';
      spot.style.top = (rect.top - pad) + 'px';
      spot.style.width = (rect.width + pad * 2) + 'px';
      spot.style.height = (rect.height + pad * 2) + 'px';
      titleEl.textContent = s.title;
      bodyEl.textContent = s.body;
      stepEl.textContent = `${step + 1} / ${TOUR_STEPS.length}`;
      nextBtn.textContent = step === TOUR_STEPS.length - 1 ? '¡Listo!' : 'Siguiente';
      const tipW = 300; const tipH = 150;
      const vpW = window.innerWidth; const vpH = window.innerHeight;
      let left = rect.left + rect.width / 2 - tipW / 2;
      left = Math.max(12, Math.min(vpW - tipW - 12, left));
      let top = rect.bottom + 16;
      if (top + tipH > vpH - 20) top = rect.top - tipH - 16;
      tip.style.left = left + 'px';
      tip.style.top = Math.max(12, top) + 'px';
      tip.style.maxWidth = tipW + 'px';
    }, 300);
  }
  nextBtn.addEventListener('click', () => { step++; showStep(); });
  skipBtn.addEventListener('click', close);
  showStep();
}

let realtimeRenderTimer = null;
function requestRealtimeRender(){
  if (state.suppressRealtimeRender) return;
  const wait = Math.max(0, (state.realtimeQuietUntil || 0) - Date.now());
  if (wait > 0){
    if (!realtimeRenderTimer){
      realtimeRenderTimer = setTimeout(() => {
        realtimeRenderTimer = null;
        render();
      }, wait + 30);
    }
    return;
  }
  if (realtimeRenderTimer){
    clearTimeout(realtimeRenderTimer);
    realtimeRenderTimer = null;
  }
  render();
}

              <div class="muted" style="font-size:12px;margin-top:2px;">${lastTxt}</div>
            </div>
            <button data-action="viewPublicProfile" data-uid="${u.id}" aria-label="Ver perfil de ${esc(u.name)}" title="Ver perfil" style="padding:8px 10px;border-color:var(--border);background:var(--bg-elev);">
              <i class="ti ti-eye" style="font-size:16px;color:var(--accent);"></i>
            </button>
          </div>
        </div>`;
      }).join('')}
    </div>` : `
    <div class="card fade-in" style="margin-top:28px;padding:16px;font-size:13px;color:var(--text-muted);text-align:center;">
      <i class="ti ti-users" style="font-size:24px;color:var(--text-dim);display:block;margin-bottom:6px;"></i>
      Cuando tu compañero entre, aparecerá aquí.
    </div>`;

  const me = state.users.find(u=>u.id===state.currentUser);
  const viewOnlyBanner = !state.currentUser ? `
    <div class="banner banner-info"><i class="ti ti-eye"></i>
      <div>Modo solo lectura. <button data-action="switchUser" style="background:transparent;border:none;color:var(--info);text-decoration:underline;cursor:pointer;padding:0;font-size:13px;font-family:inherit;">Inicia sesión</button> para registrar entrenos.</div>
    </div>` : '';

  root.innerHTML = `
    ${configBanner()}
    ${viewOnlyBanner}
    <div class="row fade-in" style="margin-bottom:20px;">
      <div>
        <h1>Mi Rutina</h1>
        <div class="muted" style="font-size:13px;margin-top:2px;">${new Date().toLocaleDateString('es-ES', {weekday:'long', day:'numeric', month:'long'})}</div>
      </div>
      <div class="spacer"></div>
      ${syncIndicator()}
      ${me ? `<button class="user-pill" data-action="userMenu">
        <span class="dot" style="background:${me.color};width:14px;height:14px;border:2px solid var(--bg-elev);box-shadow:0 0 0 1px ${me.color};"></span>${esc(me.name)}
        ${isAdmin() ? '<span class="admin-pill">admin</span>' : ''}
        <i class="ti ti-chevron-down" style="font-size:14px;color:var(--text-muted);"></i>
      </button>` : `<button data-action="switchUser" style="font-size:13px;">Iniciar Sesión</button>`}
    </div>
    <div class="fade-in" style="display:flex;gap:8px;margin-bottom:20px;animation-delay:80ms;">
      <button data-action="goCompare" style="flex:1;padding:14px;background:var(--bg-elev);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:500;border:1px solid var(--border);">
        <i class="ti ti-chart-line" style="font-size:17px;color:var(--accent);"></i> Ver Progreso
      </button>
      <button data-action="goSettings" aria-label="Configuración" style="padding:14px;background:var(--bg-elev);border:1px solid var(--border);">
        <i class="ti ti-settings" style="font-size:17px;color:var(--text-muted);"></i>
      </button>
    </div>
    ${globalMuscleMapBtn}
    ${globalMuscleOverview}
    ${dayCards}
    ${partnersBlock}`;
  attach();
  if (state.currentUser && shouldShowTour()){
    setTimeout(() => startHomeTour(), 500);
  }
}

// ====== DAY ======
function renderDay(){
  const dayKey = state.currentDay;
  const r = getRoutineForDay(dayKey);
  if (!r){
    root.innerHTML = `${headerBar('Día Sin Rutina', 'goHome')}
      <p class="muted">Este día no tiene una rutina asignada todavía.</p>
      ${state.currentUser ? `<button class="primary" data-action="editRoutineNew" data-day="${dayKey}" style="margin-top:10px;">Crear Rutina</button>` : ''}`;
    attach(); return;
  }
  const src = getCurrentSource(dayKey);
  const personalAvail = !!(state.personalRoutines[state.currentUser] && state.personalRoutines[state.currentUser][dayKey]);

  const me = state.users.find(u=>u.id===state.currentUser);
  const meColor = me ? me.color : 'var(--border)';
  const exList = r.exercises.map((ex,idx)=>{
    const ek = exerciseKey(dayKey, idx);
    const myLatest = state.currentUser ? latestEntry(state.currentUser, ek) : null;
    const others = state.users.filter(u=>u.id!==state.currentUser);
    const meDot = state.currentUser ? `<span class="dot" title="Tú" style="background:${myLatest?meColor:'transparent'};border:1.5px solid ${myLatest?meColor:'var(--border-strong)'};"></span>` : '';
    const otherDots = others.map(u=>{
      const has = getEntries(u.id, ek).length > 0;
      return `<span class="dot" title="${esc(u.name)}" style="background:${has?u.color:'transparent'};border:1.5px solid ${has?u.color:'var(--border-strong)'};"></span>`;
    }).join('');
    const { primLabels } = muscleLabels(ex.primary, ex.secondary);
    const musclePill = primLabels.slice(0,2).join(' · ');
    const lastInfo = myLatest ? `<span class="mono" style="font-size:11px;color:var(--accent);">${myLatest.sets.length}×</span> · ${myLatest.date}` : (state.currentUser ? 'Sin registros' : '');
    return `<button data-action="openEx" data-idx="${idx}" class="exercise-card fade-in" style="animation-delay:${idx*30}ms;">
      <div class="row">
        <div style="min-width:0;flex:1;">
          <div style="font-size:14px;font-weight:500;margin-bottom:3px;">${esc(ex.name)}</div>
          <div class="muted" style="font-size:12px;">${esc(musclePill)}${lastInfo ? ' · '+lastInfo : ''}</div>
        </div>
        <div class="user-dots">${meDot}${otherDots}</div>
        <i class="ti ti-chevron-right" style="font-size:18px;color:var(--text-dim);"></i>
      </div>
    </button>`;
  }).join('');

  const switcher = state.currentUser ? `
    <div class="tab-bar">
      <button class="${src==='shared'?'active':''}" data-action="setSource" data-src="shared">
        <i class="ti ti-users" style="font-size:13px;vertical-align:-1px;"></i> Compartida
      </button>
      <button class="${src==='personal'?'active':''}" data-action="setSource" data-src="personal">
        <i class="ti ti-user" style="font-size:13px;vertical-align:-1px;"></i> ${personalAvail ? 'Personal' : 'Crear Personal'}
      </button>
    </div>` : '';

  const editBtn = state.currentUser ? `
    <button data-action="editRoutine" style="margin-bottom:16px;padding:11px;width:100%;background:var(--bg-elev);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:500;">
      <i class="ti ti-edit" style="font-size:15px;color:var(--accent);"></i> Editar ${src==='personal' ? 'Mi Rutina' : 'Rutina Compartida'}
    </button>` : '';
  const routineMapBtn = `
    <button data-action="toggleRoutineMuscles" style="margin-bottom:12px;padding:11px;width:100%;background:${state.showRoutineMuscles?'var(--accent-bg-strong)':'var(--bg-elev)'};color:${state.showRoutineMuscles?'var(--accent)':'var(--text)'};border:1px solid ${state.showRoutineMuscles?'var(--accent-border)':'var(--border)'};display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:500;">
      <i class="ti ti-body-scan" style="font-size:15px;"></i> ${state.showRoutineMuscles ? 'Ocultar Mapa Muscular' : 'Mapa Muscular De La Rutina'}
    </button>`;
  const routineOverview = state.showRoutineMuscles ? routineMuscleOverview(r, {
    title: 'Mapa Muscular Del Día',
    subtitle: 'Resumen de los ejercicios de este día. Sirve para ver qué zonas domina esta sesión.',
    scope: 'day'
  }) : '';

  root.innerHTML = `
    ${headerBar(r.label, 'goHome')}
    <div class="muted fade-in" style="font-size:13px;margin-top:-12px;margin-bottom:16px;">${esc(r.focus)}</div>
    ${switcher}
    ${editBtn}
    ${routineMapBtn}
    ${routineOverview}
    ${exList}`;
  attach();
}

// ====== EXERCISE ======
function renderExercise(){
  const dayKey = state.currentDay;
  const r = getRoutineForDay(dayKey);
  const ex = r.exercises[state.currentExerciseIdx];
  const ek = exerciseKey(dayKey, state.currentExerciseIdx);
  const myEntries = state.currentUser ? getEntries(state.currentUser, ek).slice().sort((a,b)=>b.date.localeCompare(a.date)) : [];
  const lastEntry = myEntries[0]; const prevEntry = myEntries[1];
  const editing = state.editingSession && state.editingSession.uid === state.currentUser && state.editingSession.ek === ek
    ? getEntries(state.currentUser, ek).find(e => e.date === state.editingSession.date)
    : null;
  const formEntry = editing || lastEntry;

  let formHtml = '';
  if (state.currentUser){
    const initialCount = formEntry ? formEntry.sets.length : 4;
    const unilateralMode = !!(formEntry && formEntry.sets && formEntry.sets.some(s => s.unilateral));
    const setRows = [];
    for (let i=0;i<initialCount;i++){
      const set = formEntry && formEntry.sets[i] ? formEntry.sets[i] : null;
      const lastSet = lastEntry && lastEntry.sets[i] ? lastEntry.sets[i] : null;
      setRows.push(renderSetRow(i, set, lastSet, unilateralMode));
    }
    const sessionNotePh = lastEntry && lastEntry.note ? 'Nota anterior: ' + lastEntry.note.slice(0,60) : 'Cómo te sentiste, observaciones, ajustes…';
    formHtml = `<div class="card" style="margin-bottom:18px;">
      <div class="row" style="margin-bottom:14px;">
        <h2>${editing ? 'Editar Sesión' : 'Registrar Sesión'}</h2>
        <div class="spacer"></div>
        <input type="date" id="sessionDate" value="${editing ? esc(editing.date) : today()}" style="width:auto;padding:7px 11px;font-size:13px;font-family:var(--font-mono);" />
      </div>
      ${editing ? `<div class="banner banner-info" style="margin-bottom:12px;"><i class="ti ti-edit"></i><div>Editando la sesión del ${esc(editing.date)}. Puedes cambiar la fecha, sets, peso, reps y notas.</div></div>` : ''}
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap;">
        <label style="display:inline-flex;align-items:center;gap:8px;padding:8px 11px;background:var(--bg-elev-2);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;cursor:pointer;">
          <input id="unilateralMode" type="checkbox" data-action="toggleUnilateral" ${unilateralMode?'checked':''} />
          Unilateral
        </label>
        <button data-action="copyFirstSet" style="padding:8px 11px;font-size:13px;border-color:var(--border);background:var(--bg-elev-2);">
          <i class="ti ti-copy" style="font-size:14px;vertical-align:-2px;color:var(--accent);"></i> Copiar set 1
        </button>
        <div class="muted" style="font-size:11px;flex-basis:100%;line-height:1.35;">Puedes mezclar sets normales y unilaterales. Usa Uni por set; todo se suma al mismo progreso de este ejercicio.</div>
      </div>
      <div class="dim" style="display:grid;grid-template-columns:30px 1fr 1fr 28px;gap:8px;margin-bottom:8px;padding:0 10px;font-size:10px;text-transform:uppercase;letter-spacing:0.08em;font-family:var(--font-mono);">
        <div style="text-align:center;">SET</div><div style="text-align:center;">REPS</div><div style="text-align:center;">PESO (LB)</div><div></div>
      </div>
      <div id="setsContainer">${setRows.join('')}</div>
      <button data-action="addSet" style="margin-top:6px;width:100%;padding:11px;border-style:dashed;color:var(--text-muted);">
        <i class="ti ti-plus" style="font-size:14px;vertical-align:-2px;"></i> Agregar set
      </button>
      <div style="margin-top:16px;">
        <label class="section-label" style="margin-bottom:6px;">
          <i class="ti ti-message" style="font-size:11px;vertical-align:-1px;"></i> Comentario general
        </label>
        <textarea id="sessionNote" rows="2" maxlength="300" placeholder="${esc(sessionNotePh)}" style="resize:vertical;font-family:inherit;">${editing && editing.note ? esc(editing.note) : ''}</textarea>
      </div>
      <button class="primary" data-action="saveSession" style="margin-top:12px;width:100%;padding:13px;font-weight:600;font-size:15px;">${editing ? 'Actualizar Sesión' : 'Guardar Sesión'}</button>
      ${editing ? `<button data-action="cancelEditSession" style="margin-top:8px;width:100%;padding:11px;background:var(--bg-elev);border:1px solid var(--border);">Cancelar Edición</button>` : ''}
      <div id="saveStatus" style="font-size:12px;color:var(--success);text-align:center;margin-top:8px;min-height:14px;"></div>
    </div>`;
  }

  const historyRows = [];
  for (const u of state.users){
    const entries = getEntries(u.id, ek).slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
    for (const e of entries){
      const best = bestSet(e); const vol = totalVolume(e);
      const setNotes = (e.sets||[]).map((s,i)=> s.note ? `Set ${i+1}: ${s.note}` : null).filter(Boolean);
      historyRows.push({ date:e.date, user:u, ek, uid:u.id,
        summary:`${e.sets.length} sets · max ${best ? setMaxWeight(best)+'lb × '+setDisplayReps(best) : '–'} · vol ${Math.round(vol)}`,
        sessionNote: e.note || null, setNotes });
    }
  }
  historyRows.sort((a,b)=>b.date.localeCompare(a.date));
  const historyList = historyRows.slice(0,8).map(h => `<div class="history-entry">
    <div class="row">
      <span class="dot" style="background:${h.user.color};"></span>
      <div style="flex:1;min-width:0;">
        <div style="font-size:13px;font-weight:500;">${esc(h.user.name)} <span class="mono dim" style="font-weight:400;font-size:11px;">· ${h.date}</span></div>
        <div class="muted mono" style="font-size:11px;margin-top:2px;">${h.summary}</div>
      </div>
      ${state.currentUser && h.uid === state.currentUser ? `<div style="display:flex;gap:4px;">
        <button data-action="editSession" data-uid="${h.uid}" data-ek="${h.ek}" data-date="${h.date}" aria-label="Editar" style="padding:6px;border-color:var(--border);"><i class="ti ti-edit" style="font-size:14px;color:var(--accent);"></i></button>
        <button data-action="deleteSession" data-uid="${h.uid}" data-ek="${h.ek}" data-date="${h.date}" aria-label="Eliminar" style="padding:6px;border:none;color:var(--danger);"><i class="ti ti-trash" style="font-size:14px;"></i></button>
      </div>` : ''}
    </div>
    ${h.sessionNote ? `<div class="wrap-text" style="margin-top:8px;padding:7px 10px;background:var(--bg-elev);border-radius:8px;font-size:12px;color:var(--text-muted);font-style:italic;"><i class="ti ti-message" style="font-size:12px;"></i> ${esc(h.sessionNote)}</div>` : ''}
    ${h.setNotes.length ? `<div class="dim wrap-text" style="margin-top:6px;font-size:11px;padding-left:18px;">${h.setNotes.map(n=>esc(n)).join(' · ')}</div>` : ''}
  </div>`).join('') || '<div class="muted" style="font-size:13px;padding:14px;text-align:center;">Sin historial todavía.</div>';

  let progressBadge = '';
  if (lastEntry && prevEntry){
    const lb = bestSet(lastEntry); const pb = bestSet(prevEntry);
    if (lb && pb){
      const diff = setMaxWeight(lb) - setMaxWeight(pb);
      if (diff>0) progressBadge = `<span class="badge" style="background:var(--success-bg);color:var(--success);"><i class="ti ti-trending-up" style="font-size:12px;"></i>+${diff} lb</span>`;
      else if (diff<0) progressBadge = `<span class="badge" style="background:var(--warning-bg);color:var(--warning);"><i class="ti ti-trending-down" style="font-size:12px;"></i>${diff} lb</span>`;
      else progressBadge = `<span class="badge" style="background:var(--bg-elev-2);color:var(--text-muted);">Igual</span>`;
    }
  }

  const altsList = (ex.alts||[]).map(a=> `<li style="padding:8px 0;font-size:14px;color:var(--text-muted);border-bottom:1px solid var(--border);list-style:none;"><i class="ti ti-arrow-right" style="font-size:12px;color:var(--accent);margin-right:6px;"></i>${esc(a)}</li>`).join('');
  const videoUrl = ex.video ? `https://www.youtube.com/results?search_query=${encodeURIComponent(ex.video)}` : '#';
  const { primLabels, secLabels } = muscleLabels(ex.primary, ex.secondary);

  root.innerHTML = `
    ${headerBar(ex.name, 'goDay')}
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;">
      ${ex.video ? `<a href="${videoUrl}" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:6px;padding:9px 14px;background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;text-decoration:none;color:var(--text);font-weight:500;">
        <i class="ti ti-brand-youtube" style="font-size:16px;color:#ff0000;"></i> Ver técnica
      </a>` : ''}
      <button data-action="toggleMuscles" style="background:${state.showMuscles?'var(--accent-bg-strong)':'var(--bg-elev)'};color:${state.showMuscles?'var(--accent)':'var(--text)'};border-color:${state.showMuscles?'var(--accent-border)':'var(--border)'};">
        <i class="ti ti-body-scan" style="font-size:16px;"></i> Músculos
      </button>
      ${(ex.alts && ex.alts.length) ? `<button data-action="toggleAlts" style="background:${state.showAlts?'var(--accent-bg-strong)':'var(--bg-elev)'};color:${state.showAlts?'var(--accent)':'var(--text)'};border-color:${state.showAlts?'var(--accent-border)':'var(--border)'};">
        <i class="ti ti-arrows-shuffle" style="font-size:16px;"></i> Alternativas
      </button>` : ''}
      ${state.currentUser ? `<button data-action="editExerciseFromView" style="padding:9px 14px;font-size:13px;background:var(--bg-elev);border:1px solid var(--border);"><i class="ti ti-edit" style="font-size:14px;vertical-align:-2px;"></i> Editar</button>` : ''}
      ${progressBadge}
    </div>
    ${state.showMuscles ? `<div class="card" style="margin-bottom:16px;">
      ${bodyDiagram(ex.primary, ex.secondary)}
      <div style="display:flex;flex-direction:column;gap:10px;margin-top:14px;">
        <div class="row" style="font-size:13px;">
          <span style="width:14px;height:14px;background:var(--accent);border-radius:4px;flex-shrink:0;"></span>
          <span class="muted">Principal:</span>
          <span style="font-weight:500;">${primLabels.join(', ') || '—'}</span>
        </div>
        ${secLabels.length ? `<div class="row" style="font-size:13px;">
          <span style="width:14px;height:14px;background:var(--warning);border-radius:4px;flex-shrink:0;"></span>
          <span class="muted">Secundario:</span>
          <span style="font-weight:500;">${secLabels.join(', ')}</span>
        </div>` : ''}
      </div>
    </div>` : ''}
    ${state.showAlts && (ex.alts && ex.alts.length) ? `<div class="card" style="margin-bottom:16px;background:var(--bg-elev-2);">
      <div style="font-size:13px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px;"><i class="ti ti-bulb" style="font-size:15px;color:var(--accent);"></i> Si la máquina está ocupada</div>
      <ul style="margin:0;padding:0;list-style:none;">${altsList}</ul>
    </div>` : ''}
    ${formHtml}
    <div class="section-label">Historial reciente</div>
    ${historyList}
    <button data-action="goCompareEx" style="margin-top:16px;width:100%;padding:13px;background:var(--bg-elev);border:1px solid var(--border);font-weight:500;">
        <i class="ti ti-chart-line" style="font-size:16px;vertical-align:-2px;color:var(--accent);"></i> Comparar Progreso
    </button>`;
  attach();
  attachSetHandlers();
}

// ====== COMPARE ======
function renderCompare(){
  const mode = state.compareMode;
  if (mode === 'day') return renderDaily(true);
  const focused = state.currentExerciseIdx != null ? { day: state.currentDay, idx: state.currentExerciseIdx } : null;

  const exerciseOptions = [`<option value="">Todos los ejercicios (volumen total)</option>`];
  for (const dk of getAllDayKeys()){
    const r = getRoutineForDay(dk);
    if (!r) continue;
    exerciseOptions.push(`<optgroup label="${esc(r.label)} - ${esc(r.focus)}">`);
    r.exercises.forEach((ex,idx)=>{
      const val = dk+':'+idx;
      const sel = focused && focused.day===dk && focused.idx===idx ? ' selected' : '';
      exerciseOptions.push(`<option value="${val}"${sel}>${esc(ex.name)}</option>`);
    });
    exerciseOptions.push(`</optgroup>`);
  }

  function getExerciseStats(exKey){
    return state.users.map(u => ({ user:u, buckets: bucketEntries(getEntries(u.id, exKey), mode) }));
  }

  let content = '';
  if (focused){
    const ek = exerciseKey(focused.day, focused.idx);
    const r = getRoutineForDay(focused.day);
    const ex = r ? r.exercises[focused.idx] : null;
    if (ex){
      const stats = getExerciseStats(ek);
      const maxW = Math.max(1, ...stats.flatMap(s=>s.buckets.map(b=>b.maxWeight)));
      const allKeys = Array.from(new Set(stats.flatMap(s=>s.buckets.map(b=>b.key)))).sort();
      content = `<div class="card" style="margin-bottom:16px;">
        <div style="font-size:16px;font-weight:600;margin-bottom:4px;">${esc(ex.name)}</div>
        <div class="muted" style="font-size:12px;margin-bottom:18px;">Peso máximo · ${mode==='week'?'semanal':mode==='month'?'mensual':'anual'}</div>
        ${renderBarChart(stats, allKeys, maxW, false)}
      </div>
      ${stats.map(s => renderUserStatCard(s)).join('')}`;
    }
  } else {
    const byUser = state.users.map(u => {
      const ul = state.logs[u.id] || {};
      const all = []; for (const k in ul) for (const e of ul[k]) all.push(e);
      return { user:u, buckets: bucketEntries(all, mode), totalSessions: all.length };
    });
    const maxV = Math.max(1, ...byUser.flatMap(s=>s.buckets.map(b=>b.totalVolume)));
    const allKeys = Array.from(new Set(byUser.flatMap(s=>s.buckets.map(b=>b.key)))).sort();
    content = `<div class="card" style="margin-bottom:16px;">
      <div style="font-size:16px;font-weight:600;margin-bottom:4px;">Volumen total</div>
      <div class="muted" style="font-size:12px;margin-bottom:18px;">Reps × peso · ${mode==='week'?'semanal':mode==='month'?'mensual':'anual'}</div>
      ${renderBarChart(byUser.map(b=>({...b, buckets: b.buckets.map(x=>({...x, maxWeight: x.totalVolume}))})), allKeys, maxV, true)}
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;">
      ${byUser.map(s => `<div class="stat-card">
        <div class="row" style="margin-bottom:8px;">
          <span class="dot" style="background:${s.user.color};width:14px;height:14px;border:2px solid var(--bg-elev);box-shadow:0 0 0 1px ${s.user.color};"></span>
          <div style="font-size:13px;font-weight:500;">${esc(s.user.name)}</div>
        </div>
        <div class="stat-label">Sesiones totales</div>

function renderBarChart(stats, allKeys, maxVal, isVolume){
  if (!allKeys.length){
    return `<div style="padding:40px 20px;text-align:center;">
      <i class="ti ti-chart-bar-off" style="font-size:36px;color:var(--text-dim);display:block;margin-bottom:8px;"></i>
      <div class="muted" style="font-size:13px;">Sin datos registrados todavía.</div>
    </div>`;
  }
  const numUsers = Math.max(1, stats.length);
  const cH = 180;
  const lH = 32;
  const padL = 32;
  const padR = 10;
  const padT = 24;
  // Compute layout
  const innerW = Math.max(280, allKeys.length * 70);
  const groupW = innerW / allKeys.length;
  const barW = Math.min(36, (groupW - 16) / numUsers);
  const sW = innerW + padL + padR;

  // Y axis gridlines
  const gridLines = [0, 0.25, 0.5, 0.75, 1].map(p => {
    const y = padT + (cH - padT) * (1 - p);
    return `<line x1="${padL}" y1="${y}" x2="${sW - padR}" y2="${y}" stroke="var(--border)" stroke-dasharray="2 4"/>
      <text x="${padL - 6}" y="${y + 3}" text-anchor="end" class="chart-label">${isVolume ? Math.round(maxVal * p) : Math.round(maxVal * p)}</text>`;
  }).join('');

  // Defs for gradients per user
  const defs = stats.map((s, i) => {
    const color = s.user.color;
    return `<linearGradient id="grad-${i}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity="1"/>
      <stop offset="100%" stop-color="${color}" stop-opacity="0.5"/>
    </linearGradient>`;
  }).join('');

  // Bars
  const bars = [];
  allKeys.forEach((k, gi) => {
    const groupX = padL + gi * groupW + (groupW - barW * numUsers) / 2;
    stats.forEach((s, ui) => {
      const b = s.buckets.find(x => x.key === k);
      const val = b ? b.maxWeight : 0;
      const h = Math.max(0, Math.round((val / maxVal) * (cH - padT - 4)));
      const x = groupX + ui * barW;
      const y = padT + (cH - padT - 4) - h;
      bars.push(`<g>
        ${val > 0 ? `<rect class="chart-bar-rect" x="${x + 1}" y="${y}" width="${barW - 2}" height="${h}" fill="url(#grad-${ui})" rx="3"></rect>
        <text x="${x + barW/2}" y="${y - 5}" text-anchor="middle" class="chart-label" style="fill:${s.user.color};font-weight:500;">${isVolume ? Math.round(val) : val}</text>` : ''}
      </g>`);
    });
    // X axis label
    const lx = padL + gi * groupW + groupW / 2;
    bars.push(`<text x="${lx}" y="${cH + 18}" text-anchor="middle" class="chart-label">${formatBucket(k, state.compareMode)}</text>`);
  });

  const legend = stats.map(s => `<div style="display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted);">
    <span style="width:12px;height:12px;border-radius:3px;background:linear-gradient(180deg, ${s.user.color}, ${s.user.color}88);"></span>${esc(s.user.name)}
  </div>`).join('');

  return `<div style="overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;">
    <svg viewBox="0 0 ${sW} ${cH + lH}" width="${Math.max(sW, 320)}" height="${cH + lH}" style="display:block;min-width:100%;">
      <defs>${defs}</defs>
      ${gridLines}
      ${bars.join('')}
    </svg>
  </div>
  <div style="display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--border);">${legend}</div>`;
}

function renderUserStatCard(s){
  if (!s.buckets.length){
    return `<div class="stat-card" style="margin-bottom:8px;">
      <div class="row">
        <span class="dot" style="background:${s.user.color};"></span>
        <div style="font-size:14px;font-weight:500;">${esc(s.user.name)}</div>
        <div class="spacer"></div>
        <div class="muted" style="font-size:12px;">Sin registros</div>
      </div>
    </div>`;
  }
  const f = s.buckets[0]; const l = s.buckets[s.buckets.length-1];
  const diff = l.maxWeight - f.maxWeight;
  const pct = f.maxWeight ? Math.round((diff/f.maxWeight)*100) : 0;
  const arrowColor = diff>0 ? 'var(--success)' : diff<0 ? 'var(--warning)' : 'var(--text-muted)';
  const arrow = diff>0 ? '<i class="ti ti-trending-up"></i>' : diff<0 ? '<i class="ti ti-trending-down"></i>' : '<i class="ti ti-minus"></i>';
  return `<div class="stat-card" style="margin-bottom:10px;">
    <div class="row" style="margin-bottom:14px;">
      <span class="dot" style="background:${s.user.color};width:14px;height:14px;border:2px solid var(--bg-elev);box-shadow:0 0 0 1px ${s.user.color};"></span>
      <div style="font-size:14px;font-weight:500;">${esc(s.user.name)}</div>
      <div class="spacer"></div>
      <div style="display:flex;align-items:center;gap:6px;font-size:13px;color:${arrowColor};font-weight:500;">${arrow}<span class="mono">${diff>=0?'+':''}${diff} lb (${pct>=0?'+':''}${pct}%)</span></div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;">
      <div><div class="stat-label" style="margin-bottom:4px;">Primer</div><div class="stat-value" style="font-size:18px;">${f.maxWeight}<span style="font-size:11px;color:var(--text-dim);margin-left:3px;">lb</span></div></div>
      <div><div class="stat-label" style="margin-bottom:4px;">Último</div><div class="stat-value" style="font-size:18px;color:${s.user.color};">${l.maxWeight}<span style="font-size:11px;color:var(--text-dim);margin-left:3px;">lb</span></div></div>
      <div><div class="stat-label" style="margin-bottom:4px;">Sesiones</div><div class="stat-value" style="font-size:18px;">${s.buckets.reduce((x,b)=>x+b.sessions,0)}</div></div>
    </div>
  </div>`;
}
function formatBucket(key, mode){
  if (mode==='week'){ const d = new Date(key); return d.toLocaleDateString('es', {month:'short', day:'numeric'}); }
  if (mode==='month'){ const [y,m] = key.split('-'); return new Date(Number(y), Number(m)-1, 1).toLocaleDateString('es', {month:'short', year:'2-digit'}); }
  return key;
}

// ====== DAILY PROGRESS ======
function renderDaily(insideProgress = false){
  const rows = [];
  for (const u of state.users){
    const userLogs = state.logs[u.id] || {};
    for (const ek in userLogs){
      for (const entry of userLogs[ek] || []){
        if (entry.date === state.dailyDate){
          const best = bestSet(entry);
          rows.push({ user:u, ek, entry, best, volume: totalVolume(entry) });
        }
      }
    }
  }
  rows.sort((a,b)=> a.user.name.localeCompare(b.user.name) || exerciseNameForKey(a.ek).localeCompare(exerciseNameForKey(b.ek)));
  const totals = rows.reduce((acc,r)=>{
    acc.sessions += 1;
    acc.sets += (r.entry.sets || []).length;
    acc.volume += r.volume;
    acc.max = Math.max(acc.max, r.best ? setMaxWeight(r.best) : 0);
    return acc;
  }, { sessions:0, sets:0, volume:0, max:0 });
  const list = rows.map(r => {
    const mine = state.currentUser && r.user.id === state.currentUser;
    const setText = (r.entry.sets || []).map((set,i)=>formatSetLine(set, i)).join(' · ');
    return `<div class="history-entry">
      <div class="row" style="align-items:flex-start;">
        <span class="dot" style="background:${r.user.color};width:14px;height:14px;margin-top:3px;"></span>
        <div style="flex:1;min-width:0;">
          <div style="font-size:13px;font-weight:600;">${esc(r.user.name)} · ${esc(exerciseNameForKey(r.ek))}</div>
          <div class="muted mono" style="font-size:11px;margin-top:2px;">${(r.entry.sets||[]).length} sets · max ${r.best ? setMaxWeight(r.best)+'lb × '+setDisplayReps(r.best) : '–'} · vol ${Math.round(r.volume)}</div>
          <div class="dim wrap-text" style="font-size:11px;margin-top:6px;">${esc(setText)}</div>
          ${r.entry.note ? `<div class="wrap-text" style="margin-top:7px;padding:7px 10px;background:var(--bg-elev);border-radius:8px;font-size:12px;color:var(--text-muted);font-style:italic;"><i class="ti ti-message" style="font-size:12px;"></i> ${esc(r.entry.note)}</div>` : ''}
        </div>
        ${mine ? `<div style="display:flex;gap:4px;">
          <button data-action="editSession" data-uid="${r.user.id}" data-ek="${r.ek}" data-date="${r.entry.date}" aria-label="Editar" style="padding:6px;border-color:var(--border);"><i class="ti ti-edit" style="font-size:14px;color:var(--accent);"></i></button>
          <button data-action="deleteSession" data-uid="${r.user.id}" data-ek="${r.ek}" data-date="${r.entry.date}" aria-label="Eliminar" style="padding:6px;border:none;color:var(--danger);"><i class="ti ti-trash" style="font-size:14px;"></i></button>
        </div>` : ''}
      </div>
    </div>`;
  }).join('');

  root.innerHTML = `
    ${headerBar(insideProgress ? 'Progreso' : 'Progreso diario', 'goHome')}
    ${insideProgress ? `<div class="tab-bar">
      ${['day','week','month','year'].map(m => `<button class="${state.compareMode===m?'active':''}" data-action="setMode" data-mode="${m}">${m==='day'?'Día':m==='week'?'Semana':m==='month'?'Mes':'Año'}</button>`).join('')}
    </div>` : ''}
    <div class="card" style="margin-bottom:16px;">
      <label class="section-label" style="margin-bottom:6px;">Fecha</label>
      <input id="dailyDate" class="date-field" type="date" value="${esc(state.dailyDate)}" />
    </div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px;">
      <div class="stat-card"><div class="stat-label">Sesiones</div><div class="stat-value" style="font-size:18px;">${totals.sessions}</div></div>
      <div class="stat-card"><div class="stat-label">Sets</div><div class="stat-value" style="font-size:18px;">${totals.sets}</div></div>
      <div class="stat-card"><div class="stat-label">Volumen</div><div class="stat-value" style="font-size:18px;">${Math.round(totals.volume)}</div></div>
      <div class="stat-card"><div class="stat-label">Max</div><div class="stat-value" style="font-size:18px;">${totals.max}<span style="font-size:10px;color:var(--text-dim);">lb</span></div></div>

    ${list || '<div class="card" style="text-align:center;padding:24px;color:var(--text-muted);font-size:13px;">No hay sesiones guardadas en esta fecha.</div>'}`;
  attach();
  document.getElementById('dailyDate')?.addEventListener('change', e => { state.dailyDate = e.target.value || today(); render(); });

function renderEditExercise(){
  const dayKey = state.currentDay;
  const src = getCurrentSource(dayKey);
  let routine;
  if (src === 'personal'){
    routine = (state.personalRoutines[state.currentUser] || {})[dayKey];
  } else {
    routine = state.sharedRoutine && state.sharedRoutine[dayKey];
  }
  const idx = state.currentExerciseIdx;
  const isNew = idx === -1 || idx == null;
  const ex = isNew ? { name:'', video:'', primary:[], secondary:[], alts:[] } : (routine && routine.exercises[idx]) || { name:'', video:'', primary:[], secondary:[], alts:[] };

  window._editEx = JSON.parse(JSON.stringify(ex));

  const muscleChips = MUSCLE_IDS.map(m => {
    const isP = window._editEx.primary.includes(m);

      <span>${MUSCLES[m].label}</span>

  const altsRows = (window._editEx.alts || []).map((a,i) => `
    <div class="alt-row">

      <button data-action="removeAlt" data-i="${i}" style="padding:6px;border:none;color:var(--danger);"><i class="ti ti-x" style="font-size:14px;"></i></button>

  root.innerHTML = `

      <label class="section-label" style="margin-bottom:6px;">Nombre</label>
      <input id="exName" type="text" value="${esc(window._editEx.name)}" maxlength="80" style="margin-bottom:12px;" />
      <label class="section-label" style="margin-bottom:6px;">Búsqueda del video en YouTube</label>
      <input id="exVideo" type="text" value="${esc(window._editEx.video)}" maxlength="120" placeholder="ej: lat pulldown technique" />
      <div class="muted" style="font-size:11px;margin-top:6px;">En inglés funciona mejor para encontrar videos.</div>
    </div>

    <div class="section-label">Músculos trabajados</div>
    <div class="muted" style="font-size:12px;margin-bottom:10px;">Toca para alternar: vacío → <strong style="color:var(--accent);">principal ●●</strong> → <strong style="color:var(--warning);">secundario ●</strong> → vacío</div>
    <div class="muscle-grid" id="muscleGrid">${muscleChips}</div>

    <div class="section-label" style="margin-top:24px;">Alternativas (si la máquina está ocupada)</div>
    <div id="altsContainer">${altsRows}</div>
    <button data-action="addAlt" style="margin-top:6px;width:100%;padding:11px;border-style:dashed;color:var(--text-muted);">
      <i class="ti ti-plus" style="font-size:14px;vertical-align:-2px;"></i> Agregar alternativa
    </button>

    <button class="primary" data-action="saveExercise" style="margin-top:20px;width:100%;padding:14px;font-weight:600;font-size:15px;">
      ${isNew ? 'Crear ejercicio' : 'Guardar cambios'}
