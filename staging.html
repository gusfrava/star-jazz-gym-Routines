<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0a0e1a">
<title>Rutina del Gym 💪</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💪%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.11.0/dist/tabler-icons.min.css">
<style>
:root {
  --bg:#0a0e1a;
  --bg-grad: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(59,158,255,0.15), transparent 70%), #0a0e1a;
  --bg-elev:#10172a;
  --bg-elev-2:#1a2440;
  --bg-elev-3:#243156;
  --border:rgba(255,255,255,0.06);
  --border-strong:rgba(255,255,255,0.12);
  --border-accent:rgba(59,158,255,0.3);
  --text:#f0f4ff;
  --text-muted:#8b96b3;
  --text-dim:#5a6585;
  --accent:#3b9eff;
  --accent-hover:#5cb0ff;
  --accent-glow:rgba(59,158,255,0.35);
  --accent-bg:rgba(59,158,255,0.12);
  --accent-bg-strong:rgba(59,158,255,0.2);
  --accent-border:rgba(59,158,255,0.4);
  --accent-grad: linear-gradient(135deg, #3b9eff 0%, #6ec2ff 100%);
  --accent-grad-soft: linear-gradient(135deg, rgba(59,158,255,0.15), rgba(110,194,255,0.05));
  --success:#34d399;
  --success-bg:rgba(52,211,153,0.12);
  --warning:#fbbf24;
  --warning-bg:rgba(251,191,36,0.12);
  --danger:#f87171;
  --danger-bg:rgba(248,113,113,0.12);
  --info:#60a5fa;
  --info-bg:rgba(96,165,250,0.12);
  --radius:14px;
  --radius-sm:10px;
  --radius-lg:20px;
  --radius-pill:999px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.25), 0 1px 3px rgba(0,0,0,0.15);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4), 0 2px 6px rgba(0,0,0,0.2);
  --shadow-glow: 0 0 0 1px rgba(59,158,255,0.3), 0 8px 24px rgba(59,158,255,0.25);
  --font-sans: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'Geist Mono', ui-monospace, monospace;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg:#f5f8ff;
    --bg-grad: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(59,158,255,0.12), transparent 70%), #f5f8ff;
    --bg-elev:#ffffff;
    --bg-elev-2:#eef3fc;
    --bg-elev-3:#dfe8f7;
    --border:rgba(15,23,42,0.06);
    --border-strong:rgba(15,23,42,0.12);
    --text:#0f172a;
    --text-muted:#5e6c87;
    --text-dim:#94a3b8;
    --accent:#1e7fe6;
    --accent-bg:rgba(59,158,255,0.1);
    --accent-bg-strong:rgba(59,158,255,0.18);
    --accent-border:rgba(59,158,255,0.35);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg-grad);background-attachment:fixed;color:var(--text);
  font-family:var(--font-sans);font-size:15px;line-height:1.5;font-feature-settings:'cv11','ss01';
  letter-spacing:-0.005em;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
#app{max-width:720px;margin:0 auto;padding:20px 18px 80px;min-height:100vh}
h1,h2,h3{font-weight:600;margin:0;letter-spacing:-0.02em}
h1{font-size:26px;line-height:1.15}h2{font-size:18px}h3{font-size:15px}
button{font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;background:transparent;color:var(--text);
  border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:9px 16px;
  transition:all 0.18s cubic-bezier(0.4,0,0.2,1);letter-spacing:-0.005em}
button:hover{background:var(--bg-elev-2)}
button:active{transform:scale(0.97)}
button:disabled{opacity:0.4;cursor:not-allowed}
button.primary{background:var(--accent-grad);color:#fff;border-color:transparent;
  box-shadow:0 2px 8px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,0.2);font-weight:600}
button.primary:hover{filter:brightness(1.08);box-shadow:0 4px 16px var(--accent-glow);transform:translateY(-1px)}
button.danger{background:var(--danger);color:#fff;border-color:transparent;}
input,textarea,select{font-family:inherit;font-size:14px;background:var(--bg-elev);color:var(--text);
  border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:11px 14px;width:100%;
  transition:all 0.18s ease;letter-spacing:-0.005em}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-bg)}
.card{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow-sm)}
.muted{color:var(--text-muted)}.dim{color:var(--text-dim)}.mono{font-family:var(--font-mono)}
.row{display:flex;align-items:center;gap:10px}.spacer{flex:1}
.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:var(--radius-pill);
  font-size:12px;font-weight:500;letter-spacing:-0.005em}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(10px);
  background:var(--bg-elev-3);color:var(--text);padding:12px 22px;border-radius:var(--radius-pill);
  border:1px solid var(--border-accent);box-shadow:var(--shadow-lg);
  font-size:13px;font-weight:500;z-index:500;opacity:0;pointer-events:none;
  transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);letter-spacing:-0.005em}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.loader{display:inline-block;width:16px;height:16px;border:2px solid var(--border-strong);
  border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.modal-backdrop{position:fixed;inset:0;background:rgba(5,10,25,0.7);backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);z-index:400;display:flex;align-items:center;justify-content:center;
  padding:16px;animation:fadeIn 0.2s ease}
.modal{background:var(--bg-elev);border:1px solid var(--border-strong);border-radius:var(--radius-lg);
  padding:24px;max-width:440px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);
  animation:slideUp 0.3s cubic-bezier(0.34,1.56,0.64,1)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px) scale(0.96)}to{opacity:1;transform:translateY(0) scale(1)}}

/* Unified 2D Shimmering Elegance */
.shimmering-banner {
  background: linear-gradient(120deg, var(--bg-elev-2) 0%, var(--accent-bg-strong) 50%, var(--bg-elev-2) 100%);
  background-size: 200% auto;
  animation: fluidShimmer 4s linear infinite;
  border: 1px solid var(--accent-border);
  border-radius: var(--radius-sm);
  padding: 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  color: var(--text);
  box-shadow: var(--shadow-sm);
}
@keyframes fluidShimmer {
  to { background-position: 200% center; }
}

.tab-bar{display:flex;background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);
  padding:4px;gap:4px;margin-bottom:16px}
.tab-bar button{flex:1;padding:9px 12px;border:none;background:transparent;font-size:13px;
  color:var(--text-muted);border-radius:8px;transition:all 0.2s ease;letter-spacing:-0.005em}
.tab-bar button:hover{color:var(--text);background:var(--bg-elev-2)}
.tab-bar button.active{background:var(--accent-grad);color:#fff;font-weight:600;}

.day-card, .exercise-card { background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px 16px;margin-bottom:10px;display:block;width:100%;text-align:left;font:inherit;color:inherit;
  cursor:pointer;transition:all 0.2s ease; position:relative; overflow:hidden;}
.day-card:hover, .exercise-card:hover { border-color:var(--border-accent); transform:translateY(-1px); }
.user-pill{display:inline-flex;align-items:center;gap:7px;padding:5px 12px 5px 6px;
  border-radius:var(--radius-pill);font-size:13px;background:var(--bg-elev);border:1px solid var(--border);
  font-weight:500;cursor:pointer;transition:all 0.15s;}
.user-pill:hover{background:var(--accent-bg); border-color:var(--accent-border);}
.history-entry{padding:12px;background:var(--bg-elev-2);border:1px solid var(--border);
  border-radius:var(--radius-sm);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;}
.action-btn { background:transparent; border:none; padding:4px; color:var(--text-muted); font-size:16px; border-radius:4px;}
.action-btn:hover { color:var(--text); background:var(--border-strong);}
.read-only-mask { opacity: 0.6; pointer-events: none; }
</style>
</head>
<body>
<div id="app">
  <div style="text-align:center;padding:60px 20px;color:var(--text-muted);font-size:14px;">
    <div class="loader" style="margin:0 auto 14px;"></div>
    <div>Cargando Isla...</div>
  </div>
</div>
<div id="toast" class="toast"></div>
<div id="modalRoot"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, deleteDoc, onSnapshot, collection, getDocs, updateDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

// ====== FIREBASE CONFIG ======
const firebaseConfig = {
  apiKey: "AIzaSyCtBoM682hSEh2Og7PHbsO7wDGHwqiCiKU",
  authDomain: "progreso-de-rutinas.firebaseapp.com",
  projectId: "progreso-de-rutinas",
  storageBucket: "progreso-de-rutinas.firebasestorage.app",
  messagingSenderId: "1080289668591",
  appId: "1:1080289668591:web:f902974b98717bc71b1a1a"
};

const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);

// ====== STATE & GROUPS ======
const state = {
  currentGroup: localStorage.getItem('currentGroup') || "jazmin-y-buddy-2026",
  joinedGroups: JSON.parse(localStorage.getItem('joinedGroups') || '["jazmin-y-buddy-2026"]'),
  users: [], currentUser: localStorage.getItem('currentUser') || null,
  spectatorId: null, logs: [],
  view: 'home', routineSource: 'shared', // 'shared' or 'personal'
  dailyDate: new Date().toISOString().split('T')[0] // Format: YYYY-MM-DD
};

const ADMIN_NAME = "Jazmin";

// ====== ROUTINE STRUCTURE (7 DAYS) ======
const DAY_ORDER = ['lunes','martes','miercoles','jueves','viernes','sabado','domingo'];
const DEFAULT_ROUTINE = {
  lunes: {label:'Lunes',focus:'Descanso / Full Body',icon:'ti-barbell',exercises:[]},
  martes: {label:'Martes',focus:'Pierna (Cuádriceps)',icon:'ti-run',exercises:[]},
  miercoles: {label:'Miércoles',focus:'Espalda / Bíceps',icon:'ti-stretching',exercises:[]},
  jueves: {label:'Jueves',focus:'Pierna (Femoral)',icon:'ti-run',exercises:[]},
  viernes: {label:'Viernes',focus:'Pecho / Hombro',icon:'ti-stretching',exercises:[]},
  sabado: {label:'Sábado',focus:'Full Body',icon:'ti-barbell',exercises:[]},
  domingo: {label:'Domingo',focus:'Descanso Activo',icon:'ti-walk',exercises:[]}
};

// ====== HELPERS ======
const $ = id => document.getElementById(id);
const toast = msg => {
  const el = $('toast'); el.textContent = msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 3000);
};

// ====== DATA LAYER ======
async function loadGroupData() {
  const usersSnap = await getDocs(collection(db, `salas/${state.currentGroup}/users`));
  state.users = usersSnap.docs.map(d=>d.data());
  
  onSnapshot(collection(db, `salas/${state.currentGroup}/logs`), snap => {
    state.logs = snap.docs.map(d=>({id: d.id, ...d.data()}));
    render();
  });
}

function saveGroupChange(groupId) {
  state.currentGroup = groupId;
  localStorage.setItem('currentGroup', groupId);
  if (!state.joinedGroups.includes(groupId)) {
    state.joinedGroups.push(groupId);
    localStorage.setItem('joinedGroups', JSON.stringify(state.joinedGroups));
  }
  loadGroupData();
}

async function addLog(dayId, exIdx, reps, weight, note) {
  const id = Date.now().toString();
  await setDoc(doc(db, `salas/${state.currentGroup}/logs/${id}`), {
    userId: state.currentUser, dayId, exIdx, reps, weight, note,
    date: new Date().toISOString()
  });
}

async function deleteLog(logId) {
  if(confirm("¿Seguro que quieres eliminar este registro?")) {
    await deleteDoc(doc(db, `salas/${state.currentGroup}/logs/${logId}`));
    toast("Registro eliminado");
  }
}

// ====== RENDER LAYER ======
function render() {
  const app = $('app');
  if(!state.currentUser) return renderLogin(app);

  let html = `
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
      <h1 style="font-size:22px;">Isla: <span style="color:var(--accent)">${state.currentGroup}</span></h1>
      <button class="primary" onclick="window.changeGroupModal()">Cambiar Isla</button>
    </div>
  `;

  // Spectator Banner
  if (state.spectatorId) {
    const specUser = state.users.find(u => u.id === state.spectatorId);
    html += `
      <div class="shimmering-banner">
        <div>
          <i class="ti ti-eye"></i> Viendo progreso de <b>${specUser?.name || 'Compañero'}</b>
        </div>
        <button class="ghost-danger" style="padding:4px 8px; font-size:12px;" onclick="window.exitSpectator()">Salir</button>
      </div>
    `;
  }

  // Compañeros
  html += `<div style="margin-bottom:20px; display:flex; gap:8px; overflow-x:auto;">`;
  state.users.forEach(u => {
    html += `
      <div class="user-pill ${state.spectatorId===u.id ? 'active' : ''}" onclick="window.toggleSpectator('${u.id}')">
        <div class="dot" style="background:${u.color || 'var(--accent)'}"></div>
        ${u.name} ${u.id === state.currentUser ? '(Tú)' : ''}
      </div>`;
  });
  html += `</div>`;

  // Tabs: Semana vs Progreso Diario
  html += `
    <div class="tab-bar">
      <button class="${state.view === 'home' ? 'active' : ''}" onclick="window.setView('home')">Rutina Semanal</button>
      <button class="${state.view === 'daily' ? 'active' : ''}" onclick="window.setView('daily')">Progreso Diario</button>
    </div>
  `;

  if (state.view === 'home') html += renderWeek();
  if (state.view === 'daily') html += renderDaily();

  app.innerHTML = html;
}

function renderWeek() {
  let html = `<div class="section-label">Días de Entrenamiento</div>`;
  DAY_ORDER.forEach(day => {
    const d = DEFAULT_ROUTINE[day];
    html += `
      <button class="day-card" onclick="window.openDay('${day}')">
        <div class="row">
          <div class="icon-tile"><i class="ti ${d.icon}"></i></div>
          <div>
            <div style="font-weight:600">${d.label}</div>
            <div class="muted" style="font-size:13px">${d.focus}</div>
          </div>
        </div>
      </button>
    `;
  });
  return html;
}

function renderDaily() {
  const dateLogs = state.logs.filter(l => l.date.startsWith(state.dailyDate));
  let html = `
    <div class="card" style="margin-bottom:16px;">
      <input type="date" value="${state.dailyDate}" onchange="window.setDailyDate(this.value)" style="margin-bottom:14px;">
      <h3 style="margin-bottom:10px;">Resumen del Día</h3>
  `;
  if(dateLogs.length === 0) {
    html += `<div class="muted">No hay actividad registrada en esta fecha.</div>`;
  } else {
    dateLogs.forEach(l => {
      const u = state.users.find(us => us.id === l.userId);
      html += `
        <div class="history-entry">
          <div>
            <span class="badge" style="background:${u?.color}22; color:${u?.color}; margin-bottom:4px;">${u?.name}</span>
            <div><b>${l.weight} lbs</b> × ${l.reps} reps</div>
            ${l.note ? `<div class="muted" style="font-size:12px;">"${l.note}"</div>` : ''}
          </div>
          ${!state.spectatorId && l.userId === state.currentUser ? `
            <button class="action-btn" onclick="window.deleteLog('${l.id}')"><i class="ti ti-trash"></i></button>
          ` : ''}
        </div>
      `;
    });
  }
  html += `</div>`;
  return html;
}

function renderLogin(app) {
  app.innerHTML = `
    <div style="max-width:320px; margin: 80px auto; text-align:center;">
      <div class="icon-tile" style="margin: 0 auto 20px; width:64px; height:64px; font-size:32px;">🏝️</div>
      <h2 style="margin-bottom:20px;">Unirse a una Isla</h2>
      <input type="text" id="loginName" placeholder="Tu Nombre" style="margin-bottom:12px;">
      <input type="text" id="groupName" placeholder="Nombre del Grupo/Isla" value="${state.currentGroup}" style="margin-bottom:20px;">
      <button class="primary" style="width:100%" onclick="window.login()">Entrar</button>
    </div>
  `;
}

// ====== EXPOSED ACTIONS ======
window.setView = v => { state.view = v; render(); };
window.setDailyDate = d => { state.dailyDate = d; render(); };
window.toggleSpectator = id => { state.spectatorId = state.spectatorId === id ? null : id; render(); };
window.exitSpectator = () => { state.spectatorId = null; render(); };
window.deleteLog = deleteLog;

window.login = async () => {
  const name = $('loginName').value.trim();
  const group = $('groupName').value.trim();
  if(!name || !group) return toast("Llena ambos campos");
  
  const uid = name.toLowerCase().replace(/\s+/g,'-');
  localStorage.setItem('currentUser', uid);
  state.currentUser = uid;
  saveGroupChange(group);
  
  // Create user profile if not exists
  await setDoc(doc(db, `salas/${group}/users/${uid}`), { id:uid, name, color:'#3b9eff' }, {merge:true});
};

window.changeGroupModal = () => {
  const group = prompt("Escribe el nombre de la Isla a la que quieres cambiar:", state.currentGroup);
  if(group && group !== state.currentGroup) {
    saveGroupChange(group.trim());
  }
};

window.openDay = day => {
  toast("Funcionalidad de Ejercicios en desarrollo para la estructura de Grupos.");
  // (La lógica interna de ejercicios se conectaría aquí siguiendo la estructura anterior)
};

// Start
loadGroupData();
</script>
</body>
</html>
