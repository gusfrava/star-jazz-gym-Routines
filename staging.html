      fields.forEach(cls => {
        const src = first.querySelector('.'+cls);
        const dst = row.querySelector('.'+cls);
        if (src && dst && !dst.value) dst.value = src.value;
      });
      renderCopiedDrops(row, firstDraft, measurement);
    });
    toast('Set 1 copiado a los campos vacíos');
    return;
  }
  if (a === 'addSet'){
    const c = document.getElementById('setsContainer'); const n = c.children.length + 1;
    const unilateral = !!document.getElementById('unilateralMode')?.checked;
    const measurement = c.querySelector('.set-row')?.dataset.measurement || exerciseMeasurementType(getRoutineForDay(state.currentDay)?.exercises?.[state.currentExerciseIdx]);
    const prev = c.lastElementChild;
    let seed = null;
    if (prev){
      seed = setDraftFromRow(prev, measurement);
    }
    c.insertAdjacentHTML('beforeend', renderSetRow(n - 1, seed, null, seed ? !!seed.unilateral : unilateral, measurement));
    const added = c.lastElementChild;
    if (added) {
      added.querySelectorAll('.del-set').forEach(b => b.addEventListener('click', ()=> added.remove()));
      added.querySelector('.set-unilateral')?.addEventListener('change', e => setRowUnilateral(added, e.target.checked));
      added.querySelector('.set-drop')?.addEventListener('change', e => setRowDrop(added, e.target.checked));
      added.querySelector('.add-drop')?.addEventListener('click', () => addDropRow(added));
    }
    return;
  }
  if (a === 'saveSession'){
    if (!state.currentUser){ toast('Inicia sesión para registrar'); return; }
    if (!authValid()) { toast('Sesión expirada, vuelve a entrar'); return; }
    const date = document.getElementById('sessionDate').value || today();
    const rows = document.querySelectorAll('.set-row');
    const sets = [];
    const currentExercise = getRoutineForDay(state.currentDay)?.exercises?.[state.currentExerciseIdx];
    const measurement = exerciseMeasurementType(currentExercise);
    rows.forEach(r => {
      const note = (r.querySelector('.note-in').value || '').trim();
      const rowUnilateral = !!r.querySelector('.set-unilateral')?.checked;
      const drops = readDropRows(r, rowUnilateral, measurement);
      if (measurement === 'time'){
        const minutes = Number(r.querySelector('.time-min-in')?.value || 0);
        const seconds = Number(r.querySelector('.time-sec-in')?.value || 0);
        const durationSeconds = minutes * 60 + seconds;
        if (durationSeconds > 0){
          const s = { durationSeconds, minutes, seconds };
          if (note) s.note = note;
          sets.push(s);
        }
      } else if (rowUnilateral){
        const left = {
          reps: Number(r.querySelector('.left-reps-in').value),
          weight: measurement === 'reps_only' ? 0 : Number(r.querySelector('.left-weight-in')?.value || 0)
        };
        const right = {
          reps: Number(r.querySelector('.right-reps-in').value),
          weight: measurement === 'reps_only' ? 0 : Number(r.querySelector('.right-weight-in')?.value || 0)
        };
        if (left.reps > 0 && left.weight >= 0 && !(right.reps > 0)){
          right.reps = left.reps; right.weight = left.weight;
        }
        if (right.reps > 0 && right.weight >= 0 && !(left.reps > 0)){
          left.reps = right.reps; left.weight = right.weight;
        }
        if ((left.reps > 0 && left.weight >= 0) || (right.reps > 0 && right.weight >= 0)){
          const s = { unilateral:true, left, right, reps:setDisplayReps({unilateral:true,left,right}), weight:setMaxWeight({unilateral:true,left,right}) };
          if (drops.length) s.drops = drops;
          if (note) s.note = note;
          sets.push(s);
        }
      } else {
        const reps = Number(r.querySelector('.reps-in').value);
        const weight = measurement === 'reps_only' ? 0 : Number(r.querySelector('.weight-in')?.value || 0);
        if (reps > 0 && weight >= 0){
          const s = measurement === 'reps_only' ? { reps } : { reps, weight };
          if (drops.length) s.drops = drops;
          if (note) s.note = note;
          sets.push(s);
        }
      }
    });
    const sessionNote = (document.getElementById('sessionNote').value || '').trim();
    const status = document.getElementById('saveStatus');
    if (!sets.length){ status.style.color = 'var(--warning)'; status.textContent = measurement === 'time' ? 'Ingresa al menos un set con tiempo.' : 'Ingresa al menos un set con reps.'; return; }
    const ek = exerciseKey(state.currentDay, state.currentExerciseIdx);
    const userLogs = state.logs[state.currentUser] || {};
    if (!userLogs[ek]) userLogs[ek] = [];
    if (state.editingSession && state.editingSession.ek === ek && state.editingSession.uid === state.currentUser && state.editingSession.date !== date){
      userLogs[ek] = userLogs[ek].filter(e => e.date !== state.editingSession.date);
    }
    const idx = userLogs[ek].findIndex(e => e.date === date);
    const entry = { date, sets, measurement }; if (sessionNote) entry.note = sessionNote;
    if (idx >= 0) userLogs[ek][idx] = entry; else userLogs[ek].push(entry);
    state.logs[state.currentUser] = userLogs;
    await saveUserLogs(state.currentUser, userLogs);
    status.style.color = 'var(--success)'; status.textContent = '✓ Guardado. Sigue así 💪';
    state.editingSession = null;
    toast('Sesión guardada');
    setTimeout(()=> render(), 600);
    return;
  }
  if (a === 'cancelEditSession'){
    state.editingSession = null;
    render(); return;
  }
  if (a === 'editSession'){
    const uid = btn.dataset.uid;
    if (uid !== state.currentUser){ toast('Solo puedes editar tus sesiones'); return; }
    const [day, idx] = btn.dataset.ek.split(':');
    state.currentDay = day;
    state.currentExerciseIdx = Number(idx);
    state.editingSession = { uid, ek: btn.dataset.ek, date: btn.dataset.date };
    state.view = 'exercise';
    state.showAlts = false;
    state.showMuscles = false;
    render(); return;
  }
  if (a === 'deleteSession'){
    const uid = btn.dataset.uid;
    if (uid !== state.currentUser){ toast('Solo puedes borrar tus sesiones'); return; }
    openModal(`
      <h2 style="margin-bottom:8px;color:var(--danger);">Eliminar sesión</h2>
      <p style="font-size:14px;margin:0 0 14px;">¿Seguro que quieres borrar la sesión de <strong>${esc(exerciseNameForKey(btn.dataset.ek))}</strong> del <strong>${esc(btn.dataset.date)}</strong>?</p>
      <div style="display:flex;gap:8px;">
        <button data-action="closeModal" style="flex:1;padding:10px;">Cancelar</button>
        <button class="danger" data-action="confirmDeleteSession" data-uid="${uid}" data-ek="${btn.dataset.ek}" data-date="${btn.dataset.date}" style="flex:1;padding:10px;font-weight:600;">Eliminar</button>
      </div>
    `, () => { modalRoot.querySelectorAll('[data-action]').forEach(el => el.addEventListener('click', handle)); });
    return;
  }
  if (a === 'confirmDeleteSession'){
    const uid = btn.dataset.uid;
    const ek = btn.dataset.ek;
    const date = btn.dataset.date;
    if (uid !== state.currentUser){ toast('Solo puedes borrar tus sesiones'); return; }
    const userLogs = state.logs[uid] || {};
    userLogs[ek] = (userLogs[ek] || []).filter(e => e.date !== date);
    if (!userLogs[ek].length) delete userLogs[ek];
    state.logs[uid] = userLogs;
    await saveUserLogs(uid, userLogs);
    if (state.editingSession && state.editingSession.uid === uid && state.editingSession.ek === ek && state.editingSession.date === date) state.editingSession = null;
    closeModal(); toast('Sesión eliminada'); render(); return;
  }
  if (a === 'setMode'){ state.compareMode = btn.dataset.mode; render(); return; }

  // ====== EDIT ROUTINE actions ======
  if (a === 'addNewEx'){
    state.currentExerciseIdx = -1; // new
    state.view = 'editExercise'; render(); return;
  }
  if (a === 'editExFromList'){
    state.currentExerciseIdx = Number(btn.dataset.idx);
    state.view = 'editExercise'; render(); return;
  }
  if (a === 'moveExUp' || a === 'moveExDown'){
    const idx = Number(btn.dataset.idx);
    const dayKey = state.currentDay;
    const src = getCurrentSource(dayKey);
    let routine;
    if (src === 'personal'){ routine = (state.personalRoutines[state.currentUser]||{})[dayKey]; }
    else { routine = state.sharedRoutine && state.sharedRoutine[dayKey]; }
    if (!routine) return;
    const swap = a === 'moveExUp' ? idx - 1 : idx + 1;
    if (swap < 0 || swap >= routine.exercises.length) return;
    [routine.exercises[idx], routine.exercises[swap]] = [routine.exercises[swap], routine.exercises[idx]];
    if (src === 'personal'){
      await savePersonalRoutine(state.currentUser, state.personalRoutines[state.currentUser]);
    } else {
      await saveSharedRoutine(state.sharedRoutine);
    }
    render(); return;
  }
  if (a === 'deleteEx'){
    const idx = Number(btn.dataset.idx);
    const dayKey = state.currentDay;
    const src = getCurrentSource(dayKey);
    let routine = src === 'personal' ? (state.personalRoutines[state.currentUser]||{})[dayKey] : (state.sharedRoutine && state.sharedRoutine[dayKey]);
    if (!routine) return;
    const ek = exerciseKey(dayKey, idx);
    // count entries across all users for this exKey
    let totalEntries = 0;
    for (const u of state.users){ totalEntries += getEntries(u.id, ek).length; }
    openModal(`
      <h2 style="margin-bottom:8px;">Eliminar ejercicio</h2>
      <p style="font-size:14px;margin:0 0 14px;">¿Eliminar <strong>${esc(routine.exercises[idx].name)}</strong>?</p>
      ${totalEntries > 0 ? `<p class="muted" style="font-size:13px;margin:0 0 14px;">Tiene <strong>${totalEntries}</strong> entrenos registrados. Elige qué hacer:</p>
      <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:14px;">
        <label style="display:flex;align-items:flex-start;gap:8px;padding:10px;background:var(--bg-elev-2);border-radius:var(--radius-sm);cursor:pointer;">
          <input type="radio" name="exDelMode" value="keep" checked style="margin-top:3px;" />
          <div><div style="font-size:14px;font-weight:500;">Mantener historial</div>
          <div class="muted" style="font-size:12px;">Los datos se quedan en la base por si vuelves a agregar el ejercicio. Quedan ligados a la posición original.</div></div>
        </label>
        <label style="display:flex;align-items:flex-start;gap:8px;padding:10px;background:var(--bg-elev-2);border-radius:var(--radius-sm);cursor:pointer;">
          <input type="radio" name="exDelMode" value="purge" style="margin-top:3px;" />
          <div><div style="font-size:14px;font-weight:500;color:var(--danger);">Borrar también el historial</div>
          <div class="muted" style="font-size:12px;">Elimina ejercicio y todos sus entrenos. No se puede deshacer.</div></div>
        </label>
      </div>` : ''}
      <div style="display:flex;gap:8px;">
        <button data-action="closeModal" style="flex:1;padding:10px;">Cancelar</button>
        <button class="danger" data-action="confirmDeleteEx" data-idx="${idx}" style="flex:1;padding:10px;font-weight:600;">Eliminar</button>
      </div>
    `, () => { modalRoot.querySelectorAll('[data-action]').forEach(el => el.addEventListener('click', handle)); });
    return;
  }
  if (a === 'confirmDeleteEx'){
    const idx = Number(btn.dataset.idx);
    const dayKey = state.currentDay;
    const src = getCurrentSource(dayKey);
    const purge = (document.querySelector('input[name="exDelMode"]:checked')||{}).value === 'purge';
    let routine = src === 'personal' ? (state.personalRoutines[state.currentUser]||{})[dayKey] : (state.sharedRoutine && state.sharedRoutine[dayKey]);
    if (!routine) return;
    routine.exercises.splice(idx, 1);
    if (src === 'personal'){
      await savePersonalRoutine(state.currentUser, state.personalRoutines[state.currentUser]);
    } else {
      await saveSharedRoutine(state.sharedRoutine);
    }
    if (purge){
      // remove that exercise's key from ALL users' logs
      // but note: keys are dayKey:index, deletion shifts indexes — to keep simplicity we only purge the specific key
      const ek = exerciseKey(dayKey, idx);
      for (const u of state.users){
        if (state.logs[u.id] && state.logs[u.id][ek]){
          delete state.logs[u.id][ek];
          await saveUserLogs(u.id, state.logs[u.id]);
        }
      }
    }
    closeModal(); toast('Ejercicio eliminado'); render(); return;
  }
  if (a === 'saveRoutineMeta'){
    const dayKey = state.currentDay;
    const src = getCurrentSource(dayKey);
    const label = (document.getElementById('dayLabel').value || '').trim() || 'Día';
    const focus = (document.getElementById('dayFocus').value || '').trim();
    if (src === 'personal'){
      const pr = state.personalRoutines[state.currentUser] || {};
      if (!pr[dayKey]) pr[dayKey] = { exercises: [] };
      pr[dayKey].label = label; pr[dayKey].focus = focus;
      pr[dayKey].icon = pr[dayKey].icon || 'ti-barbell';
      state.personalRoutines[state.currentUser] = pr;
      await savePersonalRoutine(state.currentUser, pr);
    } else {
      if (!state.sharedRoutine) state.sharedRoutine = {};
      if (!state.sharedRoutine[dayKey]) state.sharedRoutine[dayKey] = { exercises: [] };
      state.sharedRoutine[dayKey].label = label;
      state.sharedRoutine[dayKey].focus = focus;
      state.sharedRoutine[dayKey].icon = state.sharedRoutine[dayKey].icon || 'ti-barbell';
      await saveSharedRoutine(state.sharedRoutine);
    }
    toast('Cambios guardados');
    state.view = 'day'; render(); return;
  }

  // ====== EDIT EXERCISE actions ======
  if (a === 'cycleMuscle'){
    const mid = btn.dataset.mid;
    const ed = window._editEx;
    const inP = ed.primary.indexOf(mid);
    const inS = ed.secondary.indexOf(mid);
    if (inP === -1 && inS === -1){ ed.primary.push(mid); }
    else if (inP !== -1){ ed.primary.splice(inP,1); ed.secondary.push(mid); }
    else if (inS !== -1){ ed.secondary.splice(inS,1); }
    // re-render only the muscle grid
    const grid = document.getElementById('muscleGrid');
    grid.innerHTML = MUSCLE_IDS.map(m => {
      const isP = ed.primary.includes(m);
      const isS = ed.secondary.includes(m);
      const cls = isP ? 'primary' : isS ? 'secondary' : '';
      return `<div class="muscle-chip ${cls}" data-action="cycleMuscle" data-mid="${m}">
        <span>${MUSCLES[m].label}</span>
        <span style="font-size:10px;font-weight:600;">${isP?'●●':isS?'●':''}</span>
      </div>`;
    }).join('');
    grid.querySelectorAll('[data-action]').forEach(el => el.addEventListener('click', handle));
    return;
  }
  if (a === 'addAlt'){
    const c = document.getElementById('altsContainer');
    const i = c.children.length;
    const div = document.createElement('div');
    div.className = 'alt-row';
    div.innerHTML = `<input type="text" class="alt-in" data-i="${i}" value="" maxlength="80" placeholder="Alternativa..." />
      <button data-action="removeAlt" data-i="${i}" class="ghost-danger" style="padding:6px;border:none;"><i class="ti ti-x" style="font-size:14px;"></i></button>`;
    c.appendChild(div);
    div.querySelector('[data-action]').addEventListener('click', handle);
    div.querySelector('input').focus();
    return;
  }
  if (a === 'removeAlt'){
    btn.closest('.alt-row').remove();
    return;
  }
  if (a === 'saveExercise'){
    const dayKey = state.currentDay;
    const src = getCurrentSource(dayKey);
    const idx = state.currentExerciseIdx;
    const isNew = idx === -1 || idx == null;
    const ed = window._editEx;
    ed.name = (document.getElementById('exName').value || '').trim();
    ed.video = (document.getElementById('exVideo').value || '').trim();
    ed.measurement = document.getElementById('exMeasurement')?.value || ed.measurement || 'weight_reps';
    ed.alts = Array.from(document.querySelectorAll('.alt-in')).map(i => i.value.trim()).filter(Boolean);
    if (!ed.name){ toast('Ingresa un nombre'); return; }
    let routine;
    if (src === 'personal'){
      const pr = state.personalRoutines[state.currentUser] || {};
      if (!pr[dayKey]) pr[dayKey] = { label:'Día', focus:'', icon:'ti-barbell', exercises:[] };
      routine = pr[dayKey];
      state.personalRoutines[state.currentUser] = pr;
    } else {
      if (!state.sharedRoutine) state.sharedRoutine = {};
      if (!state.sharedRoutine[dayKey]) state.sharedRoutine[dayKey] = { label:'Día', focus:'', icon:'ti-barbell', exercises:[] };
      routine = state.sharedRoutine[dayKey];
    }
    if (!isNew && document.getElementById('resetExerciseBaseline')?.checked){
      const previous = routine.exercises[idx] || {};
      const previousKey = exerciseKey(dayKey, idx);
      if (!confirm(`¿Reiniciar el progreso de "${previous.name || 'este ejercicio'}"?\n\nNo se borra el historial anterior. Solo evita que el nuevo ejercicio compare contra esos pesos/reps.`)) return;
      applyExerciseBaselineReset(ed, previous, previousKey);
    }
    delete ed._resetProgressBaseline;
    if (isNew){ routine.exercises.push(ed); }
    else { routine.exercises[idx] = ed; }
    if (src === 'personal'){ await savePersonalRoutine(state.currentUser, state.personalRoutines[state.currentUser]); }
    else { await saveSharedRoutine(state.sharedRoutine); }
    toast(isNew ? 'Ejercicio creado' : 'Ejercicio actualizado');
    state.view = 'editRoutine'; render(); return;
  }
}

// ====== REALTIME SUBSCRIPTIONS ======
let unsubs = [];
function subscribeRealtime(){
  if (!firebaseReady) return;
  unsubs.forEach(u => u && u());
  unsubs = [];
  const gid = groupPath();
  unsubs.push(onSnapshot(doc(db,'salas',gid,'meta','users'), async (snap)=>{
    if (gid !== state.currentGroup) return;
    if (state.suppressRealtimeRender) return; // skip during group switch
    if (!snap.exists()) return;
    const rawUsers = snap.data().users || [];
    // Quick path: if raw matches current state, no work needed
    if (JSON.stringify(rawUsers) === JSON.stringify(state.users)) return;
    const newUsers = await filterUsersForGroup(gid, rawUsers, state.groupConfig, [state.currentUser, loadMe(gid)]);
    if (gid !== state.currentGroup) return;
    if (state.suppressRealtimeRender) return;
    if (gid !== DEFAULT_GROUP && JSON.stringify(rawUsers) !== JSON.stringify(newUsers)){
      await saveUsersForGroup(gid, newUsers);
    }
    const changed = JSON.stringify(newUsers) !== JSON.stringify(state.users);
    state.users = newUsers;
    // if current user got deleted, log out
    if (state.currentUser && !state.users.find(u => u.id === state.currentUser)){
      state.currentUser = null; clearMe(); clearAuth();
      toast('Tu usuario fue eliminado');
      state.view = 'setup'; state.setupStep = state.users.length ? 'pickUser' : 'newUser';
      render(); return;
    }
    if (changed) requestRealtimeRender();
  }, console.error));
  unsubs.push(onSnapshot(doc(db,'salas',gid,'meta','config'), (snap)=>{
    if (gid !== state.currentGroup) return;
    if (snap.exists()){
      state.groupConfig = normalizeGroupConfig(snap.data(), gid);
      state.invitationPassword = state.groupConfig.invitationPassword || INVITATION_PASSWORD_DEFAULT;
    }
  }, console.error));
  unsubs.push(onSnapshot(doc(db,'salas',gid,'routines','shared'), (snap)=>{
    if (gid !== state.currentGroup) return;
    if (state.suppressRealtimeRender) return;
    if (snap.exists() && snap.data().routine){
      const r = snap.data().routine;
      if (JSON.stringify(r) !== JSON.stringify(state.sharedRoutine)){
        state.sharedRoutine = r;
        requestRealtimeRender();
      }
    }
  }, console.error));
  unsubs.push(onSnapshot(collection(db,'salas',gid,'logs'), (snap)=>{
    if (gid !== state.currentGroup) return;
    if (state.suppressRealtimeRender) return;
    let changed = false;
    snap.docChanges().forEach(ch => {
      const id = ch.doc.id;
      if (ch.type === 'removed'){
        if (state.logs[id]){ delete state.logs[id]; changed = true; }
      } else {
        const data = ch.doc.data();
        if (JSON.stringify(state.logs[id]) !== JSON.stringify(data)){
          state.logs[id] = data; changed = true;
        }
      }
    });
    if (changed) requestRealtimeRender();
  }, console.error));
  unsubs.push(onSnapshot(collection(db,'salas',gid,'personalRoutines'), (snap)=>{
    if (gid !== state.currentGroup) return;
    if (state.suppressRealtimeRender) return;
    let changed = false;
    snap.docChanges().forEach(ch => {
      const id = ch.doc.id;
      if (ch.type === 'removed'){
        if (state.personalRoutines[id]){ delete state.personalRoutines[id]; changed = true; }
      } else {
        const data = ch.doc.data().routine || {};
        if (JSON.stringify(state.personalRoutines[id]) !== JSON.stringify(data)){
          state.personalRoutines[id] = data; changed = true;
        }
      }
    });
    if (changed) requestRealtimeRender();
  }, console.error));
  // Library (shared) realtime
  unsubs.push(onSnapshot(collection(db,'salas',gid,'library'), (snap)=>{
    if (gid !== state.currentGroup) return;
    if (state.suppressRealtimeRender) return;
    let changed = false;
    snap.docChanges().forEach(ch => {
      const id = ch.doc.id;
      if (ch.type === 'removed'){
        if (state.library[id]){ delete state.library[id]; changed = true; }
      } else {
        const data = ch.doc.data();
        if (JSON.stringify(state.library[id]) !== JSON.stringify(data)){
          state.library[id] = data; changed = true;
        }
      }
    });
    if (changed) requestRealtimeRender();
  }, console.error));
}

// ====== INIT ======
// Delegated handler for password visibility toggle buttons (works for any .pw-toggle anywhere)
document.body.addEventListener('click', (e) => {
  const btn = e.target.closest('.pw-toggle');
  if (!btn) return;
  const targetId = btn.dataset.pwTarget;
  const input = targetId ? document.getElementById(targetId) : btn.previousElementSibling;
  if (!input) return;
  const showing = input.type === 'text';
  input.type = showing ? 'password' : 'text';
  const icon = btn.querySelector('i');
  if (icon) icon.className = `ti ${showing ? 'ti-eye' : 'ti-eye-off'}`;
  btn.setAttribute('aria-label', showing ? 'Mostrar contraseña' : 'Ocultar contraseña');
});

async function init(){
  removeStrayBodyTextNodes();
  // Sesión 3: Cargar Free Exercise DB en background para imágenes
  initFreeExerciseDb();
  // Sesión 2: restore gradient toggle from localStorage
  try {
    const saved = localStorage.getItem('muscleGradientMap');
    if (saved !== null) state.muscleGradientMap = saved === '1';
  } catch(e){}
  rememberGroup(state.currentGroup);
  if (firebaseReady && auth){
    onAuthStateChanged(auth, handleAuthState);
    render();
    return;
  }
  await reloadGroup();
}
init();
